<script>(function(){var ss=window.speechSynthesis,vs=[],ko=null,keep=[];function load(){if(!ss)return;try{vs=ss.getVoices()||[];}catch(e){vs=[];}ko=null;for(var i=0;i<vs.length;i++){var l=String(vs[i].lang||'').toLowerCase().replace('_','-');if(l.indexOf('ko')===0&&(!ko||vs[i].localService))ko=vs[i];}}if(ss){load();try{ss.addEventListener('voiceschanged',load);}catch(e){ss.onvoiceschanged=load;}}window.kidsVoiceInfo=function(){load();return {api:!!ss,n:vs.length,ko:ko?ko.name+' ('+ko.lang+')':''};};window.kidsSpeak=function(t,rate){if(!ss)return;try{var busy=ss.speaking||ss.pending;if(busy)ss.cancel();if(!ko)load();var u=new SpeechSynthesisUtterance(String(t));u.lang=ko?ko.lang:'ko-KR';if(ko)u.voice=ko;u.rate=rate||0.95;u.volume=1;keep.push(u);if(keep.length>6)keep.shift();var go=function(){try{if(ss.paused)ss.resume();ss.speak(u);}catch(e){}};if(busy)setTimeout(go,150);else go();}catch(e){}};function unlock(){document.removeEventListener('pointerdown',unlock,true);try{if(ss&&!ss.speaking&&!ss.pending){var u=new SpeechSynthesisUtterance(' ');u.volume=0;keep.push(u);ss.speak(u);}}catch(e){}}document.addEventListener('pointerdown',unlock,true);})();</script>

<style>
:root{--bg:#fff0f6;--ink:#3b2a33;--sub:#8a6f7c;--main:#f06595;--main-d:#d6336c;--line:#fcd6e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#app{height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;padding:12px 14px}
#app.home{overflow-y:auto;padding-bottom:70px}
h1{font-weight:normal;font-size:44px;text-align:center;margin:6px 0 8px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tab{font-size:24px;padding:10px 22px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);border:4px solid transparent}
.tab.on{border-color:var(--main)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
@media (max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:#fff;border-radius:18px;padding:6px 6px 8px;box-shadow:0 4px 0 var(--line);font-size:19px;display:flex;flex-direction:column;align-items:center;position:relative}
.pc img{width:100%;border-radius:12px;display:block;aspect-ratio:4/3;background:#fff;border:2px solid #f3e1ea}
.pc span{margin-top:4px}
.pc .x{position:absolute;right:4px;top:4px;background:#fff;border-radius:999px;font-size:16px;padding:2px 8px;box-shadow:0 2px 0 var(--line)}
.pc:active,.tab:active,.tb:active,.btn:active{transform:translateY(3px);box-shadow:none}
.sub{text-align:center;color:var(--sub);font-size:19px;margin-top:10px}
.tgl{display:flex;gap:10px;justify-content:center;margin-top:14px}
.tgl button{background:#fff;border-radius:999px;padding:8px 16px;font-size:20px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.tgl button.on{border-color:var(--main)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tb{background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 3px 0 var(--line);font-size:20px;white-space:nowrap;border:3px solid transparent}
.tb.on{border-color:var(--main);background:#fff5f9}
.tb.ok{background:#2ecc71;color:#fff;box-shadow:0 4px 0 #22a35a}
.grow{flex:1}
.play{flex:1;min-height:0;display:flex;gap:12px}
.cbox{flex:1;min-width:0;min-height:0;position:relative}
.cwrap{position:absolute;touch-action:none;background:#fff;border-radius:10px;box-shadow:0 0 0 5px #fff,0 6px 0 5px var(--line);overflow:hidden}
.cwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#lines{pointer-events:none}
.pal{display:grid;grid-template-columns:repeat(3,58px);gap:8px;align-content:center;justify-content:center}
@media (orientation:portrait){.play{flex-direction:column}.pal{grid-template-columns:repeat(10,1fr);gap:6px}.cbox{flex:1}}
.sw{width:58px;height:58px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
@media (orientation:portrait){.sw{width:100%;height:auto;aspect-ratio:1}}
.sw.on{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.sw.er{background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;border-color:#eee}
.cur{width:28px;height:28px;border-radius:50%;display:inline-block;vertical-align:middle;border:3px solid #fff;box-shadow:0 0 0 2px #ccc}
.overlay{position:fixed;inset:0;background:rgba(60,30,45,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:20px;max-width:520px;width:100%;text-align:center;max-height:100%;overflow-y:auto}
.panel img{width:100%;border-radius:14px;border:2px solid #f3e1ea;display:block}
.btn{display:block;width:100%;font-size:26px;padding:14px;border-radius:20px;background:var(--main);color:#fff;box-shadow:0 5px 0 var(--main-d);margin-top:12px;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

'use strict';
/*ART-START*/
var INK='#2b2b2b';
function rf(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rf(a,b+1));}
function f1(n){return Math.round(n*10)/10;}
function starPath(cx,cy,ro,rin,n){var p='';for(var i=0;i<n*2;i++){var r=i%2?rin:ro,a=-Math.PI/2+i*Math.PI/n;p+=(i?'L':'M')+f1(cx+r*Math.cos(a))+' '+f1(cy+r*Math.sin(a));}return p+'Z';}
function circ(cx,cy,r){return 'M'+f1(cx-r)+' '+f1(cy)+'a'+f1(r)+' '+f1(r)+' 0 1 0 '+f1(2*r)+' 0a'+f1(r)+' '+f1(r)+' 0 1 0 '+f1(-2*r)+' 0';}
// 숨길 물건 (100x100 상자, 중심 50,50)

 ['숟가락','M50 8C36 8 32 30 40 40C44 45 47 46 48 50L46 90Q50 96 54 90L52 50C53 46 56 45 60 40C68 30 64 8 50 8Z'],

 ['바나나','M14 28Q18 80 70 86Q86 86 92 78Q60 74 44 58Q30 44 28 24Q22 18 14 28ZM14 28L9 18L16 16'],
 ['종','M50 14Q30 16 28 44Q27 66 14 76L86 76Q73 66 72 44Q70 16 50 14ZM42 76Q50 92 58 76M50 14L50 6'+circ(50,4,3)],
 ['망치','M12 16L62 16L62 38L12 38Q4 27 12 16ZM34 38L34 94L46 94L46 38'],

 ['칫솔','M8 66L70 42L74 52L12 76ZM70 42L90 34L94 46L74 52M76 40L73 30M82 38L79 28M88 35L85 25'],
 ['장갑','M30 92L30 46Q30 14 54 14Q76 14 74 46L74 52Q86 40 93 48Q97 56 80 70L72 92ZM28 82L74 82'],

 ['연','M50 6L82 40L50 80L18 40ZM50 6L50 80M18 40L82 40M50 80Q40 88 50 92Q60 96 50 100'],
 ['당근','M26 26Q38 16 50 28L82 88Q84 95 76 92L24 40Q18 32 26 26ZM28 26Q24 12 14 10M36 23Q38 9 46 6M40 48L47 43M54 64L61 59'],
 ['장화','M30 8L56 8L56 58Q56 65 64 67L84 73Q94 77 92 90L28 90ZM28 80L92 80M30 20L56 20'],
 ['깃털','M82 8Q30 26 20 80Q18 90 22 92Q76 76 82 8ZM82 8Q52 50 20 92M54 34L42 30M46 50L32 48M62 46L68 56M52 64L58 72'],
 ['빗','M8 32L92 32L92 48L8 48ZM16 48L16 74M26 48L26 74M36 48L36 74M46 48L46 74M56 48L56 74M66 48L66 74M76 48L76 74M86 48L86 74'],
 ['안경',circ(26,52,16)+circ(74,52,16)+'M42 50Q50 42 58 50M10 50L4 38M90 50L96 38'],
 ['병','M42 6L58 6L58 24Q72 32 72 48L72 88Q50 95 28 88L28 48Q28 32 42 24ZM40 14L60 14M28 60L72 60'],

];
// 아이콘을 세로(위쪽이 위)로 세우는 회전값, 긴 쪽 길이(상자 대비)
var ICON_UP={'숟가락':0,'우산':0,'양말':0,'열쇠':90,'물고기':90,'하트':0,'달':0,'별':0,'버섯':0,'컵':0,'모자':0,'바나나':-30,'종':0,'망치':0,'연필':135,'칫솔':-69,'장갑':0,'초':0,'연':0,'당근':39,'장화':0,'깃털':-36,'빗':0,'안경':0,'병':0,'아이스크림':0,'풍선':0};
var ICON_LEN={'연필':1.05,'칫솔':0.9,'깃털':1.0,'당근':0.85,'열쇠':0.8,'물고기':0.84,'숟가락':0.88,'초':0.9,'병':0.94,'빗':0.84,'바나나':0.85};
function iconIdx(name){for(var i=0;i<ICONS.length;i++)if(ICONS[i][0]===name)return i;return -1;}
function iconSvg(i,cx,cy,s,rot,opt){opt=opt||{};var sw=(opt.sw||2.8)*100/s;
  return '<g transform="translate('+f1(cx)+' '+f1(cy)+') rotate('+f1(rot||0)+') scale('+f1(s/100*1000)/1000+') translate(-50 -50)"><path d="'+ICONS[i][1]+'" fill="'+(opt.fill||'none')+'" stroke="'+(opt.color||INK)+'" stroke-width="'+f1(sw)+'" stroke-linejoin="round" stroke-linecap="round"/></g>';}

// ---------- 장면 부품 ----------
function P(d,fill,sw){return '<path d="'+d+'" fill="'+(fill||'none')+'" stroke="'+INK+'" stroke-width="'+(sw||3)+'" stroke-linejoin="round" stroke-linecap="round"/>';}
function blobD(cx,cy,rx,ry,n,jit){var pts=[],off=rf(0,6.28),i;for(i=0;i<n;i++){var a=off+i*6.2832/n,k=1+rf(-jit,jit);pts.push([cx+rx*k*Math.cos(a),cy+ry*k*Math.sin(a)]);}
  var d='M'+f1(pts[0][0])+' '+f1(pts[0][1]);for(i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n],ch=Math.hypot(q[0]-p[0],q[1]-p[1])*0.6;d+='A'+f1(ch)+' '+f1(ch)+' 0 0 1 '+f1(q[0])+' '+f1(q[1]);}return d+'Z';}
function leafMarks(cx,cy,rx,ry,n){var d='';for(var i=0;i<n;i++){var a=rf(0,6.28),r=Math.sqrt(Math.random())*0.82,x=cx+rx*r*Math.cos(a),y=cy+ry*r*Math.sin(a),s=rf(7,13),t=ri(0,2);
  if(t===0)d+='M'+f1(x)+' '+f1(y)+'q'+f1(s/2)+' '+f1(-s*0.6)+' '+f1(s)+' 0';else if(t===1)d+='M'+f1(x)+' '+f1(y)+'q'+f1(s/2)+' '+f1(s*0.6)+' '+f1(s)+' 0';else d+='M'+f1(x)+' '+f1(y)+'l'+f1(s*0.4)+' '+f1(s*0.6)+'l'+f1(s*0.4)+' '+f1(-s*0.6);}return d;}
function tuft(x,y,s){return 'M'+f1(x-s*0.4)+' '+f1(y)+'L'+f1(x-s*0.7)+' '+f1(y-s*0.8)+'M'+f1(x)+' '+f1(y)+'L'+f1(x+rf(-2,2))+' '+f1(y-s)+'M'+f1(x+s*0.4)+' '+f1(y)+'L'+f1(x+s*0.7)+' '+f1(y-s*0.8);}
function slot(L,g,x,y,len,fits,o){o=o||{};var p={g:g||'',x:x-len/2,y:y-len/2,w:len,h:len,alt:{x:x,y:y,len:len,fits:fits,rot:o.rot||0,fill:o.fill||'none',sw:o.sw||2.2,lvl:o.lvl||'mid'}};if(o.tex)p.tex=1;if(o.rm)p.rm=1;if(o.small)p.small=1;L.push(p);return p;}
function part(list,g,x,y,w,h,o){var p={g:g,x:x,y:y,w:w,h:h};for(var k in (o||{}))p[k]=o[k];list.push(p);return p;}

function addCloud(L,cx,cy,w){var d=blobD(cx,cy,w/2,w*0.26,ri(7,10),0.12);part(L,P(d,'#fff'),cx-w/2,cy-w*0.3,w,w*0.6,{rm:1,dense:1});slot(L,P('M'+f1(cx-w*0.12)+' '+f1(cy+w*0.03)+'q'+f1(w*0.12)+' '+f1(-w*0.1)+' '+f1(w*0.24)+' 0',null,2.2),cx,cy,w*0.3,['바나나','달'],{rot:90,lvl:'mid'});}
function addSun(L,cx,cy,r){var d=circ(cx,cy,r),rays='';for(var i=0;i<12;i++){var a=i*Math.PI/6;rays+='M'+f1(cx+(r+8)*Math.cos(a))+' '+f1(cy+(r+8)*Math.sin(a))+'L'+f1(cx+(r+22)*Math.cos(a))+' '+f1(cy+(r+22)*Math.sin(a));}
  part(L,P(d,'#fff')+P(rays),cx-r-22,cy-r-22,2*r+44,2*r+44,{rm:1});}
function addBird(L,x,y,s){part(L,P('M'+f1(x-s)+' '+f1(y)+'Q'+f1(x-s/2)+' '+f1(y-s*0.7)+' '+f1(x)+' '+f1(y)+'Q'+f1(x+s/2)+' '+f1(y-s*0.7)+' '+f1(x+s)+' '+f1(y),null,2.6),x-s,y-s,2*s,s*1.4,{rm:1,flip:1,bird:1});}
function addHills(L,gy){var y1=gy-rf(60,110),y2=gy-rf(40,90);var d='M0 '+gy+'L0 '+f1(y1)+'Q'+f1(rf(150,300))+' '+f1(y1-rf(40,80))+' '+f1(rf(420,520))+' '+f1(y2)+'T1000 '+f1(gy-rf(50,100))+'L1000 '+gy+'Z';
  var tex='';for(var i=0;i<14;i++){var x=rf(30,970),y=gy-rf(8,40);tex+=tuft(x,y,rf(7,11));}
  part(L,P(d,'#fff'),0,gy-200,1000,200,{dense:1});part(L,P(tex,null,2),0,gy-60,1000,60,{});}
function addGround(L,gy,dens){part(L,P('M0 '+gy+'Q250 '+f1(gy-8)+' 500 '+gy+'T1000 '+gy),0,gy-5,1000,10);
  var t='';for(var i=0;i<Math.round(26*dens)+8;i++){t+=tuft(rf(10,990),rf(gy+14,740),rf(9,16));}part(L,P(t,null,2.2),0,gy,1000,750-gy,{dense:1});
  for(i=0;i<4;i++){var x=rf(40,960),y=rf(gy+40,725);slot(L,P(tuft(x,y+7,14),null,2.2),x,y,rf(40,50),['빗','칫솔'],{rot:pick2([180,90,-90])+rf(-10,10),fill:'#fff',sw:2.2,lvl:'mid'});}}
function addTree(L,x,gy,h,dens){
  var tw=h*0.07,cy=gy-h*0.62,R=h*0.36;
  var trunk='M'+f1(x-tw)+' '+gy+'Q'+f1(x-tw*0.6)+' '+f1(gy-h*0.3)+' '+f1(x-tw*0.7)+' '+f1(cy+R*0.5)+'M'+f1(x+tw)+' '+gy+'Q'+f1(x+tw*0.6)+' '+f1(gy-h*0.3)+' '+f1(x+tw*0.7)+' '+f1(cy+R*0.5);
  var bark='';for(var i=0;i<3;i++){var by=gy-h*rf(0.08,0.3);bark+='M'+f1(x-tw*0.4)+' '+f1(by)+'q'+f1(tw*0.4)+' '+f1(-5)+' '+f1(tw*0.8)+' 0';}
  part(L,P(trunk+'M'+f1(x-tw)+' '+gy+'L'+f1(x+tw)+' '+gy,'#fff')+P(bark,null,2),x-tw,cy,tw*2,gy-cy,{});
  part(L,P(blobD(x,cy,R*1.05,R*0.9,ri(10,14),0.1),'#fff'),x-R,cy-R,2*R,2*R*0.9,{dense:1,canopy:1});
  part(L,P(leafMarks(x,cy,R,R*0.85,Math.round(R*0.35*dens)+6),null,2.1),x-R,cy-R,2*R,2*R,{tex:1});
  var na=ri(1,3);for(var j=0;j<na;j++){var a=rf(0,6.28),rr=rf(0.2,0.7)*R,ax=x+rr*Math.cos(a),ay=cy+rr*Math.sin(a)*0.8;var ap=slot(L,P(circ(ax,ay,9),'#fff')+P('M'+f1(ax)+' '+f1(ay-9)+'l2 -6',null,2),ax,ay,26,['풍선','종','하트'],{fill:'#fff',sw:2.4,lvl:'easy',rm:1,small:1});}
  leafSlots(L,x,cy,R,R*0.8,4);
}
function leafSlots(L,cx,cy,rx,ry,n){var pts=[];for(var i=0;i<n;i++){for(var t=0;t<20;t++){var a=rf(0,6.28),r=Math.sqrt(Math.random())*0.7,x=cx+rx*r*Math.cos(a),y=cy+ry*r*Math.sin(a);
  if(pts.every(function(p){return Math.hypot(p[0]-x,p[1]-y)>rx*0.5;})){pts.push([x,y]);break;}}}
  pts.forEach(function(p){slot(L,P('M'+f1(p[0]-6)+' '+f1(p[1])+'q6 -7 12 0',null,2.1),p[0],p[1],Math.min(54,rx*0.5),['깃털','숟가락','바나나','당근','열쇠','하트','달','양말'],{rot:rf(-180,180),lvl:'hard',tex:1});});}
function addPine(L,x,gy,h,dens){var w=h*0.42,d='',tex='';

function tone(f,t,dur,type,vol,f2){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(er){}}

  else if(k==='undo')tone(500,t,0.1,'triangle',0.08,300);
  else if(k==='win')[523,659,784,1047,1319].forEach(function(f,i){tone(f,t+i*0.1,0.22,'square',0.05);tone(f,t+i*0.1,0.22,'sine',0.1);});}

function layoutC(){var b=document.getElementById('cbox'),W=b.clientWidth,H=b.clientHeight,w=Math.min(W,H*4/3),hh=w*0.75,cw=document.getElementById('cw');

function setupCanvas(){
  var im=new Image();im.onload=function(){
    if(!G)return;var t=document.createElement('canvas');t.width=VW;t.height=VH;var x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,VW,VH);x.drawImage(im,0,0,VW,VH);
    var src=x.getImageData(0,0,VW,VH).data,n=VW*VH,mask=new Uint8Array(n),li=x.createImageData(VW,VH),ld=li.data;
    for(var i=0;i<n;i++){var q=i*4,lum=(src[q]*3+src[q+1]*6+src[q+2])/10;if(lum<150)mask[i]=1;if(lum<235){ld[q]=34;ld[q+1]=34;ld[q+2]=34;ld[q+3]=Math.min(255,(255-lum)*1.25);}}
    G.mask=mask;G.lineImg=li;G.paintImg=null;G.ready=true;restoreCanvas();};
  im.src=url(G.svg);
}
function restoreCanvas(){var pc=document.getElementById('paint'),lc=document.getElementById('lines');if(!pc||!G.ready)return;

  lc.getContext('2d').putImageData(G.lineImg,0,0);}
function pushUndo(){G.undo.push(new Uint8ClampedArray(G.paintImg.data));if(G.undo.length>6)G.undo.shift();}
function hexRgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function fillAt(x0,y0){
  var mask=G.mask,W=VW,H=VH;x0=Math.round(x0);y0=Math.round(y0);
  if(x0<0||y0<0||x0>=W||y0>=H)return;
  if(mask[y0*W+x0]){var best=-1,bd=99;for(var dy=-8;dy<=8;dy++)for(var dx=-8;dx<=8;dx++){var xx=x0+dx,yy=y0+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;var dd=dx*dx+dy*dy;if(!mask[yy*W+xx]&&dd<bd){bd=dd;best=yy*W+xx;}}if(best<0)return;x0=best%W;y0=Math.floor(best/W);}
  var reg=new Uint8Array(W*H),stack=[y0*W+x0],minx=x0,maxx=x0,miny=y0,maxy=y0;reg[y0*W+x0]=1;
  while(stack.length){var i=stack.pop(),x=i%W,y=(i-x)/W;
    var l=x;while(l>0&&!mask[i-(x-l)-1]&&!reg[i-(x-l)-1])l--;var r=x;while(r<W-1&&!mask[i+(r-x)+1]&&!reg[i+(r-x)+1])r++;
    var base=y*W;if(l<minx)minx=l;if(r>maxx)maxx=r;if(y<miny)miny=y;if(y>maxy)maxy=y;
    for(var k=l;k<=r;k++){reg[base+k]=1;if(y>0){var u=base-W+k;if(!mask[u]&&!reg[u]){reg[u]=1;stack.push(u);}}if(y<H-1){var dn=base+W+k;if(!mask[dn]&&!reg[dn]){reg[dn]=1;stack.push(dn);}}}}
  // 선 밑으로 2칸 번지게 (흰 틈 없애기)
  for(var pass=2;pass<=3;pass++){var x1=Math.max(1,minx-1),x2=Math.min(W-2,maxx+1),y1=Math.max(1,miny-1),y2=Math.min(H-2,maxy+1);
    for(var yy2=y1;yy2<=y2;yy2++)for(var xx2=x1;xx2<=x2;xx2++){var j=yy2*W+xx2;if(reg[j]||!mask[j])continue;if(reg[j-1]===pass-1||reg[j+1]===pass-1||reg[j-W]===pass-1||reg[j+W]===pass-1||(pass===2&&(reg[j-1]||reg[j+1]||reg[j-W]||reg[j+W])))reg[j]=pass;}
    minx=x1;maxx=x2;miny=y1;maxy=y2;}
  pushUndo();var d=G.paintImg.data,cc=hexRgb(D.color);
  for(var y3=miny;y3<=maxy;y3++)for(var x3=minx;x3<=maxx;x3++){var m=y3*W+x3;if(reg[m]){var q=m*4;d[q]=cc[0];d[q+1]=cc[1];d[q+2]=cc[2];d[q+3]=255;}}
  document.getElementById('paint').getContext('2d').putImageData(G.paintImg,0,0);G.touched=true;sfx('fill');
}
function bindC(){

  function pt(ev){var r=cw.getBoundingClientRect();return {x:(ev.clientX-r.left)*VW/r.width,y:(ev.clientY-r.top)*VH/r.height};}
