function resample(p,n){var L=[0];for(var i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));var T=L[L.length-1],out=[];if(T<0.01){for(i=0;i<n;i++)out.push(p[0]);return out;}
  var k=0;for(i=0;i<n;i++){var d=T*i/(n-1);while(k<L.length-2&&L[k+1]<d)k++;var seg=L[k+1]-L[k]||1,t=(d-L[k])/seg;out.push([p[k][0]+(p[k+1][0]-p[k][0])*t,p[k][1]+(p[k+1][1]-p[k][1])*t]);}return out;}

function judge(p){

  else{var us=resample(p,N),dense=resample(p,120),gd=resample(g,120);
    var startOk=Math.hypot(us[0][0]-gs[0][0],us[0][1]-gs[0][1])<20,endOk=Math.hypot(us[N-1][0]-gs[N-1][0],us[N-1][1]-gs[N-1][1])<22,
      midOk=Math.hypot(us[8][0]-gs[8][0],us[8][1]-gs[8][1])<24,cov=0,dev=0;
    gs.forEach(function(q){if(dmin(q,dense)<15)cov++;});us.forEach(function(q){dev+=dmin(q,gd);});dev/=N;
    ok=startOk&&endOk&&midOk&&cov/N>=0.8&&dev<12;
    why=!startOk?'<b style="color:#f76707">●</b> 점에서 시작해요':(!endOk||!midOk)?'화살표 방향으로 그어 봐요':'선을 따라 그어 봐요';}
  if(ok){G.si++;G.fails=0;sfx('stroke');drawPad();
    if(G.si>=STROKES[G.ch].length){traceDone();return;}setTMsg('<span class="good">잘했어요! 👍</span> '+(G.si+1)+'번 선을 그어요');return;}
  G.fails++;G.miss++;sfx('no');document.getElementById('ink').setAttribute('points','');
  if(G.fails>=2){setTMsg('💡 이렇게 그어요 👀');demo();}else setTMsg('<span class="bad">'+why+'</span>');
}
var demoT=null;
function stopDemo(){if(demoT){clearInterval(demoT);demoT=null;}if(G)G.demo=false;var d=document.getElementById('dot');if(d)d.style.display='none';}
function demo(){stopDemo();if(G.si>=STROKES[G.ch].length)return;var g=resample(STROKES[G.ch][G.si],50),i=0,d=document.getElementById('dot'),ink=document.getElementById('ink');G.demo=true;d.style.display='';var trail=[];
  demoT=setInterval(function(){if(!document.getElementById('dot')){stopDemo();return;}if(i>=g.length){stopDemo();ink.setAttribute('points','');G.fails=1;setTMsg('이제 따라 그어 봐요! '+(G.si+1)+'번 선');return;}
    d.setAttribute('cx',g[i][0]);d.setAttribute('cy',g[i][1]);trail.push(g[i]);ink.setAttribute('points',pts(trail));ink.setAttribute('stroke','#ffa94d');i++;},28);
  setTimeout(function(){var e=document.getElementById('ink');if(e)e.setAttribute('stroke','#fa5252');},28*52);}
function traceDone(){
  var ch=G.ch;D.trace[ch]=1;save();sfx('win');confetti();var I=info(ch);say(I[1]+'! 멋지게 썼어요!');setTMsg('<span class="good">완성! 멋지게 썼어요 🎉</span>');
  var list=ALL.map(function(a){return a[0];}),nx=list[(list.indexOf(ch)+1)%list.length];
  var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><div style="font-size:120px;line-height:1;color:var(--main)">'+ch+'</div><div style="font-size:28px;margin-top:6px">'+I[1]+' 완성! ⭐</div><button class="btn" id="nx">다음 글자 '+nx+' ▶</button><button class="btn ghost" id="ag">한 번 더 쓰기</button><button class="btn ghost" id="ls">글자 고르기</button></div>';
  setTimeout(function(){document.body.appendChild(o);},700);
  o.querySelector('#nx').onclick=function(){o.remove();startTrace(nx);};o.querySelector('#ag').onclick=function(){o.remove();startTrace(ch);};o.querySelector('#ls').onclick=function(){o.remove();go('tlist');};}

// ----- 4. 낱말 놀이 -----
function wordPool(){return WORDS.filter(function(w){return BIG||!w[2];});}
function rWordHome(){
  app.innerHTML=hud('🖼️ 낱말 놀이')+'<div class="play"><div class="pic em">🐰</div><div style="width:min(520px,90vw)"><button class="btn" onclick="App.go(\'wordq\')">👀 그림 보고 낱말 고르기</button><button class="btn" onclick="App.go(\'dictq\')">👂 듣고 받아쓰기</button></div>'+
    '<div class="sub">'+(BIG?'받침 있는 낱말도 나와요':'받침 없는 쉬운 낱말이 나와요')+'</div></div>';}
function qWord(){
  var pool=wordPool(),w=pickNew(pool,function(a){return a[1];}),others=shuffle(pool.filter(function(x){return x!==w&&x[1].length===w[1].length;}).concat(shuffle(pool.filter(function(x){return x!==w;})))),opts=[w];
  others.forEach(function(x){if(opts.length<3&&opts.indexOf(x)<0)opts.push(x);});opts=shuffle(opts);G.word=w;G.opts=opts;
  app.innerHTML=hud('👀 그림 보고 낱말',prog())+'<div class="play"><div class="pic em">'+w[0]+'</div><div class="q">이 그림은 무엇일까요?</div><div class="opts">'+opts.map(function(o,i){return '<button class="opt w" id="o'+i+'" onclick="App.ans('+i+')">'+o[1]+'</button>';}).join('')+'</div><div class="msg" id="msg"></div></div>';}
function ansWord(i){if(G.lock)return;ac();var o=G.opts[i],el=document.getElementById('o'+i);say(o[1]);
  if(o===G.word){el.className+=' ok';document.getElementById('msg').innerHTML='<span class="good">맞았어요! '+o[1]+' '+o[0]+'</span>';good();return;}
  wrong();el.className=el.className.replace(' no','')+' no';
  if(G.qmiss>=2){var k=G.opts.indexOf(G.word);document.getElementById('o'+k).className+=' hint';document.getElementById('msg').innerHTML='💡 반짝이는 낱말을 읽어 봐요';}
  else document.getElementById('msg').innerHTML='<span class="bad">'+o[1]+'는 '+o[0]+'예요. 다시 찾아봐요</span>';}
function qDict(){
  var pool=wordPool(),w=pickNew(pool,function(a){return a[1];}),syl=w[1].split(''),dec=[];
  pool.forEach(function(x){x[1].split('').forEach(function(s){if(syl.indexOf(s)<0&&dec.indexOf(s)<0)dec.push(s);});});
  var tiles=shuffle(syl.concat(shuffle(dec).slice(0,Math.min(3,6-syl.length))));
  G.word=w;G.tiles=tiles.map(function(s,i){return {s:s,i:i,used:false};});G.fill=[];G.ans={};
  rDict();setTimeout(qsay,300);}
function rDict(){var w=G.word,n=w[1].length,h='';
  h+=hud('👂 받아쓰기',prog())+'<div class="play"><div class="q">잘 듣고 글자를 차례대로 골라요</div><div style="display:flex;gap:16px;align-items:center"><button class="spk" onclick="App.qsay()">🔊</button>'+(G.qmiss>=1||G.showPic?'<span class="pic em" style="font-size:80px">'+w[0]+'</span>':'')+'</div>';
  h+='<div class="slots">';for(var i=0;i<n;i++){var f=G.fill[i];h+='<div class="ws'+(f?' f':'')+'">'+(f?f.s:'')+'</div>';}h+='</div><div class="row">';
  G.tiles.forEach(function(t,k){h+='<button class="t'+(t.hint?' hint':'')+'" style="width:84px;height:84px;font-size:50px;'+(t.used?'visibility:hidden':'')+'" onclick="App.tile('+k+')">'+t.s+'</button>';});
  h+='</div><div class="msg" id="msg">'+(G.dm||'')+'</div></div>';app.innerHTML=h;}
function tileTap(k){if(G.lock)return;ac();var t=G.tiles[k],w=G.word[1],pos=G.fill.length;if(t.used)return;
  G.tiles.forEach(function(x){x.hint=false;});
  if(t.s===w.charAt(pos)){t.used=true;G.fill.push(t);sfx('tap');say(t.s);G.dm='';
    if(G.fill.length===w.length){G.showPic=true;G.dm='<span class="good">맞았어요! '+w+' '+G.word[0]+'</span>';rDict();say(w+'! 맞았어요');good(null,1500);G.showPic=false;return;}
    rDict();return;}
  wrong();say(t.s+'가 아니에요');G.dm='<span class="bad">'+(pos+1)+'번째 글자가 아니에요. 다시 들어 봐요 👂</span>';
  if(G.qmiss>=2){var need=w.charAt(pos);for(var i=0;i<G.tiles.length;i++)if(!G.tiles[i].used&&G.tiles[i].s===need){G.tiles[i].hint=true;break;}G.dm='💡 반짝이는 글자예요';}
  rDict();}

// ---------- 공통 ----------
function confetti(){var em=['🎉','⭐','🎊','✨','🌟'];for(var i=0;i<22;i++){var s=document.createElement('div');s.className='conf em';s.textContent=em[i%em.length];s.style.left=R(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},4000);})(s);}}
var SCR={home:rHome,letters:rLetters,card:rCard,soundq:function(){startRound('sound');},makehome:rMakeHome,makeq:function(){startRound('make');},makefree:function(){G=null;rMakeFree();},
  tlist:rTList,trace:rTrace,wordhome:rWordHome,wordq:function(){startRound('word');},dictq:function(){startRound('dict');}};
var BACK={letters:'home',card:'letters',soundq:'letters',makehome:'home',makeq:'makehome',makefree:'makehome',tlist:'home',trace:'tlist',wordhome:'home',wordq:'wordhome',dictq:'wordhome'};
window.addEventListener('resize',function(){if(scr==='trace'&&document.getElementById('pad')){sizePad();}});
window.App={go:go,back:function(){speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();go(BACK[scr]||'home');},tog:function(k){D[k]=!D[k];save();rHome();},
  card:function(ch){go('card',ch);},cardSay:cardSay,cardStep:cardStep,trace:startTrace,qsay:qsay,
  ans:function(i){if(G.kind==='sound')ansSound(i);else ansWord(i);},mk:mk,mcheck:mcheck,
  listen:function(){D.listen=!D.listen;save();rMakeHome();},jong:function(){D.jong=!D.jong;save();rMakeHome();},
  demo:function(){if(G.si<STROKES[G.ch].length)demo();},retrace:function(){startTrace(G.ch);},tile:tileTap};
if(D.jong==null){D.jong=BIG;save();}
go('home');
</script>
