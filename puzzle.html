<title>퍼즐 놀이</title>

<style>
:root{--bg:#e6fcf5;--ink:#1f3b36;--sub:#5f7f78;--main:#20c997;--main-d:#0ca678;--line:#c3eadf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#app{height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;padding:12px 14px}
#app.home{overflow-y:auto;padding-bottom:70px}
h1{font-weight:normal;font-size:44px;text-align:center;margin:6px 0 8px}
h3{font-weight:normal;font-size:24px;margin:14px 0 8px}
.tabs{display:flex;gap:10px;justify-content:center}
.tab{font-size:26px;padding:12px 24px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);border:4px solid transparent}
.tab.on{border-color:var(--main);background:#f3fffb}
.ths{display:grid;grid-template-columns:1fr;gap:0 18px}
@media (min-width:900px){.ths{grid-template-columns:1fr 1fr}}
.pics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
@media (max-width:600px){.pics{grid-template-columns:repeat(3,1fr)}}
.tpics{grid-template-columns:repeat(7,1fr)}
@media (orientation:portrait){.tpics{grid-template-columns:repeat(4,1fr)}}
.thtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.tht{font-size:21px;padding:10px 4px;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line);border:4px solid transparent}
.tht.on{border-color:var(--main);background:#f3fffb}
.pc span{font-size:17px;word-break:keep-all;line-height:1.2}
.btn.stick{position:sticky;bottom:6px;z-index:4;margin-left:120px;width:calc(100% - 120px)}
.pc{background:#fff;border-radius:18px;padding:6px 6px 8px;box-shadow:0 4px 0 var(--line);border:4px solid transparent;font-size:19px;display:flex;flex-direction:column;align-items:center}
.pc img{width:100%;border-radius:12px;display:block;aspect-ratio:4/3}
.pc span{margin-top:4px}.pc small{color:#f0a500;font-size:15px;min-height:16px}
.pc.sel{border-color:var(--main)}
.szs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:700px){.szs{grid-template-columns:repeat(3,1fr)}}
.sz{background:#fff;border-radius:18px;padding:8px 2px;box-shadow:0 4px 0 var(--line);border:4px solid transparent;font-size:17px;display:flex;flex-direction:column;align-items:center}
.sz b{font-weight:normal;font-size:34px;line-height:1.1}.sz small{color:#f0a500;font-size:15px;min-height:16px}
.sz.sel{border-color:var(--main);background:#f3fffb}
.tg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tg button{background:#fff;border-radius:999px;padding:8px 16px;font-size:20px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.tg button.on{border-color:var(--main)}
.btn{display:block;width:100%;font-size:30px;padding:16px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:14px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn:active,.pc:active,.sz:active,.tab:active,.pill:active{transform:translateY(3px);box-shadow:none}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:20px;white-space:nowrap;border:3px solid transparent}
.pill.on{border-color:var(--main)}
.grow{flex:1}
#area{flex:1;min-height:0;position:relative;touch-action:none}
#board{position:absolute;background:#fff;border-radius:6px;box-shadow:0 0 0 6px #fff,0 6px 0 6px var(--line);overflow:hidden}
#board img{position:absolute;left:0;top:0;width:100%;height:100%;transition:opacity .3s}
#board svg{position:absolute;left:0;top:0;width:100%;height:100%}
.pz{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.pz.lift{filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.pz.snap{transition:transform .15s ease-out}
#hintbox{position:absolute;border:5px solid #ffd43b;border-radius:8px;box-shadow:0 0 18px #ffd43b;display:none;pointer-events:none;animation:pulse .6s ease-in-out infinite alternate;z-index:2}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.msg{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 18px;font-size:20px;box-shadow:0 3px 0 var(--line);white-space:nowrap;pointer-events:none;z-index:3;transition:opacity .3s}
.play{flex:1;min-height:0;display:flex;gap:14px}
.sbox{flex:1.4;min-width:0;min-height:0;position:relative}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
@media (orientation:portrait){.play{flex-direction:column-reverse}.side{flex:none}.sbox{flex:1}.side .prev{max-height:22vh;width:auto;align-self:center}}
.prev{width:100%;border-radius:14px;box-shadow:0 0 0 5px #fff,0 5px 0 5px var(--line);display:block;background:#fff}
.box{background:#fff;border-radius:18px;padding:10px 14px;font-size:22px;text-align:center;box-shadow:0 4px 0 var(--line);line-height:1.4;word-break:keep-all}
#sboard{position:absolute;background:#c3eadf;border-radius:14px}
.tl{position:absolute;left:0;top:0;border-radius:10px;overflow:hidden;transition:transform .16s ease-out;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.tl canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.tl i{font-style:normal;position:absolute;left:6px;top:4px;background:rgba(255,255,255,.88);color:#1f3b36;text-shadow:none;border-radius:999px;font-size:20px;min-width:30px;text-align:center;padding:1px 6px}
.tl.big i{position:static;background:none;color:#fff;font-size:inherit;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.tl.glow{box-shadow:0 0 0 5px #ffd43b,0 0 16px #ffd43b}
.tl.shake{animation:shake .3s}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}
.overlay{position:fixed;inset:0;background:rgba(20,50,45,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:20px;max-width:500px;width:100%;text-align:center;max-height:100%;overflow-y:auto}
.panel .pic{border-radius:16px;overflow:hidden;line-height:0}
.panel .pic svg{max-width:100%;max-height:40vh;width:auto;height:auto;display:block;margin:0 auto;border-radius:16px}
.rate{font-size:50px;letter-spacing:6px;color:#f0a500;line-height:1.2}
.alive .bob{animation:bob .9s ease-in-out infinite alternate}
.alive .sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw .7s ease-in-out infinite alternate}
.alive .gl{animation:pulse .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>

var TBASE={L:[[0,0],[4,0],[2,2]],M:[[0,0],[2,0],[0,2]],S:[[0,0],[2,0],[1,1]],Q:[[1,0],[2,1],[1,2],[0,1]],R:[[0,0],[2,0],[3,1],[1,1]]};
var TPCS=[['L','#ff6b6b'],['L','#4dabf7'],['M','#ffd43b'],['S','#51cf66'],['S','#f783ac'],['Q','#ff922b'],['R','#9775fa']];
var TFIG={"정사각형":[["L",[[0,0],[4,0],[2,2]]],["L",[[0,0],[2,2],[0,4]]],["S",[[4,0],[4,2],[3,1]]],["Q",[[3,1],[4,2],[3,3],[2,2]]],["S",[[2,2],[3,3],[1,3]]],["R",[[0,4],[1,3],[3,3],[2,4]]],["M",[[2,4],[4,2],[4,4]]]],"산":[["L",[[0,4],[4,4],[2,2]]],["L",[[4,0],[4,4],[2,2]]],["S",[[4,0],[4,2],[5,1]]],["Q",[[5,1],[4,2],[5,3],[6,2]]],["S",[[6,2],[5,3],[7,3]]],["R",[[8,4],[7,3],[5,3],[6,4]]],["M",[[6,4],[4,2],[4,4]]]],"물고기":[["L",[[2,0],[2,4],[0,2]]],["L",[[2,0],[2,4],[4,2]]],["M",[[4,2],[6,0],[6,2]]],["S",[[4,2],[6,2],[5,3]]],["S",[[6,2],[6,4],[5,3]]],["R",[[2,-2],[3,-1],[3,1],[2,0]]],["Q",[[3,3],[4,4],[3,5],[2,4]]]],"고양이":[["Q",[[2,0],[3,1],[2,2],[1,1]]],["S",[[1,-1],[1,1],[2,0]]],["S",[[3,-1],[3,1],[2,0]]],["L",[[2,2],[2,6],[0,4]]],["L",[[2,2],[2,6],[4,4]]],["R",[[3,5],[5,5],[4,6],[2,6]]],["M",[[0,4],[0,6],[2,6]]]],"토끼":[["Q",[[2,3],[3,4],[2,5],[1,4]]],["R",[[2,1],[2,3],[1,4],[1,2]]],["S",[[3,2],[3,4],[2,3]]],["L",[[2,5],[2,9],[0,7]]],["L",[[2,5],[2,9],[4,7]]],["M",[[0,7],[0,9],[2,9]]],["S",[[3,8],[5,8],[4,7]]]],"거북이":[["L",[[2,0],[2,4],[0,2]]],["L",[[2,0],[2,4],[4,2]]],["Q",[[4,0],[5,1],[4,2],[3,1]]],["S",[[-1,1],[1,1],[0,2]]],["S",[[-1,3],[1,3],[0,2]]],["M",[[4,2],[4,4],[2,4]]],["R",[[2,-2],[2,0],[1,1],[1,-1]]]],"화살표":[["L",[[4,0],[4,4],[6,2]]],["L",[[0,1],[4,1],[2,3]]],["M",[[0,1],[0,3],[2,3]]],["S",[[2,3],[4,3],[3,2]]],["S",[[4,1],[4,3],[3,2]]],["R",[[-1,0],[1,0],[2,1],[0,1]]],["Q",[[-1,1],[0,2],[-1,3],[-2,2]]]]};
var TNAMES=Object.keys(TFIG);
function cen(pts){var x=0,y=0;pts.forEach(function(p){x+=p[0];y+=p[1];});return [x/pts.length,y/pts.length];}
function tshape(t,rot,flip){var b=TBASE[t],c=cen(b);return b.map(function(p){var x=p[0]-c[0],y=p[1]-c[1];if(flip)x=-x;for(var k=0;k<rot;k++){var nx=-y;y=x;x=nx;}return [x,y];});}
function sameShape(a,b){if(a.length!==b.length)return false;return a.every(function(p){return b.some(function(q){return Math.abs(p[0]-q[0])<0.02&&Math.abs(p[1]-q[1])<0.02;});});}
function inPoly(pt,poly){var ins=false;for(var i=0,j=poly.length-1;i<poly.length;j=i++){var xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function figBox(f){var a=[1e9,1e9,-1e9,-1e9];TFIG[f].forEach(function(s){s[1].forEach(function(p){a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);});});return a;}
function ptsStr(pts,dx,dy){return pts.map(function(p){return (p[0]+dx).toFixed(3)+','+(p[1]+dy).toFixed(3);}).join(' ');}
function figThumb(f,col){var b=figBox(f),s='<svg viewBox="'+(b[0]-.5)+' '+(b[1]-.5)+' '+(b[2]-b[0]+1)+' '+(b[3]-b[1]+1)+'" style="width:100%;aspect-ratio:1;display:block">';TFIG[f].forEach(function(sl){s+='<polygon points="'+ptsStr(sl[1],0,0)+'" fill="'+(col||'#495057')+'" stroke="'+(col||'#495057')+'" stroke-width=".04"/>';});return s+'</svg>';}
function startT(fi){
  var f=TNAMES[fi],b=figBox(f),land=window.innerWidth>=window.innerHeight,VBW=land?22:12,VBH=land?11:22;
  var ox=(land?5.5:6)-(b[0]+b[2])/2,oy=5.5-(b[1]+b[3])/2;
  var slots=TFIG[f].map(function(s){var pts=s[1].map(function(p){return [p[0]+ox,p[1]+oy];}),c=cen(pts);return {t:s[0],pts:pts,c:c,rel:pts.map(function(p){return [p[0]-c[0],p[1]-c[1]];}),used:false};});
  var tray=land?[[13.6,2],[18.6,2],[12.8,5.6],[16.2,5.6],[19.8,5.6],[13.6,8.8],[17.6,8.8]]:[[3.2,13],[8.8,13],[2.4,16.6],[6,16.6],[9.6,16.6],[3.4,20],[8.2,20]];
  var easy=D.tanEasy!==false;
  var pcs=TPCS.map(function(pc,i){var rot=R(0,3),flip=pc[0]==='R'&&Math.random()<.5;
    if(easy){var sl=slots.filter(function(s){return s.t===pc[0]&&!s.claim;})[0];if(sl){sl.claim=1;for(var k=0;k<8;k++){var r2=k%4,f2=k>=4;if(sameShape(tshape(pc[0],r2,f2),sl.rel)){rot=r2;flip=f2;break;}}}}
    return {i:i,t:pc[0],col:pc[1],rot:rot,flip:flip,x:tray[i][0],y:tray[i][1],locked:false,miss:0};});
  slots.forEach(function(s){delete s.claim;});
  G={kind:'tan',fi:fi,f:f,slots:slots,pcs:pcs,VBW:VBW,VBH:VBH,land:land,easy:easy,hints:0,locked:0,done:false,drag:null,hintSlot:null};
  go('tan');say(f+' 모양을 만들어 봐요! 조각을 톡 누르면 돌아가요.');
}
function rTan(){
  app.innerHTML='<div class="hud"><button class="pill" onclick="App.home()">◀</button><span class="pill">🔷 '+G.f+'</span><span class="pill" id="cnt"></span><span class="grow"></span><span class="pill" style="font-size:17px">톡 누르면 🔄 돌기</span></div><div id="area"><svg id="tsvg" viewBox="0 0 '+G.VBW+' '+G.VBH+'" style="width:100%;height:100%;display:block;touch-action:none"></svg><div class="msg" id="msg" style="opacity:0"></div></div>';
  drawT();bindT();rTcnt();
}
function rTcnt(){var e=document.getElementById('cnt');if(e)e.innerHTML='🔷 '+G.locked+' / 7';}
function drawT(){
  var s='<rect x="'+(G.land?0.2:0.2)+'" y="0.2" width="'+(G.land?10.6:11.6)+'" height="10.6" rx=".5" fill="#fff"/>';
  G.slots.forEach(function(sl,k){s+='<polygon points="'+ptsStr(sl.pts,0,0)+'" fill="#868e96" stroke="'+(G.easy?'#fff':'#868e96')+'" stroke-width="'+(G.easy?'.06':'.04')+'" stroke-linejoin="round"/>';});
  if(G.hintSlot)s+='<polygon class="hl" points="'+ptsStr(G.hintSlot.pts,0,0)+'" fill="none" stroke="#ffd43b" stroke-width=".16" stroke-linejoin="round"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></polygon>';
  var order=G.pcs.slice().sort(function(a,b){return (a.locked?0:1)-(b.locked?0:1)||(a.z||0)-(b.z||0);});
  order.forEach(function(p){s+='<polygon id="tp'+p.i+'" points="'+ptsStr(tshape(p.t,p.rot,p.flip),p.x,p.y)+'" fill="'+p.col+'" stroke="#fff" stroke-width=".07" stroke-linejoin="round"/>';});
  document.getElementById('tsvg').innerHTML=s;
}
function setTP(p){var e=document.getElementById('tp'+p.i);if(e)e.setAttribute('points',ptsStr(tshape(p.t,p.rot,p.flip),p.x,p.y));}
function bindT(){
  var sv=document.getElementById('tsvg');
  function loc(ev){var pt=sv.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;var r=pt.matrixTransform(sv.getScreenCTM().inverse());return [r.x,r.y];}
  sv.onpointerdown=function(ev){if(G.drag||G.done)return;ac();var q=loc(ev),best=null;
    G.pcs.forEach(function(p){if(p.locked)return;var poly=tshape(p.t,p.rot,p.flip).map(function(v){return [v[0]+p.x,v[1]+p.y];});if(inPoly(q,poly)&&(!best||(p.z||0)>(best.z||0)))best=p;});
    if(!best)return;ev.preventDefault();G.z=(G.z||0)+1;best.z=G.z;var e=document.getElementById('tp'+best.i);e.parentNode.appendChild(e);
    G.drag={p:best,id:ev.pointerId,dx:q[0]-best.x,dy:q[1]-best.y,sx:q[0],sy:q[1],t:Date.now(),moved:false};try{sv.setPointerCapture(ev.pointerId);}catch(er){}sfx('pick');};
  sv.onpointermove=function(ev){var d=G.drag;if(!d||d.id!==ev.pointerId)return;var q=loc(ev);if(Math.abs(q[0]-d.sx)+Math.abs(q[1]-d.sy)>0.2)d.moved=true;if(!d.moved)return;
    d.p.x=Math.max(0.5,Math.min(G.VBW-0.5,q[0]-d.dx));d.p.y=Math.max(0.5,Math.min(G.VBH-0.5,q[1]-d.dy));setTP(d.p);};
  sv.onpointerup=sv.onpointercancel=function(ev){var d=G.drag;if(!d||d.id!==ev.pointerId)return;G.drag=null;var p=d.p;
    if(!d.moved&&Date.now()-d.t<500){ // 톡 → 돌리기
      if(p.t==='R'){p.rot++;if(p.rot>3){p.rot=0;p.flip=!p.flip;}}else p.rot=(p.rot+1)%4;setTP(p);sfx('slide');}
    dropT(p,d.moved);};
}
function dropT(p,moved){
  var shp=tshape(p.t,p.rot,p.flip),best=null,bd=1e9;
  G.slots.forEach(function(sl){if(sl.used||sl.t!==p.t||!sameShape(shp,sl.rel))return;var dd=Math.hypot(sl.c[0]-p.x,sl.c[1]-p.y);if(dd<bd){bd=dd;best=sl;}});
  if(best&&bd<0.95){best.used=true;p.locked=true;p.x=best.c[0];p.y=best.c[1];G.locked++;sfx('snap');rTcnt();if(G.hintSlot===best)G.hintSlot=null;drawT();
    if(G.locked===7){G.done=true;setTimeout(winT,400);}else if(G.locked===1||Math.random()<.2)flash(pick(['딸깍! 잘했어요 👍','맞았어요! ✨','최고예요! 🌟']));return;}
  if(!moved)return;
  var inFig=G.slots.some(function(sl){return inPoly([p.x,p.y],sl.pts);});
  if(!inFig)return;
  p.miss++;sfx('no');
  var free=G.slots.filter(function(sl){return !sl.used&&sl.t===p.t;});
  if(p.miss>=2&&free.length){if(!p.hinted){p.hinted=true;G.hints++;}var tgt=free[0];G.hintSlot=tgt;drawT();
    flash(sameShape(shp,tgt.rel)?'💡 반짝이는 자리에 놓아 봐요':'💡 반짝이는 자리예요. 톡 눌러서 돌려 봐요 🔄');}
  else flash(free.some(function(sl){return sameShape(shp,sl.rel);})?'여기가 아닌가 봐요. 다른 자리를 찾아봐요 🤔':'모양이 안 맞아요. 톡 눌러서 돌려 봐요 🔄');
}
function winT(){
  var s=G.hints===0?3:(G.hints<=2?2:1),f=G.f;D.tan=D.tan||{};if(!D.tan[f]||s>D.tan[f])D.tan[f]=s;save();
  sfx('win');confetti();say(f+' 완성! 정말 잘했어요!');var nx=(G.fi+1)%TNAMES.length;
  overlay('<div style="max-width:240px;margin:0 auto">'+figThumb(f,'#20c997')+'</div><div style="font-size:30px;margin-top:8px">'+f+' 완성!</div><div class="rate">'+stars(s)+'</div>'+(s<3?'<div style="font-size:18px;color:#5f7f78">반짝이 도움 없이 맞추면 ★★★</div>':'')+
    '<button class="btn" id="b1">다음 모양 ▶</button><button class="btn ghost" id="b2">한 번 더</button><button class="btn ghost" id="b3">모양 고르기</button>',{b1:function(){D.tfig=nx;save();startT(nx);},b2:function(){startT(G.fi);},b3:function(){go('home');}},600);
}
// ---------- 공통 ----------
function overlay(html,acts,delay){setTimeout(function(){if(!G)return;var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel">'+html+'</div>';document.body.appendChild(o);
  Object.keys(acts).forEach(function(k){var b=o.querySelector('#'+k);if(b)b.onclick=function(){o.remove();acts[k]();};});},delay||0);}
function confetti(){var em=['🎉','⭐','🎊','✨','🧩'];for(var i=0;i<22;i++){var s=document.createElement('div');s.className='conf em';s.textContent=em[i%em.length];s.style.left=R(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},4000);})(s);}}
window.addEventListener('resize',function(){
  if(scr==='jig'&&G&&G.L&&!G.drag){var a=document.getElementById('area');if(a&&(Math.abs(a.clientWidth-G.lw)>40||Math.abs(a.clientHeight-G.lh)>40))layoutJ();}
  else if(scr==='slide'&&G&&G.S)layoutS();
  else if(scr==='tan'&&G&&!G.drag&&(window.innerWidth>=window.innerHeight)!==G.land)startT(G.fi);});
window.App={
  tab:function(t){D.tab=t;save();rHome();},theme:function(i){D.theme=i;save();rHome();},pic:function(i){D.pic=i;save();rHome();},size:function(n){D.size=n;save();rHome();},
  smode:function(m){D.smode=m;save();rHome();},ssize:function(z){D.ssize=z;save();rHome();},set:function(k){D[k]=!D[k];save();rHome();},
  start:function(){if(D.tab==='jig')startJ(D.pic,D.size);else if(D.tab==='tan')startT(D.tfig||0);else startS();},tfig:function(i){D.tfig=i;save();rHome();},teasy:function(){D.tanEasy=D.tanEasy===false;save();rHome();},home:function(){G=null;go('home');},
  ghost:function(){G.ghost=!G.ghost;D.ghost=G.ghost;save();document.getElementById('gimg').style.opacity=G.ghost?0.3:0;document.getElementById('gh').className='pill'+(G.ghost?' on':'');},
  nums:function(){G.nums=!G.nums;D.nums=G.nums;save();rSlide();},reshuf:function(){startS();}
};
go('home');
</script>
