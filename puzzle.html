<title>퍼즐 놀이</title>

<style>
:root{--bg:#e6fcf5;--ink:#1f3b36;--sub:#5f7f78;--main:#20c997;--main-d:#0ca678;--line:#c3eadf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#app{height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;padding:12px 14px}
#app.home{overflow-y:auto;padding-bottom:70px}
h1{font-weight:normal;font-size:44px;text-align:center;margin:6px 0 8px}
h3{font-weight:normal;font-size:24px;margin:14px 0 8px}
.tabs{display:flex;gap:10px;justify-content:center}
.tab{font-size:26px;padding:12px 24px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);border:4px solid transparent}
.tab.on{border-color:var(--main);background:#f3fffb}
.ths{display:grid;grid-template-columns:1fr;gap:0 18px}
@media (min-width:900px){.ths{grid-template-columns:1fr 1fr}}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn.stick{position:sticky;bottom:6px;z-index:4;margin-left:120px;width:calc(100% - 120px)}
.pc{background:#fff;border-radius:18px;padding:6px 6px 8px;box-shadow:0 4px 0 var(--line);border:4px solid transparent;font-size:19px;display:flex;flex-direction:column;align-items:center}
.pc img{width:100%;border-radius:12px;display:block;aspect-ratio:4/3}
.pc span{margin-top:4px}.pc small{color:#f0a500;font-size:15px;min-height:16px}
.pc.sel{border-color:var(--main)}
.szs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:700px){.szs{grid-template-columns:repeat(3,1fr)}}
.sz{background:#fff;border-radius:18px;padding:8px 2px;box-shadow:0 4px 0 var(--line);border:4px solid transparent;font-size:17px;display:flex;flex-direction:column;align-items:center}
.sz b{font-weight:normal;font-size:34px;line-height:1.1}.sz small{color:#f0a500;font-size:15px;min-height:16px}
.sz.sel{border-color:var(--main);background:#f3fffb}
.tg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tg button{background:#fff;border-radius:999px;padding:8px 16px;font-size:20px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.tg button.on{border-color:var(--main)}
.btn{display:block;width:100%;font-size:30px;padding:16px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:14px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn:active,.pc:active,.sz:active,.tab:active,.pill:active{transform:translateY(3px);box-shadow:none}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:20px;white-space:nowrap;border:3px solid transparent}
.pill.on{border-color:var(--main)}
.grow{flex:1}
#area{flex:1;min-height:0;position:relative;touch-action:none}
#board{position:absolute;background:#fff;border-radius:6px;box-shadow:0 0 0 6px #fff,0 6px 0 6px var(--line);overflow:hidden}
#board img{position:absolute;left:0;top:0;width:100%;height:100%;transition:opacity .3s}
#board svg{position:absolute;left:0;top:0;width:100%;height:100%}
.pz{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.pz.lift{filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.pz.snap{transition:transform .15s ease-out}
#hintbox{position:absolute;border:5px solid #ffd43b;border-radius:8px;box-shadow:0 0 18px #ffd43b;display:none;pointer-events:none;animation:pulse .6s ease-in-out infinite alternate;z-index:2}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.msg{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 18px;font-size:20px;box-shadow:0 3px 0 var(--line);white-space:nowrap;pointer-events:none;z-index:3;transition:opacity .3s}
.play{flex:1;min-height:0;display:flex;gap:14px}
.sbox{flex:1.4;min-width:0;min-height:0;position:relative}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
@media (orientation:portrait){.play{flex-direction:column-reverse}.side{flex:none}.sbox{flex:1}.side .prev{max-height:22vh;width:auto;align-self:center}}
.prev{width:100%;border-radius:14px;box-shadow:0 0 0 5px #fff,0 5px 0 5px var(--line);display:block;background:#fff}
.box{background:#fff;border-radius:18px;padding:10px 14px;font-size:22px;text-align:center;box-shadow:0 4px 0 var(--line);line-height:1.4;word-break:keep-all}
#sboard{position:absolute;background:#c3eadf;border-radius:14px}
.tl{position:absolute;left:0;top:0;border-radius:10px;overflow:hidden;transition:transform .16s ease-out;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.tl canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.tl i{font-style:normal;position:absolute;left:6px;top:4px;background:rgba(255,255,255,.88);color:#1f3b36;text-shadow:none;border-radius:999px;font-size:20px;min-width:30px;text-align:center;padding:1px 6px}
.tl.big i{position:static;background:none;color:#fff;font-size:inherit;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.tl.glow{box-shadow:0 0 0 5px #ffd43b,0 0 16px #ffd43b}
.tl.shake{animation:shake .3s}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}
.overlay{position:fixed;inset:0;background:rgba(20,50,45,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:20px;max-width:500px;width:100%;text-align:center;max-height:100%;overflow-y:auto}
.panel .pic{border-radius:16px;overflow:hidden;line-height:0}
.panel .pic svg{max-width:100%;max-height:40vh;width:auto;height:auto;display:block;margin:0 auto;border-radius:16px}
.rate{font-size:50px;letter-spacing:6px;color:#f0a500;line-height:1.2}
.alive .bob{animation:bob .9s ease-in-out infinite alternate}
.alive .sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw .7s ease-in-out infinite alternate}
.alive .gl{animation:pulse .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>

  h+='<button class="'+(D.voice?'on':'')+'" onclick="App.set(\'voice\')">🗣️ 읽어주기 '+(D.voice?'켬':'끔')+'</button><button class="'+(D.sfx?'on':'')+'" onclick="App.set(\'sfx\')">🔊 효과음 '+(D.sfx?'켬':'끔')+'</button></div>';
  h+='<button class="btn stick" onclick="App.start()">'+(D.tab==='jig'?PICS[D.pic].n+' '+D.size+'조각 시작! ▶':'밀기 퍼즐 시작! ▶')+'</button>';
  var st=app.scrollTop;app.innerHTML=h;app.scrollTop=st;
}

// ---------- 조각 퍼즐 ----------
function startJ(pic,n){
  var g=GRID[n],cols=g[0],rows=g[1],H=[],V=[],tabs=n>=9;
  for(var r=0;r<rows-1;r++){H[r]=[];for(var c=0;c<cols;c++)H[r][c]=tabs?(Math.random()<.5?1:-1):0;}
  for(r=0;r<rows;r++){V[r]=[];for(c=0;c<cols-1;c++)V[r][c]=tabs?(Math.random()<.5?1:-1):0;}
  G={kind:'jig',pic:pic,n:n,cols:cols,rows:rows,H:H,V:V,hints:0,locked:0,done:false,pieces:[],z:10,drag:null,ghost:D.ghost};
  for(r=0;r<rows;r++)for(c=0;c<cols;c++)G.pieces.push({r:r,c:c,locked:false,miss:0,x:0,y:0,placed:false});
  go('jig');say(PICS[pic].n+' 퍼즐! 조각을 끌어다 맞춰 봐요.');
}
function rJig(){
  app.innerHTML='<div class="hud"><button class="pill" onclick="App.home()">◀</button><span class="pill">'+PICS[G.pic].n+' · '+G.n+'조각</span><span class="pill" id="cnt"></span><span class="grow"></span><button class="pill'+(G.ghost?' on':'')+'" id="gh" onclick="App.ghost()">🖼️ 밑그림</button></div>'+
    '<div id="area"><div id="board"><img id="gimg" src="'+picURL(G.pic)+'" alt=""></div><div id="hintbox"></div><div class="msg" id="msg" style="opacity:0"></div></div>';
  rCnt();document.getElementById('gimg').style.opacity=G.ghost?0.3:0;
  picImg(G.pic,function(im){if(!G||G.kind!=='jig')return;G.im=im;layoutJ();bindJ();});
}
function rCnt(){var e=document.getElementById('cnt');if(e)e.innerHTML='🧩 '+G.locked+' / '+G.n;}
function flash(t){var m=document.getElementById('msg');if(!m)return;m.innerHTML=t;m.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(function(){m.style.opacity=0;},2200);}
function edgePath(ph,ax,ay,bx,by,nx,ny){
  function pt(a,k){return [ax+(bx-ax)*a+nx*k,ay+(by-ay)*a+ny*k];}
  if(!nx&&!ny){ph.lineTo(bx,by);return;}
  var q=pt(.34,0);ph.lineTo(q[0],q[1]);
  var c1=pt(.42,.1),c2=pt(.28,1),e=pt(.5,1);ph.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],e[0],e[1]);
  c1=pt(.72,1);c2=pt(.58,.1);e=pt(.66,0);ph.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],e[0],e[1]);
  ph.lineTo(bx,by);}
function piecePath(p,cw,ch,m,h){var ph=new Path2D(),r=p.r,c=p.c,H=G.H,V=G.V;
  var t=r>0?H[r-1][c]:0,bt=r<G.rows-1?H[r][c]:0,l=c>0?V[r][c-1]:0,rt=c<G.cols-1?V[r][c]:0;
  ph.moveTo(m,m);edgePath(ph,m,m,m+cw,m,0,t*h);edgePath(ph,m+cw,m,m+cw,m+ch,rt*h,0);edgePath(ph,m+cw,m+ch,m,m+ch,0,bt*h);edgePath(ph,m,m+ch,m,m,l*h,0);ph.closePath();return ph;}
function layoutJ(){
  var area=document.getElementById('area');if(!area||!G.im)return;
  var W=area.clientWidth,Hh=area.clientHeight,land=W>=Hh*1.05,bw,bh,bx,by,tray;
  if(land){bw=Math.min(W*0.6,(Hh-30)*4/3);bh=bw*.75;bx=10;by=Math.max(8,(Hh-bh)/2-10);tray={x:bx+bw+14,y:4,w:W-(bx+bw+18),h:Hh-40};}
  else{bw=Math.min(W-24,Hh*0.5*4/3);bh=bw*.75;bx=(W-bw)/2;by=10;tray={x:4,y:by+bh+18,w:W-8,h:Hh-(by+bh+18)-36};}
  var L={W:W,H:Hh,bw:bw,bh:bh,bx:bx,by:by,tray:tray,cw:bw/G.cols,ch:bh/G.rows};L.h=G.n>=9?Math.min(L.cw,L.ch)*0.2:0;L.m=L.h+4;L.snap=Math.min(L.cw,L.ch)*0.32;
  G.L=L;var b=document.getElementById('board');b.style.left=bx+'px';b.style.top=by+'px';b.style.width=bw+'px';b.style.height=bh+'px';
  var dpr=Math.min(window.devicePixelRatio||1,2),fc=document.createElement('canvas');fc.width=Math.round(bw*dpr);fc.height=Math.round(bh*dpr);fc.getContext('2d').drawImage(G.im,0,0,fc.width,fc.height);
  Array.prototype.forEach.call(area.querySelectorAll('canvas.pz'),function(e){e.remove();});
  var pw=L.cw+2*L.m,ph=L.ch+2*L.m,loose=G.pieces.filter(function(p){return !p.locked;}),order=shuffle(loose),kc=Math.max(1,Math.round(Math.sqrt(order.length*tray.w/Math.max(tray.h,1)))),kr=Math.ceil(order.length/kc);
  order.forEach(function(p,i){var gx=i%kc,gy=Math.floor(i/kc),sx=tray.w/kc,sy=tray.h/kr;
    p.x=tray.x+gx*sx+(sx-pw)/2+R(-8,8);p.y=tray.y+gy*sy+(sy-ph)/2+R(-8,8);
    p.x=Math.max(-L.m,Math.min(W-pw+L.m,p.x));p.y=Math.max(-L.m,Math.min(Hh-ph+L.m,p.y));});
  G.pieces.forEach(function(p){
    p.path=piecePath(p,L.cw,L.ch,L.m,L.h);
    var cv=document.createElement('canvas');cv.className='pz';cv.width=Math.round(pw*dpr);cv.height=Math.round(ph*dpr);cv.style.width=pw+'px';cv.style.height=ph+'px';
    var x=cv.getContext('2d');x.scale(dpr,dpr);x.save();x.clip(p.path);x.drawImage(fc,-p.c*L.cw+L.m,-p.r*L.ch+L.m,bw,bh);x.restore();
    x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.9)';x.stroke(p.path);x.lineWidth=1.2;x.strokeStyle='rgba(0,0,0,.35)';x.stroke(p.path);
    p.el=cv;if(p.locked){p.x=bx+p.c*L.cw-L.m;p.y=by+p.r*L.ch-L.m;cv.style.zIndex=1;}else cv.style.zIndex=p.z||(p.z=++G.z);
    setPos(p);area.appendChild(cv);});
  if(G.hintP&&!G.hintP.locked)showHint(G.hintP);
  G.lw=W;G.lh=Hh;
}
function setPos(p){p.el.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';}
var hitCtx=document.createElement('canvas').getContext('2d');
function bindJ(){
  var area=document.getElementById('area');
  function loc(e){var r=area.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  area.onpointerdown=function(e){if(G.drag||G.done)return;ac();var q=loc(e),best=null;
    G.pieces.forEach(function(p){if(p.locked)return;var lx=q.x-p.x,ly=q.y-p.y;
      if(hitCtx.isPointInPath(p.path,lx,ly)||(lx>G.L.m+4&&ly>G.L.m+4&&lx<G.L.m+G.L.cw-4&&ly<G.L.m+G.L.ch-4)){if(!best||p.z>best.z)best=p;}});
    if(!best)return;e.preventDefault();G.drag={p:best,id:e.pointerId,dx:q.x-best.x,dy:q.y-best.y};best.z=++G.z;best.el.style.zIndex=best.z;best.el.classList.remove('snap');best.el.classList.add('lift');
    try{area.setPointerCapture(e.pointerId);}catch(er){}sfx('pick');};
  area.onpointermove=function(e){var d=G.drag;if(!d||d.id!==e.pointerId)return;var q=loc(e),p=d.p,L=G.L;
    p.x=Math.max(-L.m-L.cw*.4,Math.min(L.W-L.cw*.6-L.m,q.x-d.dx));p.y=Math.max(-L.m-L.ch*.4,Math.min(L.H-L.ch*.6-L.m,q.y-d.dy));setPos(p);};
  area.onpointerup=area.onpointercancel=function(e){var d=G.drag;if(!d||d.id!==e.pointerId)return;G.drag=null;d.p.el.classList.remove('lift');drop(d.p);};
}
function drop(p){
  var L=G.L,tx=L.bx+p.c*L.cw-L.m,ty=L.by+p.r*L.ch-L.m;
  if(Math.abs(p.x-tx)<L.snap&&Math.abs(p.y-ty)<L.snap){
    p.locked=true;p.x=tx;p.y=ty;p.el.classList.add('snap');setPos(p);p.el.style.zIndex=1;G.locked++;sfx('snap');rCnt();
    if(G.hintP===p){G.hintP=null;document.getElementById('hintbox').style.display='none';}
    if(G.locked===G.n){G.done=true;setTimeout(winJ,450);}
    else if(G.locked===1||Math.random()<.18)flash(pick(['딸깍! 잘했어요 👍','맞았어요! ✨','최고예요! 🌟']));
    return;}
  var cx=p.x+L.m+L.cw/2,cy=p.y+L.m+L.ch/2;
  if(cx>L.bx&&cx<L.bx+L.bw&&cy>L.by&&cy<L.by+L.bh){p.miss++;sfx('no');
    if(p.miss>=2&&!p.hinted){p.hinted=true;G.hints++;showHint(p);flash('💡 반짝이는 자리에 놓아 봐요');}
    else flash('여기가 아닌가 봐요. 다른 자리를 찾아봐요 🤔');}
}
function showHint(p){G.hintP=p;var L=G.L,b=document.getElementById('hintbox');b.style.left=(L.bx+p.c*L.cw-3)+'px';b.style.top=(L.by+p.r*L.ch-3)+'px';b.style.width=(L.cw+6)+'px';b.style.height=(L.ch+6)+'px';b.style.display='block';}
function winJ(){
  var s=G.hints===0?3:(G.hints<=2?2:1),key=G.pic+'_'+G.n;if(!D.best[key]||s>D.best[key])D.best[key]=s;save();
  var gi=document.getElementById('gimg');if(gi)gi.style.opacity=1;sfx('win');confetti();say(PICS[G.pic].n+' 완성! 정말 잘했어요!');
  var ni=(G.pic+1)%PICS.length,si=SIZES.indexOf(G.n),nn=si<SIZES.length-1?SIZES[si+1]:0,pic=G.pic,n=G.n;
  overlay('<div class="pic alive">'+picSvg(pic,'w')+'</div><div style="font-size:30px;margin-top:8px">'+PICS[pic].n+' 완성!</div><div class="rate">'+stars(s)+'</div>'+(s<3?'<div style="font-size:18px;color:#5f7f78">반짝이 도움 없이 맞추면 ★★★</div>':'')+
    '<button class="btn" id="b1">다음 그림 ▶</button>'+(nn?'<button class="btn ghost" id="b2">'+nn+'조각으로 도전</button>':'')+'<button class="btn ghost" id="b3">그림 고르기</button>',
    {b1:function(){D.pic=ni;save();startJ(ni,n);},b2:function(){D.size=nn;save();startJ(pic,nn);},b3:function(){go('home');}},700);
}

// ---------- 밀기 퍼즐 ----------
function startS(){
  var z=D.ssize,g=SGRID[z],cols=g[0],rows=g[1],n=cols*rows,arr=[],i;for(i=0;i<n-1;i++)arr.push(i);arr.push(-1);
  var e=n-1,prev=-1,mix=SMIX[z];
  for(var k=0;k<mix||solved(arr);k++){var er=Math.floor(e/cols),ec=e%cols,nb=[];if(er>0)nb.push(e-cols);if(er<rows-1)nb.push(e+cols);if(ec>0)nb.push(e-1);if(ec<cols-1)nb.push(e+1);
    nb=nb.filter(function(x){return x!==prev;});var t=pick(nb);arr[e]=arr[t];arr[t]=-1;prev=e;e=t;if(k>mix+50)break;}
  G={kind:'slide',mode:D.smode,z:z,cols:cols,rows:rows,n:n,arr:arr,moves:0,wrong:0,busy:false,done:false,pic:R(0,PICS.length-1),nums:D.nums};
  go('slide');say(D.smode==='pic'?'조각을 밀어서 '+PICS[G.pic].n+' 그림을 완성해요.':'숫자를 1부터 차례대로 맞춰요.');
}
function solved(a){for(var i=0;i<a.length-1;i++)if(a[i]!==i)return false;return true;}
var NUMC=['#ff8a80','#ffb74d','#81c784','#4fc3f7','#b39ddb'];
function rSlide(){
  var pic=G.mode==='pic';
  app.innerHTML='<div class="hud"><button class="pill" onclick="App.home()">◀</button><span class="pill">밀기 퍼즐 · '+G.cols+'×'+G.rows+'</span><span class="pill" id="mv"></span><span class="grow"></span>'+(pic?'<button class="pill'+(G.nums?' on':'')+'" onclick="App.nums()">🔢 숫자</button>':'')+'<button class="pill" onclick="App.reshuf()">🔀 새로 섞기</button></div>'+
    '<div class="play"><div class="sbox" id="sbox"><div id="sboard"></div></div><div class="side">'+
    (pic?'<img class="prev" src="'+picURL(G.pic)+'" alt="">':'<div class="box" style="font-size:26px">'+numPreview()+'</div>')+
    '<div class="box" id="smsg">'+(pic?'오른쪽 그림처럼 만들어요!':'1부터 차례대로!')+'</div></div></div>';
  rMoves();
  if(pic)picImg(G.pic,function(im){if(!G||G.kind!=='slide')return;G.im=im;layoutS();});else layoutS();
}
function numPreview(){var h='<div style="display:grid;grid-template-columns:repeat('+G.cols+',1fr);gap:4px;max-width:220px;margin:0 auto">';for(var i=0;i<G.n;i++)h+='<div style="background:'+(i<G.n-1?NUMC[Math.floor(i/G.cols)]:'#e9f5f1')+';color:#fff;border-radius:8px;padding:4px 0">'+(i<G.n-1?i+1:'')+'</div>';return h+'</div>';}
function rMoves(){var e=document.getElementById('mv');if(e)e.innerHTML='👆 '+G.moves+'번';}
function layoutS(){
  var box=document.getElementById('sbox');if(!box)return;var W=box.clientWidth,H=box.clientHeight,bw=Math.min(W,H*4/3),bh=bw*.75,gap=4;
  var b=document.getElementById('sboard');b.style.left=(W-bw)/2+'px';b.style.top=(H-bh)/2+'px';b.style.width=bw+'px';b.style.height=bh+'px';b.innerHTML='';
  var cw=(bw-gap)/G.cols,ch=(bh-gap)/G.rows,dpr=Math.min(window.devicePixelRatio||1,2);G.S={cw:cw,ch:ch,gap:gap};G.els=[];
  for(var id=0;id<G.n;id++){var t=document.createElement('div');t.className='tl'+(G.mode==='num'?' big':'');t.style.width=(cw-gap)+'px';t.style.height=(ch-gap)+'px';t.setAttribute('data-k',id);
    var r=Math.floor(id/G.cols),c=id%G.cols;
    if(G.mode==='pic'&&G.im){var cv=document.createElement('canvas');cv.width=Math.round((cw-gap)*dpr);cv.height=Math.round((ch-gap)*dpr);cv.getContext('2d').drawImage(G.im,c*600/G.cols,r*450/G.rows,600/G.cols,450/G.rows,0,0,cv.width,cv.height);t.appendChild(cv);}
    else t.style.background=NUMC[r];
    var lab=document.createElement('i');lab.textContent=id+1;if(G.mode==='pic'&&!G.nums)lab.style.display='none';t.appendChild(lab);
    t.onpointerdown=(function(k){return function(ev){ev.preventDefault();tapS(k);};})(id);
    G.els[id]=t;if(id<G.n-1||G.done)b.appendChild(t);}
  placeS(true);
}
function placeS(instant){var S=G.S;G.arr.forEach(function(id,pos){if(id<0)return;var el=G.els[id],r=Math.floor(pos/G.cols),c=pos%G.cols;if(instant)el.style.transition='none';el.style.transform='translate('+(S.gap+c*S.cw)+'px,'+(S.gap+r*S.ch)+'px)';if(instant){el.getBoundingClientRect();el.style.transition='';}});}
function tapS(id){
  if(G.busy||G.done)return;ac();var a=G.arr,pos=a.indexOf(id),e=a.indexOf(-1),pr=Math.floor(pos/G.cols),pc=pos%G.cols,er=Math.floor(e/G.cols),ec=e%G.cols,step;
  if(pr===er)step=pc<ec?1:-1;else if(pc===ec)step=pr<er?G.cols:-G.cols;
  else{sfx('no');var el=G.els[id];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');G.wrong++;
    if(G.wrong>=2){glowMovable(true);document.getElementById('smsg').innerHTML='💡 반짝이는 조각만 움직일 수 있어요';}return;}
  for(var k=e;k!==pos;k-=step){a[k]=a[k-step];}a[pos]=-1;
  G.moves++;G.wrong=0;glowMovable(false);G.busy=true;sfx('slide');placeS(false);rMoves();
  setTimeout(function(){G.busy=false;if(solved(G.arr))winS();},170);
}
function glowMovable(on){var e=G.arr.indexOf(-1),er=Math.floor(e/G.cols),ec=e%G.cols;G.arr.forEach(function(id,pos){if(id<0)return;var ok=on&&(Math.floor(pos/G.cols)===er||pos%G.cols===ec);G.els[id].classList.toggle('glow',ok);});}
function winS(){
  G.done=true;var last=G.els[G.n-1];document.getElementById('sboard').appendChild(last);G.arr[G.n-1]=G.n-1;placeS(true);
  var th=SSTAR[G.z],s=G.moves<=th[0]?3:(G.moves<=th[1]?2:1),key=G.mode+G.z,old=D.slide[key];
  if(!old||s>old.s||(s===old.s&&G.moves<old.m))D.slide[key]={s:s,m:G.moves};save();
  sfx('win');confetti();say('완성! '+G.moves+'번 만에 맞췄어요!');
  overlay((G.mode==='pic'?'<div class="pic alive">'+picSvg(G.pic,'w')+'</div>':'<div style="font-size:70px" class="em">🎉</div>')+'<div style="font-size:30px;margin-top:8px">완성! '+G.moves+'번 움직였어요</div><div class="rate">'+stars(s)+'</div>'+(s<3?'<div style="font-size:18px;color:#5f7f78">'+th[0]+'번 안에 맞추면 ★★★</div>':'')+
    '<button class="btn" id="b1">한 번 더 ▶</button><button class="btn ghost" id="b3">처음으로</button>',{b1:startS,b3:function(){go('home');}},500);
}

// ---------- 공통 ----------
function overlay(html,acts,delay){setTimeout(function(){if(!G)return;var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel">'+html+'</div>';document.body.appendChild(o);
  Object.keys(acts).forEach(function(k){var b=o.querySelector('#'+k);if(b)b.onclick=function(){o.remove();acts[k]();};});},delay||0);}
function confetti(){var em=['🎉','⭐','🎊','✨','🧩'];for(var i=0;i<22;i++){var s=document.createElement('div');s.className='conf em';s.textContent=em[i%em.length];s.style.left=R(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},4000);})(s);}}
window.addEventListener('resize',function(){
  if(scr==='jig'&&G&&G.L&&!G.drag){var a=document.getElementById('area');if(a&&(Math.abs(a.clientWidth-G.lw)>40||Math.abs(a.clientHeight-G.lh)>40))layoutJ();}
  else if(scr==='slide'&&G&&G.S)layoutS();});
window.App={
  tab:function(t){D.tab=t;save();rHome();},pic:function(i){D.pic=i;save();rHome();},size:function(n){D.size=n;save();rHome();},
  smode:function(m){D.smode=m;save();rHome();},ssize:function(z){D.ssize=z;save();rHome();},set:function(k){D[k]=!D[k];save();rHome();},
  start:function(){if(D.tab==='jig')startJ(D.pic,D.size);else startS();},home:function(){G=null;go('home');},
  ghost:function(){G.ghost=!G.ghost;D.ghost=G.ghost;save();document.getElementById('gimg').style.opacity=G.ghost?0.3:0;document.getElementById('gh').className='pill'+(G.ghost?' on':'');},
  nums:function(){G.nums=!G.nums;D.nums=G.nums;save();rSlide();},reshuf:function(){startS();}
};
go('home');
</script>
