<style>
:root{--bg:#eaf6ff;--ink:#23364a;--sub:#6f8399;--main:#339af0;--main-d:#1c7ed6;--line:#cfe5f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#app{height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;padding:12px 14px}
#app.home{overflow-y:auto;padding-bottom:70px}
h1{font-weight:normal;font-size:44px;text-align:center;margin:6px 0 2px}
.sub{text-align:center;color:var(--sub);font-size:19px;line-height:1.5}
.stg{background:#fff;border-radius:24px;padding:12px 14px;margin-top:12px;box-shadow:0 4px 0 var(--line)}
.stg h3{font-weight:normal;font-size:24px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stg h3 small{font-size:16px;color:var(--sub)}
.lvs{display:flex;flex-wrap:wrap;gap:8px}
.lb{width:74px;height:74px;border-radius:18px;background:#f1f8ff;border:4px solid transparent;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 4px 0 var(--line)}
.lb small{font-size:14px;color:#f0a500;letter-spacing:1px;min-height:15px}
.lb.sel{border-color:var(--main);background:#fff}
.lb.done{background:#e6fcf5}
.lb.lock{opacity:.35;pointer-events:none}
.lb:active,.btn:active,.pill:active,.pb:active,.tile:active{transform:translateY(3px);box-shadow:none}
.btn{display:block;width:100%;font-size:30px;padding:16px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:14px}
.btn.green{background:#2ecc71;box-shadow:0 6px 0 #22a35a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.tg{display:flex;gap:10px;justify-content:center;margin-top:12px}
.tg button{background:#fff;border-radius:999px;padding:8px 16px;font-size:20px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.tg button.on{border-color:var(--main)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:20px;white-space:nowrap}
.grow{flex:1}
.play{flex:1;min-height:0;display:flex;gap:14px}
.bbox{flex:1.15;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.bbox svg{width:100%;height:100%;display:block}
.side{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
@media (orientation:portrait){.play{flex-direction:column}.bbox{flex:none;height:42vh}.side{flex:1}}
.msg{background:#fff;border-radius:18px;padding:10px 14px;font-size:22px;line-height:1.4;box-shadow:0 4px 0 var(--line);min-height:56px;word-break:keep-all;text-align:center}
.msg .bad{color:#e03131}.msg .good{color:#22a35a}.msg .hint{display:block;font-size:19px;color:#6741d9;margin-top:4px}
.prog{flex:1;min-height:110px;background:#fff;border-radius:22px;box-shadow:inset 0 0 0 3px var(--line);padding:10px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
.prog .ph{color:var(--sub);font-size:20px;width:100%;text-align:center;margin-top:16px}
.tile{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.15);position:relative;flex:none}
.tile svg{width:44px;height:44px}
.tile.run{outline:5px solid #ffd43b;outline-offset:1px;animation:glow .5s ease-in-out infinite alternate}
.tile.err{outline:5px solid #fa5252;outline-offset:1px}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.12)}}
.c-ar{background:#4dabf7}.c-fw{background:#40c057}.c-tn{background:#ff922b}.c-rp{background:#9775fa}
.rep{display:flex;align-items:center;flex-wrap:wrap;gap:6px;border:4px solid #9775fa;border-radius:18px;padding:5px;background:#f3f0ff;min-height:72px}
.rep.open{border-style:dashed;background:#ebe4ff}
.rep.run{outline:4px solid #ffd43b}
.rh{display:flex;flex-direction:column;align-items:center;gap:2px}
.rn{background:#7048e8;color:#fff;border-radius:999px;font-size:20px;padding:2px 10px;box-shadow:0 3px 0 #5f3dc4}
.rx{font-size:15px;color:#7048e8;padding:2px 6px}
.rep .slot{width:52px;height:52px;border-radius:12px;border:3px dashed #b197fc;color:#9775fa;font-size:28px;display:flex;align-items:center;justify-content:center}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pb{width:86px;border-radius:18px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:16px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pb svg{width:50px;height:50px}
.pb.endr{background:#fff;color:#7048e8;box-shadow:0 5px 0 #d0bfff;border:3px solid #9775fa}
.ctl{display:flex;gap:8px}
.ctl button{border-radius:18px;font-size:24px;padding:12px 10px;background:#fff;box-shadow:0 5px 0 var(--line)}
.ctl .go{flex:1;background:#2ecc71;color:#fff;font-size:30px;box-shadow:0 5px 0 #22a35a}
.ctl .stop{flex:1;background:#fa5252;color:#fff;font-size:30px;box-shadow:0 5px 0 #c92a2a}
.dis{opacity:.4;pointer-events:none}
#rb{transition:transform .38s ease-in-out}
#rbd{transition:transform .25s ease-in-out}
#rb.bump #rbi{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,0)}75%{transform:translate(6px,0)}}
.overlay{position:fixed;inset:0;background:rgba(20,40,70,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:24px;max-width:480px;width:100%;text-align:center}
.rate{font-size:54px;letter-spacing:6px;color:#f0a500}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>

<script>
'use strict';
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[R(0,a.length-1)];}
// ---------- 판 ----------
// R=로봇(오른쪽 보기) ^>v<=로봇 방향, B=배터리, *=별, #=나무/상자
var STAGES=[
  {n:'화살표',d:'⬆⬇⬅➡ 화살표로 길 만들기',pal:['up','down','left','right'],say:'화살표 블록을 쌓아서 로봇을 배터리까지 보내 주세요.'},
  {n:'별 모으기',d:'별을 다 모으고 배터리로',pal:['up','down','left','right'],say:'별을 모두 모으고 배터리로 가요.'},
  {n:'돌기',d:'앞으로 가기와 왼쪽·오른쪽 돌기',pal:['fw','tl','tr'],say:'로봇은 보고 있는 쪽으로 앞으로 가요. 돌기 블록으로 방향을 바꿔요.'},
  {n:'반복',d:'🔁 반복 블록으로 짧게',pal:['fw','tl','tr','rep'],say:'반복 블록을 쓰면 블록을 조금만 써도 돼요.'}
];
var LV=[
  [0,['.....','R...B','.....']],
  [0,['..B..','.....','.....','..R..']],
  [0,['R....','.....','....B']],
  [0,['.....','R.#.B','.....']],
  [0,['B....','###..','.....','R....']],
  [0,['R.#..','..#.B','..#..','.....']],
  [0,['.....','.###.','.#B#.','.#...','R....']],
  [0,['R..#....','.#.#.##.','.#...#B.','.####...']],
  [1,['.....','R.*.B','.....']],
  [1,['..*..','.....','R...B']],
  [1,['*...*','.....','..R..','.....','B....']],
  [1,['R.#.*','..#..','*....','..#.B']],
  [1,['*.#.B','..#..','..#..','R...*']],
  [1,['.*..*','.##..','R...#','.#.*.','...#B']],
  [1,['*.#..','..#.*','R....','.#.#.','*.B..']],
  [2,['.....','>...B','.....']],
  [2,['....B','.....','^....']],
  [2,['>...','###.','B...']],
  [2,['.*..','.##.','^..B']],
  [2,['..#.B','..#..','..#..','.....','^....']],
  [2,['>..#.','.#.#.','.#...','.####','....B']],
  [2,['*...*','.###.','.#B#.','.#.#.','^...*']],
  [2,['.*.#..','.#....','.#.##*','>..#B.']],
  [3,['#.#.#.#.','>......B','.#.#.#.#'],[['rep',7,['fw']]]],
  [3,['####B','###..','##..#','#..##','>.###'],[['rep',4,['fw','tl','fw','tr']]]],
  [3,['*...*','.###.','.###.','.###.','^...B'],[['rep',3,['fw','fw','fw','fw','tr']]]],
  [3,['>.....','.*....','#.*...','##.*..','###..B'],[['rep',5,['fw','tr','fw','tl']]]],
  [3,['>......','######.','B.....*'],[['rep',6,['fw']],'tr',['rep',2,['fw']],'tr',['rep',6,['fw']]]],
  [3,['...*.B','#.*.##','#*.###','>.####'],[['rep',3,['fw','tl','fw','tr']],['rep',2,['fw']]]],
  [3,['*..*..*','.#####.','.#####.','*#####*','.#####.','.#####.','^.B*..*'],[['rep',4,['fw','fw','fw','fw','fw','fw','tr']]]]
];
var DR=[-1,0,1,0],DC=[0,1,0,-1],ABS={up:0,right:1,down:2,left:3};
function parse(i){var L=LV[i],m=L[1],o={st:L[0],rows:m.length,cols:m[0].length,wall:{},stars:[],sol:L[2]};
  for(var r=0;r<o.rows;r++)for(var c=0;c<o.cols;c++){var ch=m[r].charAt(c);
    if(ch==='#')o.wall[r+','+c]=1;else if(ch==='B')o.bat=[r,c];else if(ch==='*')o.stars.push([r,c]);
    else if('R^>v<'.indexOf(ch)>=0){o.start=[r,c,ch==='R'?1:'^>v<'.indexOf(ch)];}}
  return o;}
function free(P,r,c){return r>=0&&c>=0&&r<P.rows&&c<P.cols&&!P.wall[r+','+c];}
function starIdx(P,r,c){for(var i=0;i<P.stars.length;i++)if(P.stars[i][0]===r&&P.stars[i][1]===c)return i;return -1;}
// 가장 짧은 길 (블록 수와 발자국)
function solve(P){
  var turn=P.st>=2,full=(1<<P.stars.length)-1,s0=[P.start[0],P.start[1],turn?P.start[2]:0,0];
  var key=function(s){return s.join(',');},seen={},q=[{s:s0,path:[[s0[0],s0[1]]],n:0,ops:[]}];seen[key(s0)]=1;
  while(q.length){var cur=q.shift(),s=cur.s;
    if(s[0]===P.bat[0]&&s[1]===P.bat[1]&&s[3]===full)return cur;
    var moves=turn?['fw','tl','tr']:['up','right','down','left'];
    for(var k=0;k<moves.length;k++){var mv=moves[k],r=s[0],c=s[1],d=s[2],m=s[3];
      if(mv==='tl')d=(d+3)%4;else if(mv==='tr')d=(d+1)%4;else{var dd=turn?d:ABS[mv];r+=DR[dd];c+=DC[dd];if(!free(P,r,c))continue;var si=starIdx(P,r,c);if(si>=0)m|=1<<si;}
      var ns=[r,c,d,m];if(seen[key(ns)])continue;seen[key(ns)]=1;
      q.push({s:ns,n:cur.n+1,ops:cur.ops.concat([mv]),path:mv==='tl'||mv==='tr'?cur.path:cur.path.concat([[r,c]])});}}
  return null;}
function solToProg(sol){return sol.map(function(x){return typeof x==='string'?{t:x}:{t:'rep',n:x[1],b:x[2].map(function(y){return {t:y};})};});}
function countBlocks(p){var n=0;p.forEach(function(b){n++;if(b.t==='rep')n+=b.b.length;});return n;}
var INFO=LV.map(function(_,i){var P=parse(i);if(P.sol){var pr=solToProg(P.sol),sim=simulate(P,pr);return {par:countBlocks(pr),path:sim.path,ok:sim.res==='win'};}var S=solve(P);return {par:S.n,path:S.path,ops:S.ops,ok:true};});
function flatten(p){var out=[];p.forEach(function(b,i){if(b.t==='rep'){for(var k=0;k<b.n;k++)b.b.forEach(function(x,j){out.push({op:x.t,id:i+'.'+j,rep:i});});}else out.push({op:b.t,id:''+i});});return out;}
function simulate(P,prog){var r=P.start[0],c=P.start[1],d=P.start[2],got={},path=[[r,c]],steps=flatten(prog);
  for(var i=0;i<steps.length;i++){var o=step1(P,{r:r,c:c,d:d},steps[i].op);if(o.bump)return {res:'bump',path:path};r=o.r;c=o.c;d=o.d;if(o.moved){path.push([r,c]);var si=starIdx(P,r,c);if(si>=0)got[si]=1;}
    if(r===P.bat[0]&&c===P.bat[1]&&Object.keys(got).length===P.stars.length)return {res:'win',path:path,used:i+1};}
  return {res:'end',path:path};}
function step1(P,s,op){var r=s.r,c=s.c,d=s.d;
  if(op==='tl')return {r:r,c:c,d:(d+3)%4};if(op==='tr')return {r:r,c:c,d:(d+1)%4};
  if(op!=='fw')d=ABS[op];var nr=r+DR[d],nc=c+DC[d];
  if(!free(P,nr,nc))return {r:r,c:c,d:d,bump:true,out:!(nr>=0&&nc>=0&&nr<P.rows&&nc<P.cols)};
  return {r:nr,c:nc,d:d,moved:true};}

// ---------- 저장 ----------
var KEY='kidsRobot.v1';
var D={best:{},lv:-1,voice:true,sfx:true};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)D[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
var NAME='',GRADE='K';try{var HB=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');if(HB&&HB.profiles){var PF=HB.profiles.filter(function(x){return x.id===HB.cur;})[0]||HB.profiles[0];if(PF){NAME=PF.name;GRADE=PF.grade||'K';}}}catch(e){}
var STAGE_START=[0,8,15,23],START=STAGE_START[{K:0,'1':1,'2':2,'3':2}[GRADE]||0];
function unlocked(i){return i<=START||D.best[i]!=null||D.best[i-1]!=null;}
function defaultLv(){for(var i=START;i<LV.length;i++)if(D.best[i]==null&&unlocked(i))return i;for(i=0;i<LV.length;i++)if(D.best[i]==null&&unlocked(i))return i;return START;}

// ---------- 소리·읽어주기 ----------
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t,dur,type,vol,f2){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sfx(k){if(!D.sfx)return;var a=ac();if(!a)return;var t=a.currentTime;
  if(k==='add')tone(660,t,0.08,'square',0.04);
  else if(k==='del')tone(330,t,0.08,'square',0.04);
  else if(k==='move'){tone(520,t,0.07,'square',0.035);tone(780,t+0.06,0.07,'square',0.03);}
  else if(k==='turn')tone(440,t,0.15,'triangle',0.06,700);
  else if(k==='star'){tone(1047,t,0.1,'sine',0.13);tone(1568,t+0.08,0.16,'sine',0.11);}
  else if(k==='bump'){tone(120,t,0.3,'sawtooth',0.12,60);tone(90,t,0.25,'square',0.06);}
  else if(k==='no')tone(260,t,0.16,'triangle',0.1);
  else if(k==='win')[523,659,784,1047,1319].forEach(function(f,i){tone(f,t+i*0.1,0.22,'square',0.05);tone(f,t+i*0.1,0.22,'sine',0.1);});}
function say(t){if(!D.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F300}-\u{1FAFF}☀-➿⬀-⯿️]/gu,''));u.lang='ko-KR';u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}

// ---------- 그림 ----------
function ico(t){
  var arrow='<path d="M50 12 L82 46 H62 V88 H38 V46 H18 Z" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="3" stroke-linejoin="round"/>';
  var turnL='<path d="M76 90 V52 C76 36 66 30 52 30 H40" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/><path d="M44 8 L14 30 L44 52 Z" fill="#fff" stroke-linejoin="round" stroke="#fff" stroke-width="4"/>';
  var s='<svg viewBox="0 0 100 100">';
  if(ABS[t]!=null)s+='<g transform="rotate('+(ABS[t]*90)+' 50 50)">'+arrow+'</g>';
  else if(t==='fw')s+=arrow;
  else if(t==='tl')s+=turnL;
  else if(t==='tr')s+='<g transform="translate(100 0) scale(-1 1)">'+turnL+'</g>';
  else if(t==='rep')s+='<path d="M28 40 A24 24 0 0 1 72 34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M80 18 L82 44 L58 38 Z" fill="#fff"/><path d="M72 60 A24 24 0 0 1 28 66" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M20 82 L18 56 L42 62 Z" fill="#fff"/>';
  return s+'</svg>';}
var NAMEB={up:'위로',down:'아래로',left:'왼쪽으로',right:'오른쪽으로',fw:'앞으로',tl:'왼쪽 돌기',tr:'오른쪽 돌기',rep:'반복'};
function cls(t){return ABS[t]!=null?'c-ar':t==='fw'?'c-fw':t==='rep'?'c-rp':'c-tn';}
function robotSvg(){
  return '<g id="rbi"><g id="rbd" style="transform-origin:50px 50px"><path d="M97 50 L85 40 L85 60 Z" fill="#fab005" stroke="#e67700" stroke-width="2" stroke-linejoin="round"/></g>'+
  '<line x1="50" y1="15" x2="50" y2="24" stroke="#495057" stroke-width="4"/><circle cx="50" cy="13" r="5" fill="#ff6b6b"/>'+
  '<rect x="22" y="24" width="56" height="38" rx="12" fill="#74c0fc" stroke="#1c7ed6" stroke-width="4"/>'+
  '<circle cx="38" cy="42" r="9" fill="#fff"/><circle cx="62" cy="42" r="9" fill="#fff"/><g id="eyes"><circle cx="38" cy="42" r="4.5" fill="#23364a"/><circle cx="62" cy="42" r="4.5" fill="#23364a"/></g>'+
  '<rect x="41" y="53" width="18" height="4" rx="2" fill="#1c7ed6"/>'+
  '<rect x="30" y="62" width="40" height="22" rx="7" fill="#4dabf7" stroke="#1c7ed6" stroke-width="4"/><circle cx="50" cy="73" r="4" fill="#ffd43b"/>'+
  '<rect x="27" y="83" width="14" height="8" rx="3" fill="#495057"/><rect x="59" y="83" width="14" height="8" rx="3" fill="#495057"/></g>';}
function batSvg(r,c){var x=c*100,y=r*100;return '<g id="bat" transform="translate('+x+' '+y+')"><rect x="22" y="26" width="52" height="56" rx="8" fill="#51cf66" stroke="#2b8a3e" stroke-width="5"/><rect x="38" y="16" width="20" height="10" rx="3" fill="#2b8a3e"/><path d="M52 34 L38 56 H50 L44 76 L62 50 H50 L56 34 Z" fill="#ffe066" stroke="#e67700" stroke-width="2" stroke-linejoin="round"/></g>';}
function starSvg(r,c,i){var x=c*100+50,y=r*100+52,p=[];for(var k=0;k<10;k++){var a=-Math.PI/2+k*Math.PI/5,rr=k%2?15:34;p.push((x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1));}
  return '<polygon id="st'+i+'" points="'+p.join(' ')+'" fill="#ffd43b" stroke="#f59f00" stroke-width="4" stroke-linejoin="round" style="transition:opacity .3s"/>';}

// ---------- 화면 ----------
var app=document.getElementById('app'),screen='home',G=null;
function go(s){screen=s;stopRun();var hb=document.getElementById('hubbtn');if(hb)hb.style.display=s==='play'?'none':'';app.className=s;({home:rHome,play:rPlay})[s]();}
function stars(n){var s='';for(var i=0;i<3;i++)s+=i<n?'★':'☆';return s;}
function rHome(){
  if(D.lv<0||!unlocked(D.lv))D.lv=defaultLv();
  var h='<h1>🤖 로봇 코딩 놀이</h1><div class="sub">블록을 쌓아서 로봇을 배터리까지 보내요!</div>';
  STAGES.forEach(function(S,si){h+='<div class="stg"><h3>'+(si+1)+'단계 · '+S.n+' <small>'+S.d+'</small></h3><div class="lvs">';
    LV.forEach(function(L,i){if(L[0]!==si)return;var b=D.best[i],lock=!unlocked(i);
      h+='<button class="lb'+(D.lv===i?' sel':'')+(b!=null?' done':'')+(lock?' lock':'')+'" onclick="App.lv('+i+')">'+(lock?'<span class="em" style="font-size:24px">🔒</span>':(i+1))+'<small>'+(b!=null?stars(b):'')+'</small></button>';});
    h+='</div></div>';});
  h+='<div class="tg"><button class="'+(D.voice?'on':'')+'" onclick="App.set(\'voice\')">🗣️ 읽어주기 '+(D.voice?'켬':'끔')+'</button><button class="'+(D.sfx?'on':'')+'" onclick="App.set(\'sfx\')">🔊 효과음 '+(D.sfx?'켬':'끔')+'</button></div>';
  h+='<button class="btn" onclick="App.start()">'+(D.lv+1)+'판 시작! ▶</button>';
  app.innerHTML=h;
  var sel=app.querySelector('.lb.sel');if(sel&&sel.scrollIntoView&&rHome.first!==false){rHome.first=false;try{sel.scrollIntoView({block:'center'});}catch(e){}}
}
function start(i){if(i==null)i=D.lv;var P=parse(i);G={lv:i,P:P,prog:[],open:-1,fails:0,running:false,dirty:false,hint:false,msg:''};resetBot();go('play');
  var S=STAGES[P.st];G.msg=(i===0?'👇 아래 <b>➡</b> 블록을 눌러 쌓고 <b>▶ 실행</b>!':S.say);say((NAME&&i===0?NAME+', ':'')+S.say);if(screen==='play')rMsg();}
function resetBot(){var P=G.P;G.bot={r:P.start[0],c:P.start[1],d:P.start[2]};G.got={};G.dirty=false;}
function rPlay(){
  var P=G.P,I=INFO[G.lv],S=STAGES[P.st];
  var h='<div class="hud"><button class="pill" onclick="App.go(\'home\')">◀</button><span class="pill">'+(G.lv+1)+'판 · '+S.n+'</span>'+(P.stars.length?'<span class="pill" id="sc"></span>':'')+'<span class="grow"></span><span class="pill">★★★ 블록 '+I.par+'개</span><span class="pill" id="bc"></span></div>';
  h+='<div class="play"><div class="bbox" id="bbox"></div><div class="side"><div class="msg" id="msg"></div><div class="prog" id="prog"></div><div class="pal" id="pal"></div><div class="ctl" id="ctl"></div></div></div>';
  app.innerHTML=h;rBoard();rProg();rMsg();rStarCount();
}
function rBoard(){
  var P=G.P,W=P.cols*100,H=P.rows*100,s='<svg viewBox="-6 -6 '+(W+12)+' '+(H+12)+'"><rect x="-6" y="-6" width="'+(W+12)+'" height="'+(H+12)+'" rx="22" fill="#a5d8ff"/>';
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){var x=c*100,y=r*100;s+='<rect x="'+(x+3)+'" y="'+(y+3)+'" width="94" height="94" rx="14" fill="'+((r+c)%2?'#f1f8ff':'#ffffff')+'"/>';
    if(P.wall[r+','+c])s+='<text x="'+(x+50)+'" y="'+(y+56)+'" font-size="68" text-anchor="middle" dominant-baseline="middle" class="em">'+((r*7+c*3)%4===0?'📦':'🌳')+'</text>';}
  if(G.hint)INFO[G.lv].path.forEach(function(p,i){if(i)s+='<circle cx="'+(p[1]*100+50)+'" cy="'+(p[0]*100+50)+'" r="11" fill="#b197fc" opacity=".75"/><text x="'+(p[1]*100+50)+'" y="'+(p[0]*100+51)+'" font-size="13" fill="#fff" text-anchor="middle" dominant-baseline="middle">'+i+'</text>';});
  s+=batSvg(P.bat[0],P.bat[1]);
  P.stars.forEach(function(st,i){s+=starSvg(st[0],st[1],i);});
  s+='<g id="rb" style="transform:translate('+(G.bot.c*100)+'px,'+(G.bot.r*100)+'px)">'+robotSvg()+'</g><text id="kung" x="0" y="0" font-size="34" fill="#e03131" stroke="#fff" stroke-width="6" paint-order="stroke" text-anchor="middle" style="display:none">쿵!</text></svg>';
  document.getElementById('bbox').innerHTML=s;drawBot(true);
  P.stars.forEach(function(st,i){document.getElementById('st'+i).style.opacity=G.got[i]?0:1;});
}
function drawBot(instant){var rb=document.getElementById('rb');if(!rb)return;var b=G.bot;
  if(instant)rb.style.transition='none';rb.style.transform='translate('+(b.c*100)+'px,'+(b.r*100)+'px)';
  var dd=document.getElementById('rbd');if(instant)dd.style.transition='none';
  var cur=G.rot==null?(b.d-1)*90:G.rot,want=(b.d-1)*90;while(want-cur>180)want-=360;while(cur-want>180)want+=360;G.rot=instant?(b.d-1)*90:want;dd.style.transform='rotate('+G.rot+'deg)';
  document.getElementById('eyes').setAttribute('transform','translate('+(DC[b.d]*3)+' '+(DR[b.d]*3)+')');
  if(instant){rb.getBoundingClientRect();rb.style.transition='';dd.style.transition='';}}
function rStarCount(){var e=document.getElementById('sc');if(e)e.innerHTML='⭐ '+Object.keys(G.got).length+' / '+G.P.stars.length;}
function rMsg(){var e=document.getElementById('msg');if(e)e.innerHTML=G.msg||'&nbsp;';}
function rProg(){
  var p=G.prog,h='';
  if(!p.length)h='<div class="ph">아래 블록을 누르면 여기에 쌓여요 👇</div>';
  p.forEach(function(b,i){
    if(b.t==='rep'){h+='<div class="rep'+(G.open===i?' open':'')+'" data-id="'+i+'"><div class="rh"><button class="rn" onclick="App.cyc('+i+')">🔁×'+b.n+'</button><button class="rx" onclick="App.del(\''+i+'\')">✖ 빼기</button></div>';
      b.b.forEach(function(x,j){h+='<button class="tile '+cls(x.t)+'" data-id="'+i+'.'+j+'" onclick="App.del(\''+i+'.'+j+'\')">'+ico(x.t)+'</button>';});
      h+=(G.open===i?'<div class="slot">＋</div>':'<button class="slot" onclick="App.openRep('+i+')">＋</button>')+'</div>';}
    else h+='<button class="tile '+cls(b.t)+'" data-id="'+i+'" onclick="App.del(\''+i+'\')">'+ico(b.t)+'</button>';});
  var pe=document.getElementById('prog');pe.innerHTML=h;pe.className='prog'+(G.running?' dis':'');pe.scrollTop=pe.scrollHeight;
  var S=STAGES[G.P.st],ph='';
  S.pal.forEach(function(t){ph+='<button class="pb '+cls(t)+'" onclick="App.add(\''+t+'\')">'+ico(t)+NAMEB[t]+'</button>';});
  if(G.open>=0)ph+='<button class="pb endr" onclick="App.closeRep()"><span style="font-size:34px;line-height:50px">⤴</span>반복 끝</button>';
  var pa=document.getElementById('pal');pa.innerHTML=ph;pa.className='pal'+(G.running?' dis':'');
  document.getElementById('ctl').innerHTML=G.running?'<button class="stop" onclick="App.stop()">■ 멈추기</button>':
    '<button onclick="App.back()"'+(p.length?'':' class="dis"')+'>⌫ 하나 지우기</button><button onclick="App.clear()"'+(p.length?'':' class="dis"')+'>🗑️ 모두</button><button class="go" onclick="App.run()">▶ 실행</button>';
  document.getElementById('bc').innerHTML='🧱 '+countBlocks(p)+'개';
}
// ---------- 블록 편집 ----------
var lastAdd=0;
function editStart(){if(G.running)return false;if(G.dirty){resetBot();rBoard();rStarCount();}clearMarks();return true;}
function add(t){var now=Date.now();if(now-lastAdd<200)return;if(!editStart())return;lastAdd=now;ac();
  if(t==='rep'){if(G.prog.length>=16){full();return;}G.prog.push({t:'rep',n:2,b:[]});G.open=G.prog.length-1;sfx('add');G.msg='🔁 반복 안에 넣을 블록을 눌러요. <b>×2</b>를 누르면 횟수가 바뀌어요.';rMsg();rProg();return;}
  if(G.open>=0&&G.prog[G.open]){var rb=G.prog[G.open];if(rb.b.length>=8){full();return;}rb.b.push({t:t});}
  else{if(G.prog.length>=24){full();return;}G.prog.push({t:t});}
  sfx('add');if(G.msg&&G.msg.indexOf('class="bad"')>=0){G.msg='';rMsg();}rProg();}
function full(){sfx('no');G.msg='블록이 너무 많아요! 조금 지워 볼까요?';rMsg();}
function del(id){if(!editStart())return;var a=String(id).split('.'),i=+a[0];
  if(a.length>1)G.prog[i].b.splice(+a[1],1);else{G.prog.splice(i,1);if(G.open===i)G.open=-1;else if(G.open>i)G.open--;}
  sfx('del');rProg();}
function back(){if(!editStart())return;var p=G.prog;if(!p.length)return;var l=p[p.length-1];
  if(l.t==='rep'&&G.open===p.length-1&&l.b.length)l.b.pop();else{p.pop();if(G.open>=p.length)G.open=-1;}sfx('del');rProg();}
function clearAll(){if(!editStart())return;G.prog=[];G.open=-1;sfx('del');rProg();}
function cyc(i){if(!editStart())return;var b=G.prog[i];b.n=b.n>=9?2:b.n+1;sfx('add');rProg();}
function openRep(i){if(!editStart())return;G.open=i;rProg();}
function closeRep(){G.open=-1;rProg();}
function clearMarks(){Array.prototype.forEach.call(document.querySelectorAll('.run,.err'),function(e){e.classList.remove('run');e.classList.remove('err');});}
// ---------- 실행 ----------
function run(){
  if(G.running)return;ac();
  if(!G.prog.length){sfx('no');G.msg='블록을 먼저 쌓아 주세요 👇';rMsg();return;}
  var steps=flatten(G.prog);if(!steps.length){sfx('no');G.msg='🔁 반복 안에 블록을 넣어 주세요.';rMsg();return;}
  resetBot();G.rot=null;rBoard();rStarCount();G.running=true;G.open=-1;G.msg='로봇이 움직여요… 🤖';rMsg();rProg();
  var i=0;
  function hi(s){clearMarks();var t=app.querySelector('[data-id="'+s.id+'"]');if(t)t.classList.add('run');if(s.rep!=null){var c=app.querySelector('.rep[data-id="'+s.rep+'"]');if(c)c.classList.add('run');}}
  function next(){if(!G||!G.running)return;
    if(i>=steps.length){finishRun(null);return;}
    var s=steps[i++];hi(s);var o=step1(G.P,G.bot,s.op);G.bot.d=o.d;
    if(o.bump){drawBot();G.timer=setTimeout(function(){bump(s,o.out);},260);return;}
    G.bot.r=o.r;G.bot.c=o.c;drawBot();G.dirty=true;
    if(o.moved){sfx('move');var si=starIdx(G.P,o.r,o.c);if(si>=0&&!G.got[si]){G.got[si]=1;setTimeout(function(){sfx('star');var e=document.getElementById('st'+si);if(e)e.style.opacity=0;rStarCount();},300);}}
    else sfx('turn');
    if(o.r===G.P.bat[0]&&o.c===G.P.bat[1]&&Object.keys(G.got).length===G.P.stars.length){G.timer=setTimeout(function(){finishRun('win');},550);return;}
    G.timer=setTimeout(next,560);}
  G.timer=setTimeout(next,300);
}
function stopRun(){if(G&&G.running){clearTimeout(G.timer);G.running=false;}}
function bump(s,out){
  if(!G.running)return;sfx('bump');var rb=document.getElementById('rb');rb.classList.add('bump');
  var k=document.getElementById('kung');k.setAttribute('x',G.bot.c*100+50+DC[G.bot.d]*40);k.setAttribute('y',G.bot.r*100+30+DR[G.bot.d]*40);k.style.display='';
  var t=app.querySelector('[data-id="'+s.id+'"]');
  setTimeout(function(){rb.classList.remove('bump');k.style.display='none';if(t){t.classList.remove('run');t.classList.add('err');}},700);
  G.running=false;G.dirty=true;fail(out?'쿵! 길 밖으로는 갈 수 없어요.':'쿵! 부딪혔어요.','빨간 블록을 눌러 빼고 고쳐 봐요.');
}
function finishRun(res){
  G.running=false;
  if(res==='win'){rProg();win();return;}
  clearMarks();var at=G.bot.r===G.P.bat[0]&&G.bot.c===G.P.bat[1],left=G.P.stars.length-Object.keys(G.got).length;
  fail(at&&left?'별을 '+left+'개 더 모아야 배터리가 충전돼요!':(left&&!at?'배터리까지 가야 해요. 별도 '+left+'개 남았어요.':'배터리까지 조금 더 가야 해요!'),'블록을 더 놓거나 고쳐서 다시 해 봐요.');
}
function fail(m,tip){G.fails++;sfx('no');
  if(G.fails>=2&&!G.hint){G.hint=true;rBoard();tip='💡 보라색 발자국 순서대로 따라가 봐요!';}
  G.msg='<span class="bad">'+m+'</span><span class="hint">'+tip+'</span>';rProg();rMsg();say(m.replace('쿵!','쿵! '));}
function win(){
  var n=countBlocks(G.prog),par=INFO[G.lv].par,s=n<=par?3:(n<=par+(G.P.st===3?3:2)?2:1),lv=G.lv;
  if(D.best[lv]==null||s>D.best[lv])D.best[lv]=s;var nx=lv+1<LV.length?lv+1:-1;if(nx>=0)D.lv=nx;save();
  sfx('win');confetti();G.msg='<span class="good">충전 완료! 🔋</span>';rMsg();
  var o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="panel"><div style="font-size:70px" class="em">🤖🔋</div><div style="font-size:30px">배터리 충전 완료!</div><div class="rate">'+stars(s)+'</div><div style="font-size:20px;color:#6f8399">블록 '+n+'개 사용'+(s<3?' · '+par+'개로 풀면 ★★★':' · 최고예요!')+'</div>'+
    (nx>=0?'<button class="btn green" id="nx">다음 판 ▶</button>':'<div style="font-size:24px;margin-top:10px;color:#e67700">🏆 30판을 모두 깼어요!</div>')+'<button class="btn ghost" id="ag">이 판 다시</button><button class="btn ghost" id="hm">판 고르기</button></div>';
  setTimeout(function(){document.body.appendChild(o);},600);say(s===3?'충전 완료! 최고예요!':'충전 완료! 잘했어요!');
  var nb=o.querySelector('#nx');if(nb)nb.onclick=function(){o.remove();start(nx);};
  o.querySelector('#ag').onclick=function(){o.remove();start(lv);};o.querySelector('#hm').onclick=function(){o.remove();go('home');};
}
function confetti(){var em=['🎉','⭐','🎊','✨','🔋'];for(var i=0;i<22;i++){var s=document.createElement('div');s.className='conf em';s.textContent=em[i%em.length];s.style.left=R(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},4000);})(s);}}
window.addEventListener('resize',function(){if(screen==='play'&&!G.running){rPlay();}});
window.App={go:go,start:function(){start();},lv:function(i){D.lv=i;save();rHome();},set:function(k){D[k]=!D[k];save();rHome();},
  add:add,del:del,back:back,clear:clearAll,cyc:cyc,openRep:openRep,closeRep:closeRep,run:run,stop:function(){stopRun();G.dirty=true;G.msg='멈췄어요. 고쳐서 다시 해 봐요.';rMsg();rProg();}};
go('home');
</script>
