<script>(function(){var S=window.screen;function g(){try{return +(JSON.parse(localStorage.getItem('kidsUI.v1')||'{}').scale)||1;}catch(e){return 1;}}var lw=-1;function fit(s){if(s==null)s=g();var m=document.querySelector('meta[name=viewport]');if(!m)return;var a=S.width,b=S.height,o=S.orientation&&S.orientation.type,w=o?(o.indexOf('landscape')===0?Math.max(a,b):Math.min(a,b)):a;lw=a;m.setAttribute('content',s===1?'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no':'width='+Math.round(w/s)+',initial-scale='+s+',minimum-scale='+s+',maximum-scale='+s+',user-scalable=no');}window.kidsFit=fit;fit();function chk(){if(S.width!==lw)fit();}window.addEventListener('orientationchange',function(){setTimeout(chk,300);});window.addEventListener('resize',chk);})();</script>
<script>(function(){var ss=window.speechSynthesis,vs=[],ko=null,en=null,es=-1,keep=[];function load(){if(!ss)return;try{vs=ss.getVoices()||[];}catch(e){vs=[];}ko=null;en=null;es=-1;for(var i=0;i<vs.length;i++){var l=String(vs[i].lang||'').toLowerCase().replace('_','-');if(l.indexOf('ko')===0&&(!ko||vs[i].localService))ko=vs[i];if(l.indexOf('en')===0){var s=(l.indexOf('en-us')===0?2:0)+(vs[i].localService?1:0);if(s>es){en=vs[i];es=s;}}}}if(ss){load();try{ss.addEventListener('voiceschanged',load);}catch(e){ss.onvoiceschanged=load;}}window.kidsVoiceInfo=function(){load();return {api:!!ss,n:vs.length,ko:ko?ko.name+' ('+ko.lang+')':'',en:en?en.name+' ('+en.lang+')':''};};window.kidsSpeak=function(t,rate,lang){if(!ss)return;try{var busy=ss.speaking||ss.pending;if(busy)ss.cancel();if(!ko||!en)load();var E=lang==='en',v=E?en:ko,u=new SpeechSynthesisUtterance(String(t));u.lang=v?v.lang:(E?'en-US':'ko-KR');if(v)u.voice=v;u.rate=rate||0.95;u.volume=1;keep.push(u);if(keep.length>6)keep.shift();var go=function(){try{if(ss.paused)ss.resume();ss.speak(u);}catch(e){}};if(busy)setTimeout(go,150);else go();}catch(e){}};function unlock(){document.removeEventListener('pointerdown',unlock,true);try{if(ss&&!ss.speaking&&!ss.pending){var u=new SpeechSynthesisUtterance(' ');u.volume=0;keep.push(u);ss.speak(u);}}catch(e){}}document.addEventListener('pointerdown',unlock,true);})();</script>
<script>(function(){var K='kidsGate.v1';function p2(n){return (n<10?'0':'')+n;}function day(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}function prof(){try{var H=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0]||null;}catch(e){return null;}}function grade(){var p=prof();return (p&&p.grade)||'K';}var FB='';try{FB=localStorage.getItem('kidsFB')||FB;}catch(e){}function get(){var g={on:true,goal:15,day:'',cnt:0,free:'',pin:'',done:0,kinds:{},lock:'',until:0};try{var o=JSON.parse(localStorage.getItem(K)||'{}');for(var k in o)g[k]=o[k];}catch(e){}if(g.goal>60&&!g.v2)g.goal=15;g.v2=1;if(!g.kinds)g.kinds={};if(g.day!==day()){g.day=day();g.cnt=0;g.done=0;}return g;}function sv(g){try{localStorage.setItem(K,JSON.stringify(g));}catch(e){}}function put(g){sv(g);sched();}function lockOn(g){g=g||get();return g.lock&&(!g.until||Date.now()<g.until)?g.lock:'';}function defStudy(n){return grade()==='K'?(n==='math'||n==='hangul'||n==='english'):(n==='math'||n==='english');}function page(){var m=String(location.pathname).match(/([A-Za-z0-9_-]+)\.html$/);return m?m[1]:'index';}function kind(n,g){n=n||page();if(n==='index')return 'hub';g=g||get();var k=g.kinds[n];if(k==='study'||k==='play')return k;return defStudy(n)?'study':'play';}function study(g){g=g||get();return GAMES.filter(function(x){return kind(x[0],g)==='study';}).map(function(x){return x[0];});}function open(g){g=g||get();if(lockOn(g))return false;return !g.on||g.free===day()||g.cnt>=g.goal||!study(g).length;}var GAMES=[['math','수학'],['hangul','한글'],['english','영어'],['robot','로봇 코딩'],['coding','코딩 공방'],['compose','작곡'],['sudoku','스도쿠'],['clock','시계'],['puzzle','퍼즐'],['maze','미로'],['hidden','숨은그림'],['memory','짝 맞추기'],['hospital','동물 병원'],['coloring','색칠'],['piano','건반']];function add(n){try{n=n||1;if(kind()!=='study')return;var g=get(),was=open(g);g.cnt+=n;var now=open(g);if(!was&&now&&!g.done){g.done=1;put(g);toast();}else put(g);}catch(e){}}function blocked(g){var k=kind(null,g);return (k==='play'&&!open(g))||(k==='study'&&lockOn(g)==='all');}
var CF=['on','goal','free','kinds','lock','until'];function sig(g){var c={},ks=Object.keys(g.kinds||{}).sort(),kk={};ks.forEach(function(k){kk[k]=g.kinds[k];});CF.forEach(function(k){c[k]=k==='kinds'?kk:g[k];});return JSON.stringify(c);}
function url(g,p){return FB+'/fam/'+g.fam+'/dev/'+g.dev+(p?'/'+p:'')+'.json';}
function req(m,u,b,cb){try{var x=new XMLHttpRequest();x.open(m,u,true);x.timeout=8000;x.onload=function(){var d=null;try{d=JSON.parse(x.responseText);}catch(e){}if(cb)cb(x.status>=200&&x.status<300,d);};x.onerror=x.ontimeout=function(){if(cb)cb(false,null);};if(b!==undefined){x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify(b));}else x.send();}catch(e){if(cb)cb(false,null);}}
var pt=null;function sched(){if(!FB)return;clearTimeout(pt);pt=setTimeout(push,1200);}
function push(){var g=get();if(!FB||!g.fam)return;var s=sig(g);if(s!==g.sg){if(g.pend!==s){g.pend=s;g.ct=Date.now();sv(g);}var c=JSON.parse(s);c.t=g.ct;c.by='tab';if(g.rs)c.reset=g.rs;req('PUT',url(g,'cfg'),c,function(ok){if(!ok)return;var g3=get();if(sig(g3)===s){g3.sg=s;sv(g3);}});}
  var P=prof();req('PUT',url(g,'st'),{name:P?P.name:'',grade:grade(),cnt:g.cnt,goal:g.goal,day:g.day,page:page(),at:Date.now(),ct:g.ct||0,study:study(g),open:open(g),lock:lockOn(g)});}
function apply(c){var g=get();CF.forEach(function(k){if(k==='kinds')g.kinds=c.kinds||{};else if(c[k]!==undefined)g[k]=c[k];else g[k]=k==='lock'||k==='free'?'':(k==='until'?0:g[k]);});
  if(c.reset&&c.reset===day()&&g.rs!==c.reset){g.cnt=0;g.done=0;}if(c.reset)g.rs=c.reset;g.ct=c.t;g.sg=sig(g);sv(g);return g;}
function pull(){var g=get();if(!FB||!g.fam||document.hidden)return;req('GET',url(g),undefined,function(ok,d){if(!ok)return;var g2=get();if(g2.fam!==g.fam)return;
  if(d&&d.bye){g2.fam='';g2.sg='';sv(g2);return;}
  if(d&&d.cfg&&d.cfg.t>(g2.ct||0)){g2=apply(d.cfg);if(blocked(g2)){location.replace('index.html#locked');return;}if(window.kidsRemote)try{window.kidsRemote();}catch(e){}}
  else if(!d||!d.cfg)g2.sg='';sv(g2);push();});}
function pair(n,cb){if(!FB)return cb(false);req('GET',FB+'/pair/'+n+'.json',undefined,function(ok,d){if(!ok||!d||!d.c||d.x<Date.now())return cb(false);var g=get();g.fam=d.c;g.dev='t'+Math.random().toString(36).slice(2,10);g.sg='';g.ct=0;sv(g);req('DELETE',FB+'/pair/'+n+'.json');push();cb(true);});}

window.kidsGate={get:get,put:put,open:open,study:study,kind:kind,day:day,grade:grade,prof:prof,add:add,games:GAMES,lockOn:lockOn,fb:!!FB,pair:pair,unpair:unpair,pull:pull,push:push};
if(blocked()){location.replace('index.html#locked');return;}
if(FB){setTimeout(pull,600);setInterval(pull,20000);document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});}function toast(){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:#2ecc71;color:#fff;font-family:Jua,sans-serif;font-size:24px;padding:12px 24px;border-radius:999px;box-shadow:0 6px 0 #22a35a;text-align:center;max-width:92vw';d.innerHTML='🎉 오늘 공부 목표 완료! 이제 놀이를 할 수 있어요';document.body.appendChild(d);setTimeout(function(){d.remove();},7000);try{if(window.kidsSpeak)setTimeout(function(){kidsSpeak('오늘 공부 목표 완료! 이제 놀이를 할 수 있어요');},1500);}catch(e){}}})();</script>

<style>
:root{--bg:#f3f0ff;--ink:#2b2350;--sub:#6c6496;--main:#7048e8;--main-d:#5f3dc4;--line:#d0bfff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#app{height:100%;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px}
#app.scroll{overflow-y:auto;padding-bottom:70px}
h1{font-weight:normal;font-size:44px;text-align:center;margin:6px 0 2px}
h3{font-weight:normal;font-size:24px;margin:14px 0 8px}
.sub{text-align:center;color:var(--sub);font-size:20px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media (orientation:portrait){.modes{grid-template-columns:1fr}}
.mode{background:#fff;border-radius:26px;padding:18px 10px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:30px}

.mode:active,.btn:active,.pill:active,.lb:active,.pb:active,.tile:active{transform:translateY(3px);box-shadow:none}
.tg{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tg button{background:#fff;border-radius:999px;padding:8px 16px;font-size:20px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}.tg button.on{border-color:var(--main);background:#e5dbff}
.btn{display:block;width:100%;font-size:26px;padding:13px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:10px}
.btn.green{background:#2ecc71;box-shadow:0 6px 0 #22a35a}.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:20px;white-space:nowrap}
.grow{flex:1}
.lvs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.lb{width:96px;min-height:86px;background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.lb small{font-size:14px;color:#f08c00;min-height:16px}.lb .tt{font-size:14px;color:var(--sub);word-break:keep-all;text-align:center;line-height:1.1}
.lb.done{background:#ebfbee}.lb.free{width:auto;padding:4px 18px;background:#fff3bf}
.desc{background:#fff;border-radius:20px;padding:10px 16px;font-size:22px;text-align:center;word-break:keep-all;box-shadow:0 4px 0 rgba(0,0,0,.05)}
.desc .bad{color:#e03131}.desc .good{color:#2b8a3e}.desc .hint{display:block;color:#e67700;font-size:19px;margin-top:4px}
.prog{background:#fff;border-radius:22px;box-shadow:inset 0 0 0 3px var(--line);padding:10px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;min-height:96px}
.prog .ph{color:var(--sub);font-size:19px;width:100%;text-align:center;margin-top:10px}
.tile{min-width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.15);font-size:22px;color:#fff;padding:0 8px;flex:none}
.tile.run{outline:5px solid #ffd43b;outline-offset:1px}.tile.err{outline:5px solid #fa5252;outline-offset:1px}
.rep{display:flex;align-items:center;flex-wrap:wrap;gap:6px;border:4px solid #9775fa;border-radius:18px;padding:5px;background:#f3f0ff;min-height:68px}

.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pb{min-width:64px;height:64px;border-radius:16px;color:#fff;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.18);padding:0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.pb small{font-size:13px}
.pb.rp{background:#9775fa}.pb.rs{background:#adb5bd}.pb.endr{background:#fff;color:#7048e8;border:3px solid #9775fa}
.ctl{display:flex;gap:8px}.ctl button{flex:1;font-size:22px;padding:12px 6px;border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--line)}
.ctl .go{background:#2ecc71;color:#fff;box-shadow:0 5px 0 #22a35a;flex:2}.ctl .dis{opacity:.4}
.split{flex:1;min-height:0;display:flex;gap:14px}
.split>.l{flex:1.15;min-width:0;display:flex;flex-direction:column;gap:10px}.split>.r{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
@media (orientation:portrait){.split{flex-direction:column}.split>.l{flex:none}.stage{flex:none!important;height:34vh}}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dot{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.dot.q{background:#ced4da}.dot.on{outline:4px solid #ffd43b}.dot.x{outline:4px solid #fa5252}
.overlay{position:fixed;inset:0;background:rgba(40,20,90,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:24px;max-width:480px;width:100%;text-align:center}
.rate{font-size:54px;letter-spacing:6px;color:#f08c00}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
/* 게임 */
.stage{position:relative;background:linear-gradient(#bde0fe,#e7f5ff 70%,#b2f2bb 70%);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--line);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.stage .sh{position:absolute;left:10px;top:8px;font-size:24px;background:rgba(255,255,255,.8);border-radius:999px;padding:4px 14px}
.rules{flex:1;min-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:20px;box-shadow:inset 0 0 0 3px var(--line);padding:8px}
.rule{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:3px solid #ffd8a8;border-radius:16px;padding:6px;background:#fff9db}
.rule.sel{border-color:#f76707;border-style:dashed}
.ev{background:#f76707;color:#fff;border-radius:12px;padding:8px 10px;font-size:19px}
.ac{background:#4dabf7;color:#fff;border-radius:12px;padding:8px 10px;font-size:19px}
.rule .arrow{font-size:20px;color:#e8590c}.rule .x{font-size:15px;color:var(--sub);margin-left:auto}
.pal2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pal2 button{border-radius:14px;padding:9px 10px;font-size:18px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.pal2 .e{background:#f76707}.pal2 .a{background:#4dabf7}
/* 공장 */
.fac{background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.belt{display:flex;align-items:center;gap:6px;min-height:58px;flex-wrap:wrap}
.belt .lab{font-size:20px;width:86px;flex:none}
.box{width:52px;height:52px;border-radius:12px;background:#ffe8cc;border:3px solid #f08c00;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.box.o{background:#d3f9d8;border-color:#2f9e44}.box.bad{background:#ffe3e3;border-color:#e03131}.box.e{background:#f1f3f5;border:3px dashed #ced4da;color:#adb5bd}
.mid{display:flex;gap:14px;justify-content:center;align-items:center;font-size:20px}
.hand{display:flex;flex-direction:column;align-items:center}
.hand .box{width:66px;height:66px;font-size:30px}
.cmd{background:#4dabf7;color:#fff;border-radius:12px;padding:0 10px;height:52px;display:flex;align-items:center;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.15);flex:none}
.cmd.io{background:#40c057}.cmd.calc{background:#f59f00}.cmd.mem{background:#9775fa}.cmd.cond{background:#e8590c}
.plist{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pline{display:flex;align-items:center;gap:8px}.pline .no{width:26px;text-align:right;color:var(--sub);font-size:16px}
</style>

<script>
'use strict';
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
var KEY='kidsCoding.v1',D={best:{},voice:true,sfx:true,song:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)D[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
var GRADE='K';try{var HB=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');if(HB&&HB.profiles){var PF=HB.profiles.filter(function(x){return x.id===HB.cur;})[0]||HB.profiles[0];if(PF)GRADE=PF.grade||'K';}}catch(e){}
// ---------- 소리 ----------
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t,dur,type,vol,f2){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sfx(k){if(!D.sfx)return;var a=ac();if(!a)return;var t=a.currentTime;
  if(k==='add')tone(660,t,0.07,'square',0.035);else if(k==='del')tone(330,t,0.08,'square',0.03);
  else if(k==='no')tone(240,t,0.2,'triangle',0.1);else if(k==='ok'){tone(784,t,0.1,'sine',0.12);tone(1175,t+0.08,0.16,'sine',0.1);}
  else if(k==='ding')tone(1320,t,0.25,'sine',0.13);else if(k==='boom')tone(140,t,0.3,'square',0.09,60);
  else if(k==='jump')tone(420,t,0.15,'triangle',0.08,820);else if(k==='step')tone(520,t,0.05,'triangle',0.05);
  else if(k==='win')[523,659,784,1047,1319].forEach(function(f,i){tone(f,t+i*0.1,0.22,'square',0.04);tone(f,t+i*0.1,0.22,'sine',0.09);});}
function say(s){if(!D.voice||!window.speechSynthesis)return;try{kidsSpeak(s,0.95);}catch(e){}}

function stopAll(){if(G){G.stop=true;clearTimeout(G.timer);if(G.raf)cancelAnimationFrame(G.raf);}}
function winBox(key,s,title,next,again,list){try{kidsGate.add(1);}catch(e){}var prev=D.best[key]||0;if(s>prev)D.best[key]=s;save();sfx('win');conf();say(title);

  o.innerHTML='<div class="panel"><div style="font-size:66px" class="em">🏆</div><div style="font-size:30px;word-break:keep-all">'+title+'</div><div class="rate">'+stars(s)+'</div>'+(next?'<button class="btn green" id="nx">다음 미션 ▶</button>':'')+'<button class="btn ghost" id="ag">다시 하기</button><button class="btn ghost" id="ls">미션 목록</button></div>';

var MUS=[{t:'도레미',s:'CDE',max:3,tip:'도·레·미 블록을 차례로 놓아요'},{t:'작은 별',s:'CCGGAAG',max:7,tip:'반짝반짝 작은 별! 들어 보고 똑같이'},
 {t:'반복 배우기',s:'CDCDCDCD',max:3,tip:'도레가 4번! 🔁 반복 블록 하나에 도·레를 넣어요',rep:1},{t:'비행기',s:'EDCDEEE',max:6,tip:'떴다 떴다 비행기. 미미미는 반복으로!',rep:1},

 {t:'쉼표 넣기',s:'CRCRGRGR',max:6,tip:'도 (쉼) 도 (쉼)… 쉼표도 블록이에요',rep:1},{t:'나비야',s:'GEEFDDCDEFGGG',max:12,tip:'나비야 나비야~ 마지막 솔솔솔은 반복!',rep:1}];
function mFlat(p){var o=[];p.forEach(function(b,i){if(b.t==='rep'){for(var k=0;k<b.n;k++)b.b.forEach(function(x,j){o.push({n:x.t,id:i+'.'+j,rep:i});});}else o.push({n:b.t,id:''+i});});return o;}
function cnt(p){var n=0;p.forEach(function(b){n++;if(b.t==='rep')n+=b.b.length;});return n;}
function note(n,t,dur){var f=NOTES[n][1];if(!f)return;tone(f,t,dur,'triangle',0.16);tone(f*2,t,dur*0.6,'sine',0.03);}
SCR.mlist=function(){listScreen('🎵 음악 코딩',MUS,'m','App.mStart','자유롭게 작곡');};
function mStart(i){go('music',i);}
SCR.music=function(i){
  var M=i>=0?MUS[i]:null;G={kind:'music',i:i,M:M,prog:i<0?(D.song||[]):[],open:-1,fails:0,playing:false};
  mRender();if(M)setTimeout(function(){say(M.tip);},300);
};
function mTile(t,id){var N=NOTES[t];return '<button class="tile" data-id="'+id+'" style="background:'+N[2]+'" onclick="App.mDel(\''+id+'\')">'+N[0]+'</button>';}
function mRender(){
  var M=G.M,h='<div class="hud"><button class="pill" onclick="App.go(\'mlist\')">◀</button><span class="pill">🎵 '+(M?(G.i+1)+'. '+M.t:'자유 작곡')+'</span><span class="grow"></span>'+(M?'<span class="pill">★★★ 블록 '+M.max+'개 이하</span>':'')+'<span class="pill" id="bc"></span></div>';
  h+='<div class="split"><div class="l"><div class="desc" id="desc">'+(G.msg||(M?M.tip:'🎨 마음대로 노래를 만들어 ▶ 들어 봐요'))+'</div>';
  if(M){h+='<div class="desc"><div style="font-size:18px;color:var(--sub)">🎯 만들 노래</div><div class="dots" id="tdots">';
    M.s.split('').forEach(function(n,k){var N=NOTES[n],show=!M.hide||G.fails>=2;h+='<span class="dot'+(show?'':' q')+'" id="td'+k+'" style="'+(show?'background:'+N[2]:'')+'">'+(show?N[0].replace('높은도','도↑'):'?')+'</span>';});
    h+='</div><button class="btn ghost" style="margin-top:8px;font-size:22px;padding:8px" onclick="App.mTarget()">👂 만들 노래 들어 보기</button></div>';}
  h+='</div><div class="r"><div class="prog" id="prog" style="flex:1"></div><div class="pal" id="pal"></div><div class="ctl" id="ctl"></div></div></div>';
  app.innerHTML=h;mProg();}
function mProg(){
  var p=G.prog,h='';if(!p.length)h='<div class="ph">아래 음표를 누르면 여기에 쌓여요 👇</div>';
  p.forEach(function(b,i){if(b.t==='rep'){h+='<div class="rep'+(G.open===i?' open':'')+'" data-id="'+i+'"><button class="rn" onclick="App.mCyc('+i+')">🔁×'+b.n+'</button><button class="rx" onclick="App.mDel(\''+i+'\')">✖</button>';
      b.b.forEach(function(x,j){h+=mTile(x.t,i+'.'+j);});h+=(G.open===i?'<div class="slot">＋</div>':'<button class="slot" onclick="App.mOpen('+i+')">＋</button>')+'</div>';}
    else h+=mTile(b.t,''+i);});
  var pe=document.getElementById('prog');pe.innerHTML=h;pe.scrollTop=pe.scrollHeight;
  var ph='';'CDEFGABHR'.split('').forEach(function(n){var N=NOTES[n];ph+='<button class="pb" style="background:'+N[2]+'" onclick="App.mAdd(\''+n+'\')">'+N[0]+'</button>';});
  if(!G.M||G.M.rep||G.i<0)ph+='<button class="pb rp" onclick="App.mAdd(\'rep\')">🔁<small>반복</small></button>';
  if(G.open>=0)ph+='<button class="pb endr" onclick="App.mClose()">⤴<small>반복 끝</small></button>';
  document.getElementById('pal').innerHTML=ph;
  document.getElementById('ctl').innerHTML=G.playing?'<button onclick="App.mStop()">■ 멈추기</button>':'<button onclick="App.mBack()">⌫ 하나</button><button onclick="App.mClear()">🗑️ 모두</button><button class="go" onclick="App.mPlay()">▶ '+(G.M?'연주하고 확인':'연주')+'</button>';
  document.getElementById('bc').innerHTML='🧱 '+cnt(p)+'개';
  if(G.i<0){D.song=p;save();}}
var lastAdd=0;
function mAdd(t){var now=Date.now();if(now-lastAdd<180||G.playing)return;lastAdd=now;ac();
  if(t==='rep'){if(G.prog.length>=24)return;G.prog.push({t:'rep',n:2,b:[]});G.open=G.prog.length-1;sfx('add');msg('🔁 반복 안에 넣을 음표를 눌러요. <b>×2</b>를 누르면 횟수가 바뀌어요');mProg();return;}
  if(G.open>=0&&G.prog[G.open]){if(G.prog[G.open].b.length>=8)return;G.prog[G.open].b.push({t:t});}else{if(G.prog.length>=30)return;G.prog.push({t:t});}
  note(t,ac()?actx.currentTime:0,0.3);mProg();}
function mDel(id){if(G.playing)return;var a=String(id).split('.'),i=+a[0];if(a.length>1)G.prog[i].b.splice(+a[1],1);else{G.prog.splice(i,1);if(G.open===i)G.open=-1;else if(G.open>i)G.open--;}sfx('del');mProg();}
function mPlay(){if(G.playing)return;ac();var seq=mFlat(G.prog);if(!seq.length){sfx('no');msg('음표를 먼저 쌓아요 👇');return;}
  G.playing=true;G.open=-1;mProg();var k=0;
  function nx(){if(!G||G.kind!=='music'||!G.playing)return;Array.prototype.forEach.call(document.querySelectorAll('.run'),function(e){e.classList.remove('run');});
    if(k>=seq.length){G.playing=false;mProg();mCheck(seq);return;}
    var s=seq[k];var el=document.querySelector('[data-id="'+s.id+'"]');if(el)el.classList.add('run');if(s.rep!=null){var r=document.querySelector('.rep[data-id="'+s.rep+'"]');if(r)r.classList.add('run');}
    var td=document.getElementById('td'+k);if(td)td.classList.add('on');
    note(s.n,actx?actx.currentTime:0,0.34);k++;G.timer=setTimeout(nx,380);}
  Array.prototype.forEach.call(document.querySelectorAll('.dot'),function(e){e.classList.remove('on');e.classList.remove('x');});nx();}
function mCheck(seq){var M=G.M;if(!M)return;var got=seq.map(function(s){return s.n;}).join(''),bad=-1;
  for(var i=0;i<Math.max(got.length,M.s.length);i++)if(got.charAt(i)!==M.s.charAt(i)){bad=i;break;}
  Array.prototype.forEach.call(document.querySelectorAll('.dot'),function(e){e.classList.remove('on');});
  if(bad<0){var n=cnt(G.prog),s=n<=M.max?3:(n<=M.max+3?2:1),i2=G.i;
    if(s<3)msg('<span class="good">노래는 똑같아요! 🎉</span><span class="hint">블록을 '+M.max+'개 이하로 줄이면 ★★★ (🔁 반복을 써 봐요)</span>');
    winBox('m'+G.i,s,s===3?'노래 완성! 최고예요!':'노래 완성!',i2+1<MUS.length?function(){go('music',i2+1);}:null,function(){go('music',i2);},function(){go('mlist');});return;}
  G.fails++;sfx('no');var td=document.getElementById('td'+bad);if(td)td.classList.add('x');
  var why=bad>=got.length?'노래가 조금 짧아요. '+(bad+1)+'번째 음부터 더 넣어요':bad>=M.s.length?'노래가 길어요. '+(M.s.length)+'개 음까지만!':(bad+1)+'번째 음이 달라요';
  msg('<span class="bad">'+why+'</span><span class="hint">'+(G.fails>=2?'💡 빨간 테두리 음을 잘 들어 봐요':'👂 만들 노래를 다시 들어 봐요')+'</span>');
  if(G.fails===2&&M.hide)mRender();}
function mTarget(){if(G.playing)return;ac();var s=G.M.s.split(''),k=0;G.playing=true;mProg();
  function nx(){if(!G||!G.playing)return;Array.prototype.forEach.call(document.querySelectorAll('.dot'),function(e){e.classList.remove('on');});if(k>=s.length){G.playing=false;mProg();return;}var td=document.getElementById('td'+k);if(td)td.classList.add('on');note(s[k],actx.currentTime,0.34);k++;G.timer=setTimeout(nx,380);}nx();}

    if(!r.a.length)h+='<span style="color:#adb5bd;font-size:17px">파란 블록(무엇을)을 눌러요</span>';

  document.getElementById('rules').innerHTML=h;
  var M=G.M,ev=M?M.ev:Object.keys(EVS),acs=M?M.ac:Object.keys(ACS),p='';
  ev.forEach(function(e){p+='<button class="e" onclick="App.gAddE(\''+e+'\')">'+EVS[e]+'</button>';});
