<script>(function(){var K='kidsGate.v1';function p2(n){return (n<10?'0':'')+n;}function day(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}function prof(){try{var H=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0]||null;}catch(e){return null;}}function grade(){var p=prof();return (p&&p.grade)||'K';}var FB='';try{FB=localStorage.getItem('kidsFB')||FB;}catch(e){}function get(){var g={on:true,goal:15,day:'',cnt:0,free:'',pin:'',done:0,kinds:{},lock:'',until:0};try{var o=JSON.parse(localStorage.getItem(K)||'{}');for(var k in o)g[k]=o[k];}catch(e){}if(g.goal>60&&!g.v2)g.goal=15;g.v2=1;if(!g.kinds)g.kinds={};if(g.day!==day()){g.day=day();g.cnt=0;g.done=0;}return g;}function sv(g){try{localStorage.setItem(K,JSON.stringify(g));}catch(e){}}function put(g){sv(g);sched();}function lockOn(g){g=g||get();return g.lock&&(!g.until||Date.now()<g.until)?g.lock:'';}function defStudy(n){return grade()==='K'?(n==='math'||n==='hangul'||n==='english'):(n==='math'||n==='english');}function page(){var m=String(location.pathname).match(/([A-Za-z0-9_-]+)\.html$/);return m?m[1]:'index';}function kind(n,g){n=n||page();if(n==='index')return 'hub';g=g||get();var k=g.kinds[n];if(k==='study'||k==='play')return k;return defStudy(n)?'study':'play';}function study(g){g=g||get();return GAMES.filter(function(x){return kind(x[0],g)==='study';}).map(function(x){return x[0];});}function open(g){g=g||get();if(lockOn(g))return false;return !g.on||g.free===day()||g.cnt>=g.goal||!study(g).length;}var GAMES=[['math','수학'],['hangul','한글'],['english','영어'],['robot','로봇 코딩'],['coding','코딩 공방'],['compose','작곡'],['paint','그림 그리기'],['restaurant','레스토랑'],['sudoku','스도쿠'],['clock','시계'],['puzzle','퍼즐'],['maze','미로'],['hidden','숨은그림'],['memory','짝 맞추기'],['hospital','동물 병원'],['coloring','색칠'],['piano','건반']];function add(n){try{n=n||1;if(kind()!=='study')return;var g=get(),was=open(g);g.cnt+=n;var no   var P=prof();req('PUT',url(g,'st'),{name:P?P.name:'',grade:grade(),cnt:g.cnt,goal:g.goal,day:g.day,page:page(),at:Date.now(),ct:g.ct||0,study:study(g),open:open(g),lock:lockOn(g)});}

<style>
:root{--bg:#fff9db;--ink:#4a3410;--sub:#9a7b3f;--main:#f08c00;--main-d:#d9480f;--line:#ffe066}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}

h3{font-weight:normal;font-size:24px;margin:16px 0 6px}

.cust{display:flex;gap:10px;min-height:118px}

@media (orientation:portrait){.kit{flex-direction:column}.card{width:auto;flex:none;max-height:170px;flex-direction:row;flex-wrap:wrap;align-content:flex-start}.card .tt{width:100%;font-size:22px}.card .tt .em{display:inline;font-size:30px}.stp{font-size:16px;padding:3px 6px}.station{min-height:300px}}

.panel{background:#fff;border-radius:28px;padding:24px;max-width:480px;width:100%;text-align:center}

</style>

    var cc2=c;c.resume=true;cc2.on=false;App._resume=true;return;}
  msg('<span class="good">딱 좋아요! 😋</span>');var stn2=document.getElementById('st');stn2.querySelector('svg').outerHTML=tool(st.c,false);stepDone();}
function serve(){if(G.lock)return;G.lock=true;var r=G.r;D.cooked[r.id]=(D.cooked[r.id]||0)+1;D.served++;save();try{kidsGate.add(1);}catch(e){}
  var stn=document.getElementById('st');stn.innerHTML=tool('plate')+'<div class="big em" style="font-size:150px">'+r.e+'</div>';sfx('bell');conf([r.e,'⭐','✨']);
  if(G.shop){shopServe();return;}
  say(r.n+' 완성! 맛있겠다!');var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><div class="em" style="font-size:90px">'+r.e+'</div><div style="font-size:30px">'+r.n+' 완성!</div><div class="rate">'+stars(G.fails===0?3:G.fails===1?2:1)+'</div><button class="btn green" id="ag">또 만들기</button><button class="btn ghost" id="bk">레시피 책</button></div>';
  setTimeout(function(){document.body.appendChild(o);},700);var ri=G.ri;o.querySelector('#ag').onclick=function(){o.remove();go('cook',ri);};o.querySelector('#bk').onclick=function(){o.remove();go('book');};}
// ----- 레스토랑 영업 -----
var FACES=['🧒','👦','👧','👨','👩','👴','👵','🐻','🐰','🐱','🐶','🐼','🦊','🐸'];
function dayStart(){var d=D.day,nr=Math.min(RC.length,3+d),n=Math.min(7,3+Math.floor(d/2)),pat=GRADE==='K'?0:Math.max(70,140-d*8);
  G={shop:true,dayN:d,menu:RC.slice(0,nr).map(function(r,i){return i;}),left:n,total:n,served:0,lost:0,queue:[],sel:-1,pat:pat,r:null};
  app.className='';var h='<div class="hud"><button class="pill" onclick="App.quit()">◀</button><span class="pill">🍽️ '+d+'일째 영업</span><span class="pill">💰 '+D.coins+'</span><span class="grow"></span><span class="pill" id="lft"></span></div><div class="cust" id="cust"></div><div class="say" id="say">🔔 손님이 오면 눌러서 주문을 받아요!</div><div class="station" id="st">'+tool('plate')+'<div class="big em">🍳</div></div>';
  app.innerHTML=h;say(d+'일째 영업 시작! 손님이 오면 눌러서 주문을 받아요');
  addCust();G.civ=setInterval(tickShop,1000);}
function addCust(){if(G.left<=0||G.queue.length>=3)return;G.left--;var used=G.queue.map(function(c){return c.f;}),f;do{f=FACES[R(0,FACES.length-1)];}while(used.indexOf(f)>=0);
  G.queue.push({f:f,ri:G.menu[R(0,G.menu.length-1)],p:G.pat,max:G.pat,id:Date.now()+R(0,999)});sfx('bell');rCust();}
function tickShop(){if(!G||!G.shop)return;G.tick=(G.tick||0)+1;
  if(G.pat)G.queue.forEach(function(c){if(c.cooking)return;c.p--;});
  var gone=G.queue.filter(function(c){return G.pat&&c.p<=0&&!c.cooking;});gone.forEach(function(c){G.lost++;G.queue.splice(G.queue.indexOf(c),1);msg('😢 '+c.f+' 손님이 기다리다 갔어요. 괜찮아요, 다음 손님!');});
  if(G.queue.length<3&&G.left>0&&(G.tick%6===0||!G.queue.length))addCust();
  rCust();if(!G.left&&!G.queue.length&&!G.r)dayEnd();}
function rCust(){var e=document.getElementById('cust');if(!e)return;var h='';
  G.queue.forEach(function(c,i){var r=RC[c.ri];h+='<button class="cu'+(c.cooking?' sel':'')+'" onclick="App.take('+i+')"><span class="face em">'+c.f+'</span><div class="bub"><span class="em">'+r.e+'</span>'+r.n+(c.cooking?'<br>요리 중…':'')+(G.pat?'<div class="pt"><div style="width:'+Math.max(0,c.p/c.max*100)+'%;background:'+(c.p/c.max<0.3?'#fa5252':'#40c057')+'"></div></div>':'')+'</div></button>';});
  for(var k=G.queue.length;k<3;k++)h+='<div class="cu empty">빈 자리</div>';e.innerHTML=h;var l=document.getElementById('lft');if(l)l.textContent='남은 손님 '+(G.left+G.queue.length);}
function take(i){if(G.r)return;var c=G.queue[i];if(!c)return;ac();c.cooking=true;G.cookFor=c;say(c.f==='🐻'||c.f==='🐰'?'주문 받았어요!':RC[c.ri].n+' 주세요!');startCook(c.ri,c);}
function shopServe(){var c=G.cookFor,r=G.r,tip=G.pat&&c.p>c.max*0.5?5:0,coin=10+tip;D.coins+=coin;save();G.served++;sfx('coin');
  G.queue.splice(G.queue.indexOf(c),1);msg('😋 '+c.f+' 손님: “맛있어요!” 💰 +'+coin+(tip?' (빨리 줘서 팁!)':''));say('맛있어요! 고마워요!');
  setTimeout(function(){if(!G||!G.shop)return;G.r=null;G.cookFor=null;var st=document.getElementById('st');app.innerHTML='';var d=G;
    var h='<div class="hud"><button class="pill" onclick="App.quit()">◀</button><span class="pill">🍽️ '+d.dayN+'일째 영업</span><span class="pill">💰 '+D.coins+'</span><span class="grow"></span><span class="pill" id="lft"></span></div><div class="cust" id="cust"></div><div class="say" id="say">😋 맛있대요! 다음 손님을 눌러요</div><div class="station" id="st">'+tool('plate')+'<div class="big em">'+r.e+'</div></div>';
    app.innerHTML=h;rCust();if(!G.left&&!G.queue.length)dayEnd();},1600);}
function dayEnd(){if(G.ended)return;G.ended=true;clearInterval(G.civ);var s=G.lost===0?3:G.lost<=1?2:1,d=G.dayN;if(!D.best[d]||s>D.best[d])D.best[d]=s;D.day=d+1;save();sfx('win');conf(['💰','⭐','🎉']);say('오늘 영업 끝! 정말 잘했어요');
  var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><div class="em" style="font-size:70px">🍽️✨</div><div style="font-size:30px">'+d+'일째 영업 끝!</div><div class="rate">'+stars(s)+'</div><div style="font-size:20px;color:var(--sub)">손님 '+G.served+'명이 맛있게 먹었어요'+(G.lost?' · 기다리다 간 손님 '+G.lost+'명':'')+'<br>💰 모은 동전 '+D.coins+' · '+rank()+'</div>'+(d+1<=RC.length-2?'<div style="margin-top:8px;font-size:19px">✨ 내일은 메뉴가 늘어나요!</div>':'')+'<button class="btn green" id="nx">'+(d+1)+'일째 영업 ▶</button><button class="btn ghost" id="hm">처음으로</button></div>';
  setTimeout(function(){document.body.appendChild(o);},600);o.querySelector('#nx').onclick=function(){o.remove();stopT();dayStart();};o.querySelector('#hm').onclick=function(){o.remove();go('home');};}
window.App={go:go,tog:function(k){D[k]=!D[k];save();go('home');},cook:function(i){go('cook',i);},pick:pick,chop:chop,serve:serve,
  fire:function(){var c=G.cook;if(c&&!c.on&&App._resume&&c.p>0){App._resume=false;var st=cur();c.on=true;document.getElementById('cacts').innerHTML='<button class="act red" onclick="App.fire()">🧯 불 끄기</button>';
      c.iv=setInterval(function(){c.p+=0.1/st.sec;if(Math.random()<0.5)sfx('sizzle');var hf=document.getElementById('hf'),hl=document.getElementById('hl');if(!hf){clearInterval(c.iv);return;}hf.style.width=Math.min(100,c.p/1.4*100)+'%';hl.textContent=c.p<c.z[0]?'아직이에요…':c.p<=c.z[1]?'지금이에요! 불 끄기!':'앗, 타요!';if(c.p>=c.burn){clearInterval(c.iv);c.on=false;G.fails++;sfx('no');msg('<span class="bad">앗, 조금 탔어요! 괜찮아요, 다시 해요</span>');setTimeout(function(){if(G&&G.r&&cur()===st)rStep();},1300);}},100);return;}
    fire();},
  day:function(){go('shop');},take:take,
  quit:function(){if(G&&G.shop&&G.r){stopT();G.civ=setInterval(tickShop,1000);var c=G.cookFor;if(c)c.cooking=false;G.r=null;G.cookFor=null;var h='<div class="hud"><button class="pill" onclick="App.quit()">◀</button><span class="pill">🍽️ '+G.dayN+'일째 영업</span><span class="pill">💰 '+D.coins+'</span><span class="grow"></span><span class="pill" id="lft"></span></div><div class="cust" id="cust"></div><div class="say" id="say">다른 손님 주문을 받아도 돼요</div><div class="station" id="st">'+tool('plate')+'</div>';app.innerHTML=h;rCust();return;}
    var wasShop=G&&G.shop;stopT();G=null;go(wasShop?'home':'book');}};
SCR.shop=function(){dayStart();};
window.__T={G:function(){return G;},RC:RC,D:D,cur:function(){return G&&G.r?cur():null;},tick:function(){tickShop();}};
go('home');
</script>
