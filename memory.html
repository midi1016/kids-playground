<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff6b9a">
<title>짝 맞추기</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f5;--ink:#45303a;--sub:#937c86;--main:#ff6b9a;--main-d:#d94a78;--line:#f6d9e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;padding:14px;overflow-y:auto}
h1{font-weight:normal;font-size:44px;text-align:center;margin:10px 0 2px}
h2{font-weight:normal;font-size:26px;text-align:center;margin:18px 0 10px}
.sub{text-align:center;color:var(--sub);font-size:19px}
.row{display:grid;gap:12px}
.r4{grid-template-columns:repeat(4,1fr)}.r2{grid-template-columns:repeat(2,1fr)}
@media (max-width:600px){.r4{grid-template-columns:repeat(2,1fr)}}
.opt{background:#fff;border-radius:22px;padding:14px 6px;font-size:24px;box-shadow:0 5px 0 var(--line);border:4px solid transparent;text-align:center}
.opt .em{display:block;font-size:46px;line-height:1.2}
.opt small{display:block;font-size:16px;color:var(--sub);margin-top:2px}
.opt small.st{color:#f0a500;font-size:18px}
.opt.sel{border-color:var(--main);background:#fff7fa}
.opt:active,.btn:active{transform:translateY(3px);box-shadow:none}
.btn{display:block;width:100%;font-size:30px;padding:18px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:16px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.game{display:flex;flex-direction:column;height:100%;gap:10px}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:21px;white-space:nowrap}
.pill.turn{background:var(--main);color:#fff}
.grow{flex:1}
.board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;gap:10px}
.card{perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.back{background:linear-gradient(135deg,#ff8fb4,#ff6b9a);color:#fff;font-size:32px}
.back::after{content:'?';opacity:.85}
.front{background:#fff;transform:rotateY(180deg);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card.done .front{background:#eafaf0;box-shadow:0 0 0 4px #2ecc71 inset}
.card.done{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
.msg{text-align:center;font-size:26px;min-height:34px}
.overlay{position:fixed;inset:0;background:rgba(60,30,45,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:24px;max-width:480px;width:100%;text-align:center}
.big{font-size:84px;line-height:1.1}
.rate{font-size:54px;letter-spacing:6px;color:#f0a500}
.res{font-size:22px;line-height:1.7}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
var THEMES={
  animal:{name:'동물',icon:'🐶',set:'🐶 🐱 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐢 🐙 🦄 🐳 🦒'.split(' ')},
  fruit:{name:'과일·간식',icon:'🍓',set:'🍎 🍌 🍇 🍓 🍉 🍒 🍑 🍍 🥝 🍋 🥕 🌽 🍩 🍪 🧁 🍦 🍭 🍕 🍔 🍟'.split(' ')},
  car:{name:'탈것',icon:'🚗',set:'🚗 🚕 🚌 🚒 🚑 🚓 🚜 🚲 🛵 🚂 🚁 ✈️ 🚀 ⛵ 🚢 🚚 🏎️ 🛴 🚤 🛸'.split(' ')},
  dino:{name:'공룡·바다',icon:'🦖',set:'🦖 🦕 🐊 🐉 🦎 🐍 🦈 🐬 🐋 🐠 🐡 🦀 🦞 🦑 🐚 🌋 🥚 🌴 🦴 ⭐'.split(' ')}
};
var LEVELS=[
  {key:'easy',name:'쉬움',em:'🌱',pairs:3,cols:3,peek:2500},
  {key:'normal',name:'보통',em:'🌼',pairs:6,cols:4,peek:2000},
  {key:'hard',name:'어려움',em:'🔥',pairs:8,cols:4,peek:0},
  {key:'master',name:'도전',em:'👑',pairs:12,cols:6,peek:0}
];
var KEY='kidsMemory.v1';
var D={theme:'animal',level:'easy',players:1,best:{},music:true,sfx:true};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)D[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
function lv(){for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].key===D.level)return LEVELS[i];return LEVELS[0];}
function stars(n){var s='';for(var i=0;i<3;i++)s+=i<n?'★':'☆';return s;}

// ---------- 소리 ----------
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t,dur,type,vol){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sfx(k){if(!D.sfx)return;var a=ac();if(!a)return;var t=a.currentTime;
  if(k==='flip')tone(520,t,0.07,'triangle',0.1);
  else if(k==='ok'){tone(784,t,0.12,'sine',0.16);tone(1175,t+0.09,0.18,'sine',0.14);}
  else if(k==='no')tone(260,t,0.16,'triangle',0.1);
  else if(k==='win')[659,784,988,1319].forEach(function(f,i){tone(f,t+i*0.12,0.2,'sine',0.15);});}
function hz(m){return 440*Math.pow(2,(m-69)/12);}
var SONG={beat:0.3,mel:[72,76,79,76,74,77,81,77,76,79,84,79,77,74,72,0],bass:[48,50,52,53]};
var music={timer:null,next:0,step:0};
function musicStart(){musicStop();if(!D.music)return;var a=ac();if(!a)return;music.step=0;music.next=a.currentTime+0.15;
  music.timer=setInterval(function(){while(music.next<a.currentTime+0.3){var n=SONG.mel[music.step%SONG.mel.length];if(n)tone(hz(n),music.next,SONG.beat*0.8,'triangle',0.035);
    if(music.step%4===0)tone(hz(SONG.bass[Math.floor(music.step/4)%SONG.bass.length]),music.next,SONG.beat*3.8,'sine',0.05);music.next+=SONG.beat;music.step++;}},70);}
function musicStop(){if(music.timer){clearInterval(music.timer);music.timer=null;}}
document.addEventListener('visibilitychange',function(){if(document.hidden)musicStop();else if(screen==='game'&&G&&!G.done)musicStart();});

// ---------- 화면 ----------
var app=document.getElementById('app'),screen='home',G=null;
function go(s){screen=s;if(s!=='game')musicStop();var hb=document.getElementById('hubbtn');if(hb)hb.style.display=s==='game'?'none':'';({home:rHome,game:rGame})[s]();}
function rHome(){
  var h='<h1>🃏 짝 맞추기</h1><div class="sub">같은 그림 두 장을 찾아요!</div><h2>어떤 그림으로 할까요?</h2><div class="row r4">';
  for(var k in THEMES){var t=THEMES[k];h+='<button class="opt'+(D.theme===k?' sel':'')+'" onclick="App.set(\'theme\',\''+k+'\')"><span class="em">'+t.icon+'</span>'+t.name+'</button>';}
  h+='</div><h2>난이도</h2><div class="row r4">';
  LEVELS.forEach(function(L){var b=D.best[L.key];h+='<button class="opt'+(D.level===L.key?' sel':'')+'" onclick="App.set(\'level\',\''+L.key+'\')"><span class="em">'+L.em+'</span>'+L.name+'<small>'+L.pairs+'쌍 ('+(L.pairs*2)+'장)</small><small class="st">'+(b?stars(b.s):'')+'</small></button>';});
  h+='</div><h2>누구랑 할까요?</h2><div class="row r2"><button class="opt'+(D.players===1?' sel':'')+'" onclick="App.set(\'players\',1)"><span class="em">🙋</span>혼자 하기</button><button class="opt'+(D.players===2?' sel':'')+'" onclick="App.set(\'players\',2)"><span class="em">👫</span>둘이서 하기<small>번갈아 뒤집어요</small></button></div>';
  h+='<button class="btn" onclick="App.start()">시작! ▶</button>';
  app.innerHTML=h;
}
function start(){
  var L=lv(),set=shuffle(THEMES[D.theme].set).slice(0,L.pairs),cards=shuffle(set.concat(set)).map(function(e,i){return {e:e,id:i,up:false,done:false};});
  G={L:L,cards:cards,open:[],moves:0,found:0,busy:false,done:false,turn:0,score:[0,0],t0:0};go('game');
  if(L.peek){G.busy=true;G.cards.forEach(function(c){c.up=true;});draw();msg('잘 보고 기억해요! 👀');setTimeout(function(){G.cards.forEach(function(c){c.up=false;});G.busy=false;draw();msg(turnMsg());},L.peek);}
}
function turnMsg(){return D.players===2?(G.turn===0?'🔵 1번 친구 차례':'🟠 2번 친구 차례'):'카드를 두 장 뒤집어요';}
function rGame(){
  var h='<div class="game"><div class="hud"><button class="pill" onclick="App.go(\'home\')">◀</button><span class="pill">'+THEMES[D.theme].icon+' '+G.L.name+'</span><span class="grow"></span>';
  if(D.players===2)h+='<span class="pill" id="p0">🔵 0</span><span class="pill" id="p1">🟠 0</span>';else h+='<span class="pill" id="mv">뒤집기 0번</span>';
  h+='<span class="pill" id="pr">찾은 짝 0 / '+G.L.pairs+'</span><button class="pill" id="mu" onclick="App.mu()"></button><button class="pill" id="sf" onclick="App.sf()"></button></div><div class="msg" id="msg">'+turnMsg()+'</div><div class="board" id="board"><div class="grid" id="grid"></div></div></div>';
  app.innerHTML=h;layout();draw();musicStart();
}
function layout(){
  var b=document.getElementById('board'),bw=b.clientWidth,bh=b.clientHeight,n=G.cards.length,land=bw>bh;
  var cols=G.L.cols,rows=Math.ceil(n/cols);if(!land&&cols>rows){var t=cols;cols=rows;rows=t;if(cols*rows<n)rows++;}
  var gap=10,cw=Math.floor(Math.min((bw-gap*(cols-1))/cols,((bh-gap*(rows-1))/rows)/1.2)),ch=Math.floor(cw*1.2);
  var g=document.getElementById('grid');g.style.gridTemplateColumns='repeat('+cols+','+cw+'px)';g.style.gridAutoRows=ch+'px';G.fs=Math.floor(cw*0.62);
}
function draw(){
  var g=document.getElementById('grid');if(!g)return;
  g.innerHTML=G.cards.map(function(c,i){return '<div class="card'+(c.up?' up':'')+(c.done?' done':'')+'" onclick="App.flip('+i+')"><div class="inner"><div class="face back"></div><div class="face front" style="font-size:'+G.fs+'px">'+c.e+'</div></div></div>';}).join('');
  var mv=document.getElementById('mv');if(mv)mv.textContent='뒤집기 '+G.moves+'번';
  var pr=document.getElementById('pr');if(pr)pr.textContent='찾은 짝 '+G.found+' / '+G.L.pairs;
  var p0=document.getElementById('p0'),p1=document.getElementById('p1');if(p0){p0.textContent='🔵 '+G.score[0];p1.textContent='🟠 '+G.score[1];p0.className='pill'+(G.turn===0?' turn':'');p1.className='pill'+(G.turn===1?' turn':'');}
  var mu=document.getElementById('mu'),sf=document.getElementById('sf');if(mu){mu.textContent=D.music?'🎵':'🔇';sf.textContent=D.sfx?'🔊':'🔈';}
}
function msg(t){var m=document.getElementById('msg');if(m)m.textContent=t;}
function flip(i){
  if(!G||G.busy||G.done)return;var c=G.cards[i];if(c.up||c.done)return;
  if(!G.t0)G.t0=Date.now();c.up=true;G.open.push(c);sfx('flip');draw();
  if(G.open.length<2)return;
  G.moves++;var a=G.open[0],b=G.open[1];G.busy=true;
  if(a.e===b.e){setTimeout(function(){a.done=b.done=true;a.up=b.up=false;G.open=[];G.found++;G.score[G.turn]++;G.busy=false;sfx('ok');
      msg(D.players===2?(G.turn===0?'🔵':'🟠')+' 찾았다! 한 번 더!':['찾았다! 🎉','잘했어요! 👏','기억력 최고! 🧠'][R(0,2)]);draw();if(G.found===G.L.pairs)win();},350);}
  else{setTimeout(function(){sfx('no');},300);setTimeout(function(){a.up=b.up=false;G.open=[];G.busy=false;if(D.players===2)G.turn=1-G.turn;msg(D.players===2?turnMsg():'아쉬워요! 어디 있었는지 기억해요 🤔');draw();},1000);}
}
function win(){
  G.done=true;musicStop();setTimeout(function(){sfx('win');},200);confetti();
  var P=G.L.pairs,s=G.moves<=Math.ceil(P*1.5)?3:(G.moves<=Math.ceil(P*2.2)?2:1),sec=Math.round((Date.now()-G.t0)/1000),rec=false;
  if(D.players===1){var b=D.best[G.L.key];if(!b||s>b.s||(s===b.s&&G.moves<b.m)){D.best[G.L.key]={s:Math.max(s,b?b.s:0),m:b?Math.min(b.m,G.moves):G.moves};rec=!b||G.moves<b.m;}save();}
  var title,body;
  if(D.players===2){var w=G.score[0]===G.score[1]?'비겼어요! 둘 다 최고! 🤝':(G.score[0]>G.score[1]?'🔵 1번 친구 승리! 🏆':'🟠 2번 친구 승리! 🏆');title=w;body='<div class="res">🔵 '+G.score[0]+'쌍 · 🟠 '+G.score[1]+'쌍</div>';}
  else{title='모두 찾았어요! 🎉';body='<div class="rate">'+stars(s)+'</div><div class="res">뒤집기 '+G.moves+'번 · '+Math.floor(sec/60)+'분 '+(sec%60)+'초</div>'+(rec?'<div class="res" style="color:#e67e22">🏅 최고 기록!</div>':'')+(s<3?'<div class="res" style="font-size:18px;color:#937c86">'+Math.ceil(P*1.5)+'번 안에 다 찾으면 ★★★</div>':'');}
  setTimeout(function(){var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><div class="big">🃏</div><div style="font-size:32px">'+title+'</div>'+body+'<button class="btn" id="ag">한 번 더</button><button class="btn ghost" id="hm">처음으로</button></div>';
    document.body.appendChild(o);o.querySelector('#ag').onclick=function(){o.remove();start();};o.querySelector('#hm').onclick=function(){o.remove();go('home');};},700);
}
function confetti(){var em=['🎉','⭐','🎊','✨','🃏'];for(var i=0;i<24;i++){var s=document.createElement('div');s.className='conf';s.textContent=em[i%em.length];s.style.left=R(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},4000);})(s);}}
window.addEventListener('resize',function(){if(screen==='game'&&G)setTimeout(function(){layout();draw();},150);});
window.App={go:go,start:start,flip:flip,set:function(k,v){D[k]=v;save();rHome();},
  mu:function(){D.music=!D.music;save();draw();if(D.music)musicStart();else musicStop();},sf:function(){D.sfx=!D.sfx;save();draw();}};
go('home');
</script>
<a href="index.html" style="position:fixed;left:10px;bottom:10px;z-index:5;background:#fff;border-radius:999px;padding:8px 16px;font-size:18px;color:#3b2f2a;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.1);font-family:inherit" id="hubbtn">🎈 놀이터</a>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}</script>
