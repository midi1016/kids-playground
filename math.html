<script>
'use strict';
/*GEN-START*/
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[R(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// 받침 판별 (한글 단어 또는 숫자)
function hasB(w){
  if(typeof w==='number'){var n=Math.abs(w);if(n===0)return true;var d=n%10;if(d===0)return true;return [1,3,6,7,8].indexOf(d)>=0;}
  w=String(w);var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;
}
var JOSA={'은는':['은','는'],'이가':['이','가'],'을를':['을','를'],'과와':['과','와'],'아야':['아','야'],'이에요':['이에요','예요']};
function J(w,p){return w+(hasB(w)?JOSA[p][0]:JOSA[p][1]);}
var BOX='<span class="box">□</span>';
function eq(s,cls){return '<div class="eq'+(cls?' '+cls:'')+'">'+s+'</div>';}
function P(s){return '<div class="prompt">'+s+'</div>';}
var M='−';
// 문자열 s의 '#'를 빈칸으로 바꾼 문제
function boxEq(s,ans,hint,extraTop){
  return {mode:'num',html:(extraTop||'')+eq(s.replace('#',BOX)),plain:s.replace('#','□'),answer:String(ans),hint:hint,explain:s.replace('#',ans)};
}

var GR={min:2,max:5,mul:true,div:true};
var ITEM_EM={'사탕':'🍬','구슬':'🔮','딸기':'🍓','쿠키':'🍪','젤리':'🍭','도토리':'🌰','귤':'🍊','풍선':'🎈'};
function tenFrame(a){var h='<div class="tenf">';for(var i=0;i<10;i++)h+='<span class="'+(i<a?'on':'')+'"></span>';return h+'</div>';}
function row(em,n){var s='';for(var i=0;i<n;i++)s+=em;return s;}
function addPair(lv){var a,b,i=0;
  if(lv<=0)return [R(1,5),R(1,4)];
  if(lv<=1)return [R(2,9),R(2,9)];
  if(lv===2){do{a=R(11,78);b=R(11,99-a);}while(a%10+b%10>=10&&++i<60);return [a,b];}
  if(lv===3){do{a=R(15,79);b=R(12,99-a);}while(a%10+b%10<10&&++i<60);return [a,b];}
  if(lv===4)return [R(100,599),R(20,399)];
  do{a=R(150,799);b=R(150,999-a);}while(a%10+b%10<10&&++i<60);return [a,b];
}
function mulPair(lv){
  if(lv<=1)return [pick([2,5]),R(2,5)];
  if(lv===2)return [R(2,5),R(2,9)];
  if(lv===3)return [R(2,9),R(2,9)];
  if(lv===4)return Math.random()<0.3?[R(11,19),R(2,4)]:[R(3,9),R(3,9)];
  return Math.random()<0.5?[R(11,25),R(2,6)]:[R(6,9),R(6,9)];
}

var G={};
// 1. 수 감각
G.sense=function(lv){
  if(lv<=0){var t0=pick(['split','make10','make10']);
    if(t0==='split'){var n0=R(3,9),a0=R(1,n0-1);var o0=boxEq(n0+' = '+a0+' + #',n0-a0,a0+'에서 '+n0+'까지 손가락으로 세어 봐요',P('가르기! 빈칸에 들어갈 수는?')+chunks('🍎',n0));o0.speak=n0+'는 '+a0+'하고 몇일까요?';return o0;}
    var a1=R(1,9),o1=boxEq(a1+' + # = 10',10-a1,'빈 동그라미를 세어 봐요',P('10을 만들어요!')+tenFrame(a1));o1.speak=a1+'에 몇을 더하면 10이 될까요? 빈 동그라미를 세어 봐요.';return o1;}
  var t=pick(lv<=1?['split','make']:['split','make','odd']);
  if(t==='split'){
    var n,part;
    if(lv<=1){n=R(11,19);part=10;}
    else if(lv<=3){n=lv===2?R(21,59):R(31,99);part=R(1,Math.floor(n/10))*10;if(part>=n)part-=10;}
    else{n=R(110,999);part=Math.random()<0.5?R(1,Math.floor(n/100))*100:R(1,Math.floor(n/10))*10;if(part>=n)part=100;}
    var s=Math.random()<0.5?(n+' = '+part+' + #'):(n+' = # + '+part);
    var o=boxEq(s,n-part,part+'에서 '+n+'까지 얼마나 더 가야 할까요?',P('수를 둘로 갈라 봐요!'));
    return o;
  }
  if(t==='make'){
    var T,a;
    if(lv<=1){T=10;a=R(1,9);}else if(lv===2){T=100;a=R(1,9)*10;}else if(lv===3){T=100;a=R(11,89);}
    else if(lv===4){T=1000;a=R(1,9)*100;}else{T=1000;a=R(11,99)*10;}
    var h=lv===3||lv===5?'먼저 십의 자리를 채우고, 나머지를 채워 봐요':a+'에서 '+J(T,'이가')+' 되려면 얼마가 더 필요할까요?';
    return boxEq(a+' + # = '+T,T-a,h,P(J(T,'을를')+' 만들어요!'));
  }
  // odd one out
  var T2=lv===2?R(12,30):lv===3?R(20,60):lv===4?R(40,99):R(100,300);
  function ex(V){
    var k=pick(GR.mul?['add','sub','mul','dbl']:['add','sub','dbl']);
    if(k==='mul'){var fs=[];for(var f=2;f<=12;f++){if(V%f===0&&V/f>=2&&V/f<=12)fs.push(f);}if(fs.length){var f2=pick(fs);return f2+' × '+(V/f2);}k='add';}
    if(k==='dbl'&&V%2===0)return (V/2)+' + '+(V/2);
    if(k==='sub'){var b=R(2,Math.min(30,V));return (V+b)+' '+M+' '+b;}
    var a=R(1,V-1);return a+' + '+(V-a);
  }
  var set=[],tries=0;
  while(set.length<3&&tries++<60){var e=ex(T2);if(set.indexOf(e)<0)set.push(e);}
  var W=T2+(R(1,lv<=2?3:10))*(Math.random()<0.5?1:-1),we,t2=0;
  do{we=ex(W);}while(set.indexOf(we)>=0&&++t2<20);
  var ch=shuffle(set.concat([we]));
  return {mode:'choice',cls:'expr',html:P('셋은 값이 같고, 하나만 달라요.<br>값이 <b>다른</b> 하나를 골라요!'),plain:'값이 다른 하나: '+ch.join(' / '),
    choices:ch,answer:we,hint:'하나씩 계산해 봐요. 같은 값이 세 개 나올 거예요.',explain:'다른 것: '+we+' = '+W+'<br>나머지는 모두 '+T2};
};

    if(String(val)===String(p.fix)){winQ(p,cur.tries===0,val);return;}
    cur.tries++;beep(false);
    if(cur.tries<2){cur.input='';cur.fb='<div class="bad">아쉬워요! 곰돌이 식을 직접 계산해 봐요 🤔</div><div class="hint">💡 '+p.hint+'</div>';render();return;}
    loseQ(p,val,p.fix);return;}
  var ok=String(val)===String(p.answer),max=(p.mode==='choice'&&p.choices.length<=2)?1:2;
  if(ok&&p.fix){cur.stage2=true;cur.tries=0;cur.input='';beep(true);
    cur.fb='<div class="good" style="font-size:30px">맞아요, 곰돌이가 틀렸어요! 👍</div><div class="hint">그럼 바른 답은 얼마일까요? 숫자를 눌러 입력해요.</div>';render();return;}
  if(ok){winQ(p,cur.tries===0,val);return;}
  cur.tries++;beep(false);
  if(p.mode==='choice'&&choiceIdx!=null)cur.wrongIdx.push(choiceIdx);
  if(cur.tries<max){cur.input='';cur.fb='<div class="bad">아쉬워요! 한 번 더 생각해 볼까요? 🤔</div><div class="hint">💡 '+p.hint+'</div>';render();return;}
  loseQ(p,val,p.fix||p.answer);
}
function rResult(){
  var ss=S.session,n=ss.items.length;
  var h='<div class="hello">오늘 문제 끝! 🎉</div><div class="mascot">🏆</div><div class="stats"><div class="stat"><b>'+ss.correct+' / '+n+'</b><span>맞힌 문제</span></div><div class="stat"><b>⭐ '+ss.stars+'</b><span>오늘 받은 별</span></div></div>';
  if(ss.newStickers.length)h+='<div class="card" style="text-align:center"><div style="font-size:26px">새로 받은 스티커</div><div style="font-size:70px">'+ss.newStickers.join(' ')+'</div></div>';
  h+='<button class="btn green" onclick="App.go(\'home\')">처음으로</button><button class="btn blue" onclick="App.go(\'stickers\')">🎁 스티커북 보기</button>';
  app.innerHTML=h;
}
function rStickers(){
  var h='<div class="top"><button class="pill" onclick="App.go(\'home\')">🏠</button><div class="grow" style="font-size:28px;text-align:center">🎁 스티커북</div><div class="pill">'+S.stickers.length+' / '+STICKERS.length+'</div></div>';
  h+='<div class="muted" style="text-align:center;margin-bottom:12px;font-size:20px">별 '+PER_STICKER+'개를 모을 때마다 스티커 1개!</div><div class="stickers">';
  STICKERS.forEach(function(s){var has=S.stickers.indexOf(s)>=0;h+='<div class="slot'+(has?'':' empty')+'">'+(has?s:'?')+'</div>';});
  app.innerHTML=h+'</div>';
}
// ---------- 부모 잠금 ----------
var pin={buf:'',first:''};
function rLock(){
  if(!S.settings.pin&&window.kidsGate){var gp=kidsGate.get().pin;if(gp){S.settings.pin=gp;save();}}
  var setting=!S.settings.pin,title=setting?(pin.first?'한 번 더 입력해 주세요':'부모 비밀번호 4자리를 정해 주세요'):'부모 비밀번호를 입력하세요';
  var dots='';for(var i=0;i<4;i++)dots+=i<pin.buf.length?'●':'○';
  var h='<div class="top"><button class="pill" onclick="App.go(\'home\')">🏠</button></div><div class="card" style="max-width:480px;margin:0 auto;text-align:center"><h2>🔒 '+title+'</h2><div class="pin-dots">'+dots+'</div><div class="muted" id="pinmsg">'+(pin.msg||'')+'</div><div class="pad" style="margin-top:10px">';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button onclick="App.pk(\''+n+'\')">'+n+'</button>';});
  h+='<button class="del" onclick="App.pk(\'del\')">⌫</button><button onclick="App.pk(\'0\')">0</button><button onclick="App.go(\'home\')" style="font-size:22px">취소</button></div></div>';
  app.innerHTML=h;
}
function pk(k){
  if(k==='del'){pin.buf=pin.buf.slice(0,-1);rLock();return;}
  if(pin.buf.length>=4)return;pin.buf+=k;pin.msg='';
  if(pin.buf.length===4){
    if(!S.settings.pin){if(!pin.first){pin.first=pin.buf;pin.buf='';}else if(pin.first===pin.buf){S.settings.pin=pin.buf;save();try{var gg=kidsGate.get();gg.pin=pin.buf;kidsGate.put(gg);}catch(e){}pin={buf:'',first:''};go('parent');return;}else{pin={buf:'',first:'',msg:'두 번 입력한 번호가 달라요. 다시 정해 주세요.'};}}
    else if(pin.buf===S.settings.pin){pin={buf:'',first:''};go('parent');return;}
    else{pin={buf:'',first:'',msg:'번호가 맞지 않아요.'};}
  }
  rLock();
}
// ---------- 부모 화면 ----------
function rParent(){
  var t=today(),d=S.days[t]||{total:0,correct:0,first:0};
  var h='<div class="top"><button class="pill" onclick="App.go(\'home\')">🏠 나가기</button><div class="grow" style="font-size:26px;text-align:center">👨‍👩‍👧 부모님 화면</div></div>';
  if(!storageOK)h+='<div class="warn">이 브라우저에서는 기록 저장이 안 되고 있어요. 아래 백업 코드를 자주 복사해 두세요.</div>';
  h+='<div class="card"><h2>오늘 ('+t+')</h2><div class="stats" style="margin:0"><div class="stat"><b>'+d.total+'</b><span>푼 문제</span></div><div class="stat"><b>'+(d.total?Math.round(d.first/d.total*100):0)+'%</b><span>한 번에 정답</span></div><div class="stat"><b>'+(d.total?Math.round(d.correct/d.total*100):0)+'%</b><span>최종 정답</span></div><div class="stat"><b>'+S.review.length+'</b><span>다시 풀 문제</span></div></div>';
  // 최근 14일
  var keys=Object.keys(S.days).sort().reverse().slice(0,14);
  h+='<h3>📅 최근 기록</h3>';
  if(!keys.length)h+='<div class="muted">아직 기록이 없어요.</div>';
  else{h+='<table><tr><th>날짜</th><th>푼 문제</th><th>한 번에 정답</th><th>최종 정답</th></tr>';keys.forEach(function(k){var x=S.days[k];h+='<tr><td>'+k.slice(5)+'</td><td>'+x.total+'</td><td>'+(x.total?Math.round(x.first/x.total*100):0)+'%</td><td>'+(x.total?Math.round(x.correct/x.total*100):0)+'%</td></tr>';});h+='</table>';}
  // 유형별
  var agg={};SKILLS.forEach(function(s){agg[s[0]]={t:0,f:0};});
  Object.keys(S.days).forEach(function(k){var by=S.days[k].by||{};for(var sk in by){if(agg[sk]){agg[sk].t+=by[sk].t;agg[sk].f+=(by[sk].f||0);}}});
  h+='<h3>🧠 유형별 (한 번에 정답률 · 현재 단계)</h3><table><tr><th>유형</th><th>정답률</th><th></th><th>단계</th></tr>';
  SKILLS.forEach(function(s){var a=agg[s[0]],r=a.t?Math.round(a.f/a.t*100):0,L=S.levels[s[0]].lv;
    h+='<tr><td style="text-align:left">'+s[2]+' '+s[1]+'</td><td style="width:30%"><div class="bar"><div style="width:'+r+'%"></div></div></td><td>'+(a.t?r+'% ('+a.t+')':'-')+'</td><td style="white-space:nowrap"><button class="sbtn" onclick="App.lv(\''+s[0]+'\',-1)">−</button> '+L+' <button class="sbtn" onclick="App.lv(\''+s[0]+'\',1)">+</button></td></tr>';});
  h+='</table><div class="muted" style="margin-top:6px">단계는 1~5. 한 번에 3문제 연속 맞히면 올라가고, 2문제 연속 틀리면 내려가요.</div>';
  // 오답
  var ws=[];keys.forEach(function(k){(S.days[k].wrongs||[]).forEach(function(w){ws.push({d:k,w:w});});});
  h+='<h3>❌ 최근 틀린 문제</h3>';
  if(!ws.length)h+='<div class="muted">틀린 문제가 없어요.</div>';
  ws.slice(-30).reverse().forEach(function(x){h+='<div class="wrong-item">'+SK[x.w.s].icon+' '+esc(x.w.q)+'<br><small>'+x.d.slice(5)+' · 정답 '+esc(x.w.a)+' · 아이 답 '+esc(x.w.g||'-')+'</small></div>';});
  h+='</div>';
  // 설정
  h+='<div class="card" style="margin-top:16px"><h2>⚙️ 설정</h2>';
  h+='<div class="row">아이 이름 <input id="nm" value="'+esc(S.settings.name)+'" maxlength="8" style="width:140px"> <button class="sbtn" onclick="App.setName()">저장</button></div>';
  h+='<div class="row">학년 ';['K','1','2','3'].forEach(function(g){h+='<button class="sbtn"'+(PROF.grade===g?' style="background:#ff9f43;color:#fff;border-color:#ff9f43"':'')+' onclick="App.setGrade(\''+g+'\')">'+GRADES[g].name+'</button> ';});h+='<span class="muted">(바꾸면 단계가 그 학년 처음으로 돌아가요)</span></div>';
  h+='<div class="row">하루 문제 수 <select id="dl" onchange="App.setDaily()">';[10,15,20,25,30].forEach(function(n){h+='<option'+(n===S.settings.daily?' selected':'')+'>'+n+'</option>';});h+='</select> <span class="muted">(다음 세트부터 적용)</span></div>';
  h+='<div class="row"><button class="sbtn" onclick="App.again()">🔄 오늘 문제 새로 한 세트 더</button><button class="sbtn" onclick="App.newPin()">🔑 비밀번호 바꾸기</button></div>';
  h+='<h3>💾 백업 / 복원</h3><div class="muted">기기를 바꾸거나 브라우저 데이터를 지울 때를 대비해 백업 코드를 복사해 두세요.</div><textarea id="bk" readonly onclick="this.select()"></textarea><div class="row"><button class="sbtn" onclick="App.copyBk()">백업 코드 만들기·복사</button><span id="bkmsg" class="muted"></span></div>';
  h+='<textarea id="rs" placeholder="복원할 백업 코드를 여기에 붙여 넣으세요"></textarea><div class="row"><button class="sbtn" onclick="App.restore()">복원하기</button><button class="sbtn red" onclick="App.wipe()">전체 초기화</button></div></div>';
  app.innerHTML=h;
}
function confirmBox(msg,yes){var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="card"><div style="font-size:24px;margin-bottom:14px;word-break:keep-all">'+msg+'</div><div class="home-row"><button class="btn ghost" id="cn">취소</button><button class="btn" id="cy">확인</button></div></div>';
  document.body.appendChild(o);o.querySelector('#cn').onclick=function(){o.remove();};o.querySelector('#cy').onclick=function(){o.remove();yes();};}

window.App={
  go:go,
  start:function(){var ss=S.session;if(!ss||ss.date!==today())buildSession();if(S.session.done){go('home');return;}resetCur();go('quiz');},
  key:function(k){if(cur.locked)return;if(k==='del')cur.input=cur.input.slice(0,-1);else if(k==='ok'){if(cur.input!=='')submit(cur.input);return;}else if(cur.input.length<5)cur.input=(cur.input==='0'?'':cur.input)+k;
    var d=document.getElementById('disp');if(d)d.innerHTML=cur.input||'&nbsp;';},
  choose:function(i){if(cur.stage2)return;var p=curP();submit(p.choices[i],i);},
  next:function(){var ss=S.session;ss.idx++;resetCur();if(ss.idx>=ss.items.length){ss.done=true;save();go('result');}else{save();go('quiz');}},
  say:function(){try{var p=curP();kidsSpeak((p.speak||p.plain).replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,'').replace(/□/g,'빈칸'),0.9);}catch(e){}},
  pk:pk,
  lv:function(sk,dv){var L=S.levels[sk];L.lv=Math.max(GR.min,Math.min(GR.max,L.lv+dv));L.up=0;L.down=0;save();rParent();},
  setName:function(){var v=document.getElementById('nm').value.trim();if(v){S.settings.name=v;PROF.name=v;hubSave();save();}rParent();},
  setGrade:function(g){if(PROF.grade===g)return;confirmBox(GRADES[g].name+'으로 바꿀까요? 오늘 문제 세트도 새로 만들어져요.',function(){PROF.grade=g;hubSave();hubLoad();SKILLS.forEach(function(sk){S.levels[sk[0]]={lv:GR.min,up:0,down:0};});S.settings.daily=GRADES[g].daily;S.session=null;S.review=[];save();rParent();});},
  setDaily:function(){S.settings.daily=Number(document.getElementById('dl').value);save();},
  again:function(){confirmBox('오늘 문제를 새로 한 세트 더 풀게 할까요?',function(){buildSession();save();rParent();});},
  newPin:function(){S.settings.pin='';save();try{var gg=kidsGate.get();gg.pin='';kidsGate.put(gg);}catch(e){}pin={buf:'',first:''};go('lock');},
  copyBk:function(){var code;try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){code='';}var t=document.getElementById('bk');t.value=code;t.select();
    var m=document.getElementById('bkmsg');try{navigator.clipboard.writeText(code).then(function(){m.textContent='복사했어요! 메모 앱 등에 붙여 넣어 보관하세요.';},function(){m.textContent='코드를 길게 눌러 직접 복사해 주세요.';});}catch(e){m.textContent='코드를 길게 눌러 직접 복사해 주세요.';}},
  restore:function(){var v=document.getElementById('rs').value.trim();if(!v)return;var o;try{o=JSON.parse(decodeURIComponent(escape(atob(v))));}catch(e){o=null;}
    if(!o||!o.levels){confirmBox('백업 코드가 올바르지 않아요.',function(){});return;}
    confirmBox('지금 기록을 지우고 백업 코드로 되돌릴까요?',function(){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}S=o;load2(o);rParent();});},
  wipe:function(){confirmBox('모든 기록·별·스티커가 지워져요. 정말 초기화할까요?',function(){var keepPin=S.settings.pin;S=defState();S.settings.pin=keepPin;save();rParent();});}
};
function load2(o){var d=defState();for(var k in o){if(o.hasOwnProperty(k))d[k]=o[k];}SKILLS.forEach(function(s){if(!d.levels[s[0]])d.levels[s[0]]={lv:2,up:0,down:0};});S=d;save();}

load();
S.review=(S.review||[]).filter(function(e){return e&&e.skill;}).map(function(e){return {rid:e.rid||rid(),skill:e.skill,lv:e.lv||2,plain:e.plain};});
// 매니페스트(홈 화면 추가용)
try{var icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#ff9f43"/><text x="50" y="68" font-size="54" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="bold">1+2</text></svg>');
  var lk=document.createElement('link');lk.rel='icon';lk.href=icon;document.head.appendChild(lk);}catch(e){}
render();
