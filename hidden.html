<title>숨은그림 탐정</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#f6f3ec;--ink:#2b2b2b;--sub:#857e70;--main:#ff7a59;--main-d:#d95a3b;--line:#e6dfd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;padding:12px;overflow-y:auto}
h1{font-weight:normal;font-size:44px;text-align:center;margin:10px 0 2px}
h2{font-weight:normal;font-size:28px;text-align:center;margin:18px 0 10px}
.sub{text-align:center;color:var(--sub);font-size:20px;line-height:1.5}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.mcard{background:#fff;border-radius:24px;padding:18px 10px;text-align:center;font-size:26px;box-shadow:0 5px 0 var(--line);border:4px solid transparent}
.mcard .ic{font-size:56px;display:block;min-height:64px}
.mcard small{display:block;font-size:17px;color:var(--sub);margin-top:4px}
.mcard.sel{border-color:var(--ink)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sbtn{background:#fff;border-radius:20px;padding:12px 4px;font-size:30px;box-shadow:0 5px 0 var(--line);min-height:86px}
.sbtn small{display:block;font-size:16px;color:#f0a500;min-height:18px}
.sbtn.lock{opacity:.4;pointer-events:none}
.sbtn:active,.btn:active,.hb:active{transform:translateY(3px);box-shadow:none}
.btn{display:block;width:100%;font-size:28px;padding:18px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:12px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.game{display:flex;flex-direction:column;height:100%;gap:8px}
.hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.07);font-size:21px;white-space:nowrap}
.hb{background:#fff;border-radius:14px;padding:7px 11px;box-shadow:0 3px 0 var(--line);font-size:19px;white-space:nowrap}
.grow{flex:1}
.area{flex:1;min-height:0;display:flex;gap:10px;align-items:center;justify-content:center;flex-direction:column}
.scene{position:relative;overflow:hidden;border-radius:14px;touch-action:none;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(0,0,0,.1);flex:none;background:#fff}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.targets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:18px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.tg{display:flex;flex-direction:column;align-items:center;font-size:16px;min-width:70px;padding:4px;border-radius:12px;position:relative}
.tg.done{background:#ffe8ea}
.tg.done svg path{stroke:#ff3b6b}
.tg.done::after{content:'✔';position:absolute;right:2px;top:0;font-size:24px;color:#ff3b6b}
.info{text-align:center;font-size:22px}
.ring{animation:ringpop .4s}
@keyframes ringpop{from{opacity:0}to{opacity:1}}
.glow{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.miss{animation:fade .65s forwards}
@keyframes fade{to{opacity:0}}
.slow{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(43,43,43,.9);color:#fff;font-size:30px;padding:22px 30px;border-radius:24px;text-align:center;z-index:12;pointer-events:none}.slow small{font-size:18px;opacity:.8}
.overlay{position:fixed;inset:0;background:rgba(30,28,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:24px;max-width:480px;width:100%;text-align:center}
.big{font-size:90px;line-height:1.1;animation:pop2 .6s}
@keyframes pop2{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.rate{font-size:54px;letter-spacing:6px;color:#f0a500}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media (orientation:landscape){
  .area.find{flex-direction:row}
  .area.find .targets{flex-direction:column;flex-wrap:nowrap;max-height:100%;overflow-y:auto;padding:6px}
  .area.find .tg{min-width:0;flex-direction:row;gap:6px;font-size:17px;padding:2px 6px}
  .area.split{flex-direction:row}
  .stages{grid-template-columns:repeat(10,1fr)}
}
</style>

<script>
'use strict';
/*ART-START*/
var INK='#2b2b2b';
function rf(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rf(a,b+1));}
function f1(n){return Math.round(n*10)/10;}
function starPath(cx,cy,ro,rin,n){var p='';for(var i=0;i<n*2;i++){var r=i%2?rin:ro,a=-Math.PI/2+i*Math.PI/n;p+=(i?'L':'M')+f1(cx+r*Math.cos(a))+' '+f1(cy+r*Math.sin(a));}return p+'Z';}
function circ(cx,cy,r){return 'M'+f1(cx-r)+' '+f1(cy)+'a'+f1(r)+' '+f1(r)+' 0 1 0 '+f1(2*r)+' 0a'+f1(r)+' '+f1(r)+' 0 1 0 '+f1(-2*r)+' 0';}
// 숨길 물건 (100x100 상자, 중심 50,50)
var ICONS=[
 ['숟가락','M50 8C36 8 32 30 40 40C44 45 47 46 48 50L46 90Q50 96 54 90L52 50C53 46 56 45 60 40C68 30 64 8 50 8Z'],
 ['우산','M8 50Q50 2 92 50Q83 42 74 50Q65 42 56 50Q50 45 44 50Q35 42 26 50Q17 42 8 50ZM50 50L50 86Q50 94 42 94Q35 94 35 87M50 26L50 12'],
 ['양말','M36 6L62 6L62 56Q62 64 70 68L84 74Q95 80 89 91Q84 98 72 94L40 80Q32 76 34 66ZM36 18L62 18'],
 ['열쇠',circ(28,50,18)+circ(28,50,7)+'M46 50L92 50M80 50L80 64M90 50L90 60'],
 ['물고기','M8 50Q38 20 72 50Q38 80 8 50ZM72 50L92 32L92 68ZM40 36Q46 50 40 64'+circ(24,46,3.5)],

 ['버섯','M10 54Q12 14 50 12Q88 14 90 54ZM38 54L36 86Q50 92 64 86L62 54'+circ(32,36,6)+circ(58,26,5)+circ(70,42,5)],
 ['컵','M22 28L27 86Q50 92 73 86L78 28ZM77 40Q94 40 94 56Q94 72 75 72M22 28Q50 36 78 28'],
 ['모자','M8 74Q50 90 92 74Q92 66 76 66L72 22Q50 14 28 22L24 66Q8 66 8 74ZM25 56Q50 64 75 56'],
 ['바나나','M14 28Q18 80 70 86Q86 86 92 78Q60 74 44 58Q30 44 28 24Q22 18 14 28ZM14 28L9 18L16 16'],
 ['종','M50 14Q30 16 28 44Q27 66 14 76L86 76Q73 66 72 44Q70 16 50 14ZM42 76Q50 92 58 76M50 14L50 6'+circ(50,4,3)],
 ['망치','M12 16L62 16L62 38L12 38Q4 27 12 16ZM34 38L34 94L46 94L46 38'],
 ['연필','M24 76L70 30L82 42L36 88ZM24 76L14 98L36 88M64 36L76 48'],
 ['칫솔','M8 66L70 42L74 52L12 76ZM70 42L90 34L94 46L74 52M76 40L73 30M82 38L79 28M88 35L85 25'],
 ['장갑','M30 92L30 46Q30 14 54 14Q76 14 74 46L74 52Q86 40 93 48Q97 56 80 70L72 92ZM28 82L74 82'],
 ['초','M38 42L38 92L62 92L62 42ZM50 42L50 32M50 10Q62 24 50 32Q38 24 50 10Z'],
 ['연','M50 6L82 40L50 80L18 40ZM50 6L50 80M18 40L82 40M50 80Q40 88 50 92Q60 96 50 100'],
 ['당근','M26 26Q38 16 50 28L82 88Q84 95 76 92L24 40Q18 32 26 26ZM28 26Q24 12 14 10M36 23Q38 9 46 6M40 48L47 43M54 64L61 59'],
 ['장화','M30 8L56 8L56 58Q56 65 64 67L84 73Q94 77 92 90L28 90ZM28 80L92 80M30 20L56 20'],
 ['깃털','M82 8Q30 26 20 80Q18 90 22 92Q76 76 82 8ZM82 8Q52 50 20 92M54 34L42 30M46 50L32 48M62 46L68 56M52 64L58 72'],
 ['빗','M8 32L92 32L92 48L8 48ZM16 48L16 74M26 48L26 74M36 48L36 74M46 48L46 74M56 48L56 74M66 48L66 74M76 48L76 74M86 48L86 74'],
 ['안경',circ(26,52,16)+circ(74,52,16)+'M42 50Q50 42 58 50M10 50L4 38M90 50L96 38'],
 ['병','M42 6L58 6L58 24Q72 32 72 48L72 88Q50 95 28 88L28 48Q28 32 42 24ZM40 14L60 14M28 60L72 60'],
 ['아이스크림','M28 44L50 94L72 44ZM28 44Q26 18 50 16Q74 18 72 44M36 58L64 58M40 70L60 70M50 16Q54 6 60 8'],
 ['풍선','M50 8Q80 8 80 40Q80 68 50 74Q20 68 20 40Q20 8 50 8ZM45 74L55 74L50 80ZM50 80Q40 88 52 98M34 26Q38 18 46 16']
];
// 아이콘을 세로(위쪽이 위)로 세우는 회전값, 긴 쪽 길이(상자 대비)
var ICON_UP={'숟가락':0,'우산':0,'양말':0,'열쇠':90,'물고기':90,'하트':0,'달':0,'별':0,'버섯':0,'컵':0,'모자':0,'바나나':-30,'종':0,'망치':0,'연필':135,'칫솔':-69,'장갑':0,'초':0,'연':0,'당근':39,'장화':0,'깃털':-36,'빗':0,'안경':0,'병':0,'아이스크림':0,'풍선':0};
var ICON_LEN={'연필':1.05,'칫솔':0.9,'깃털':1.0,'당근':0.85,'열쇠':0.8,'물고기':0.84,'숟가락':0.88,'초':0.9,'병':0.94,'빗':0.84,'바나나':0.85};
function iconIdx(name){for(var i=0;i<ICONS.length;i++)if(ICONS[i][0]===name)return i;return -1;}
function iconSvg(i,cx,cy,s,rot,opt){opt=opt||{};var sw=(opt.sw||2.8)*100/s;
  return '<g transform="translate('+f1(cx)+' '+f1(cy)+') rotate('+f1(rot||0)+') scale('+f1(s/100*1000)/1000+') translate(-50 -50)"><path d="'+ICONS[i][1]+'" fill="'+(opt.fill||'none')+'" stroke="'+(opt.color||INK)+'" stroke-width="'+f1(sw)+'" stroke-linejoin="round" stroke-linecap="round"/></g>';}

// ---------- 장면 부품 ----------
function P(d,fill,sw){return '<path d="'+d+'" fill="'+(fill||'none')+'" stroke="'+INK+'" stroke-width="'+(sw||3)+'" stroke-linejoin="round" stroke-linecap="round"/>';}
function blobD(cx,cy,rx,ry,n,jit){var pts=[],off=rf(0,6.28),i;for(i=0;i<n;i++){var a=off+i*6.2832/n,k=1+rf(-jit,jit);pts.push([cx+rx*k*Math.cos(a),cy+ry*k*Math.sin(a)]);}
  var d='M'+f1(pts[0][0])+' '+f1(pts[0][1]);for(i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n],ch=Math.hypot(q[0]-p[0],q[1]-p[1])*0.6;d+='A'+f1(ch)+' '+f1(ch)+' 0 0 1 '+f1(q[0])+' '+f1(q[1]);}return d+'Z';}
function leafMarks(cx,cy,rx,ry,n){var d='';for(var i=0;i<n;i++){var a=rf(0,6.28),r=Math.sqrt(Math.random())*0.82,x=cx+rx*r*Math.cos(a),y=cy+ry*r*Math.sin(a),s=rf(7,13),t=ri(0,2);
  if(t===0)d+='M'+f1(x)+' '+f1(y)+'q'+f1(s/2)+' '+f1(-s*0.6)+' '+f1(s)+' 0';else if(t===1)d+='M'+f1(x)+' '+f1(y)+'q'+f1(s/2)+' '+f1(s*0.6)+' '+f1(s)+' 0';else d+='M'+f1(x)+' '+f1(y)+'l'+f1(s*0.4)+' '+f1(s*0.6)+'l'+f1(s*0.4)+' '+f1(-s*0.6);}return d;}
function tuft(x,y,s){return 'M'+f1(x-s*0.4)+' '+f1(y)+'L'+f1(x-s*0.7)+' '+f1(y-s*0.8)+'M'+f1(x)+' '+f1(y)+'L'+f1(x+rf(-2,2))+' '+f1(y-s)+'M'+f1(x+s*0.4)+' '+f1(y)+'L'+f1(x+s*0.7)+' '+f1(y-s*0.8);}
function slot(L,g,x,y,len,fits,o){o=o||{};var p={g:g||'',x:x-len/2,y:y-len/2,w:len,h:len,alt:{x:x,y:y,len:len,fits:fits,rot:o.rot||0,fill:o.fill||'none',sw:o.sw||2.2,lvl:o.lvl||'mid'}};if(o.tex)p.tex=1;if(o.rm)p.rm=1;if(o.small)p.small=1;L.push(p);return p;}
function part(list,g,x,y,w,h,o){var p={g:g,x:x,y:y,w:w,h:h};for(var k in (o||{}))p[k]=o[k];list.push(p);return p;}

function addCloud(L,cx,cy,w){var d=blobD(cx,cy,w/2,w*0.26,ri(7,10),0.12);part(L,P(d,'#fff'),cx-w/2,cy-w*0.3,w,w*0.6,{rm:1,dense:1});slot(L,P('M'+f1(cx-w*0.12)+' '+f1(cy+w*0.03)+'q'+f1(w*0.12)+' '+f1(-w*0.1)+' '+f1(w*0.24)+' 0',null,2.2),cx,cy,w*0.3,['바나나','달'],{rot:90,lvl:'mid'});}
function addSun(L,cx,cy,r){var d=circ(cx,cy,r),rays='';for(var i=0;i<12;i++){var a=i*Math.PI/6;rays+='M'+f1(cx+(r+8)*Math.cos(a))+' '+f1(cy+(r+8)*Math.sin(a))+'L'+f1(cx+(r+22)*Math.cos(a))+' '+f1(cy+(r+22)*Math.sin(a));}
  part(L,P(d,'#fff')+P(rays),cx-r-22,cy-r-22,2*r+44,2*r+44,{rm:1});}
function addBird(L,x,y,s){part(L,P('M'+f1(x-s)+' '+f1(y)+'Q'+f1(x-s/2)+' '+f1(y-s*0.7)+' '+f1(x)+' '+f1(y)+'Q'+f1(x+s/2)+' '+f1(y-s*0.7)+' '+f1(x+s)+' '+f1(y),null,2.6),x-s,y-s,2*s,s*1.4,{rm:1,flip:1,bird:1});}
function addHills(L,gy){var y1=gy-rf(60,110),y2=gy-rf(40,90);var d='M0 '+gy+'L0 '+f1(y1)+'Q'+f1(rf(150,300))+' '+f1(y1-rf(40,80))+' '+f1(rf(420,520))+' '+f1(y2)+'T1000 '+f1(gy-rf(50,100))+'L1000 '+gy+'Z';
  var tex='';for(var i=0;i<14;i++){var x=rf(30,970),y=gy-rf(8,40);tex+=tuft(x,y,rf(7,11));}
  part(L,P(d,'#fff'),0,gy-200,1000,200,{dense:1});part(L,P(tex,null,2),0,gy-60,1000,60,{});}
function addGround(L,gy,dens){part(L,P('M0 '+gy+'Q250 '+f1(gy-8)+' 500 '+gy+'T1000 '+gy),0,gy-5,1000,10);
  var t='';for(var i=0;i<Math.round(26*dens)+8;i++){t+=tuft(rf(10,990),rf(gy+14,740),rf(9,16));}part(L,P(t,null,2.2),0,gy,1000,750-gy,{dense:1});
  for(i=0;i<4;i++){var x=rf(40,960),y=rf(gy+40,725);slot(L,P(tuft(x,y+7,14),null,2.2),x,y,rf(40,50),['빗','칫솔'],{rot:pick2([180,90,-90])+rf(-10,10),fill:'#fff',sw:2.2,lvl:'mid'});}}
function addTree(L,x,gy,h,dens){
  var tw=h*0.07,cy=gy-h*0.62,R=h*0.36;
  var trunk='M'+f1(x-tw)+' '+gy+'Q'+f1(x-tw*0.6)+' '+f1(gy-h*0.3)+' '+f1(x-tw*0.7)+' '+f1(cy+R*0.5)+'M'+f1(x+tw)+' '+gy+'Q'+f1(x+tw*0.6)+' '+f1(gy-h*0.3)+' '+f1(x+tw*0.7)+' '+f1(cy+R*0.5);
  var bark='';for(var i=0;i<3;i++){var by=gy-h*rf(0.08,0.3);bark+='M'+f1(x-tw*0.4)+' '+f1(by)+'q'+f1(tw*0.4)+' '+f1(-5)+' '+f1(tw*0.8)+' 0';}
  part(L,P(trunk+'M'+f1(x-tw)+' '+gy+'L'+f1(x+tw)+' '+gy,'#fff')+P(bark,null,2),x-tw,cy,tw*2,gy-cy,{});
  part(L,P(blobD(x,cy,R*1.05,R*0.9,ri(10,14),0.1),'#fff'),x-R,cy-R,2*R,2*R*0.9,{dense:1,canopy:1});
  part(L,P(leafMarks(x,cy,R,R*0.85,Math.round(R*0.35*dens)+6),null,2.1),x-R,cy-R,2*R,2*R,{tex:1});
  var na=ri(1,3);for(var j=0;j<na;j++){var a=rf(0,6.28),rr=rf(0.2,0.7)*R,ax=x+rr*Math.cos(a),ay=cy+rr*Math.sin(a)*0.8;var ap=slot(L,P(circ(ax,ay,9),'#fff')+P('M'+f1(ax)+' '+f1(ay-9)+'l2 -6',null,2),ax,ay,26,['풍선','종','하트'],{fill:'#fff',sw:2.4,lvl:'easy',rm:1,small:1});}
  leafSlots(L,x,cy,R,R*0.8,4);
}
function leafSlots(L,cx,cy,rx,ry,n){var pts=[];for(var i=0;i<n;i++){for(var t=0;t<20;t++){var a=rf(0,6.28),r=Math.sqrt(Math.random())*0.7,x=cx+rx*r*Math.cos(a),y=cy+ry*r*Math.sin(a);
  if(pts.every(function(p){return Math.hypot(p[0]-x,p[1]-y)>rx*0.5;})){pts.push([x,y]);break;}}}

try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)D[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ---------- 소리 ----------
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t,dur,type,vol){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sfx(kind){if(!D.sfx)return;var a=ac();if(!a)return;var t=a.currentTime;
  if(kind==='ok'){tone(784,t,0.12,'sine',0.16);tone(1175,t+0.09,0.18,'sine',0.14);}
  else if(kind==='no'){tone(220,t,0.14,'triangle',0.12);}
  else if(kind==='hint'){tone(988,t,0.1,'sine',0.1);tone(1319,t+0.08,0.14,'sine',0.08);}
  else if(kind==='win'){[659,784,988,1319].forEach(function(f,i){tone(f,t+i*0.12,0.2,'sine',0.15);});}}
function hz(m){return 440*Math.pow(2,(m-69)/12);}
var SONG={beat:0.38,mel:[76,0,79,81,79,76,74,0,72,74,76,79,76,74,72,0,69,72,76,74,72,69,67,0,69,72,74,76,74,72,72,0],bass:[45,48,53,48,45,52,50,48]};
var music={timer:null,next:0,step:0};
function musicStart(){musicStop();if(!D.music)return;var a=ac();if(!a)return;music.step=0;music.next=a.currentTime+0.15;
  music.timer=setInterval(function(){while(music.next<a.currentTime+0.3){var n=SONG.mel[music.step%SONG.mel.length];if(n)tone(hz(n),music.next,SONG.beat*0.85,'triangle',0.04);
    if(music.step%4===0)tone(hz(SONG.bass[Math.floor(music.step/4)%SONG.bass.length]),music.next,SONG.beat*3.8,'sine',0.05);music.next+=SONG.beat;music.step++;}},70);}
function musicStop(){if(music.timer){clearInterval(music.timer);music.timer=null;}}
document.addEventListener('visibilitychange',function(){if(document.hidden)musicStop();else if(screen==='game'&&G&&!G.done)musicStart();});

// ---------- 판 만들기 ----------
function svgOf(parts,extraMid,extraTop){var base='',tex='';parts.forEach(function(p){if(p.tex)tex+=p.g;else base+=p.g;});
  return '<svg viewBox="0 0 '+VW+' '+VH+'" width="100%" height="100%" preserveAspectRatio="none" style="display:block">'+'<rect width="'+VW+'" height="'+VH+'" fill="#fff"/>'+base+(extraMid||'')+tex+(extraTop||'')+'<g class="marks"></g><g class="fx"></g></svg>';}
function pickSpot(parts,s,used,anyChance){
  var dense=parts.filter(function(p){return p.dense&&p.w>s*0.7&&p.h>s*0.5;});
  for(var t=0;t<250;t++){var x,y;
    if(!dense.length||Math.random()<anyChance){x=rf(s/2+10,VW-s/2-10);y=rf(s/2+10,VH-s/2-10);}
    else{var p=dense[ri(0,dense.length-1)];x=p.x+p.w*rf(0.15,0.85);y=p.y+p.h*rf(0.15,0.85);}
    if(x<s/2+8||y<s/2+8||x>VW-s/2-8||y>VH-s/2-8)continue;
    var ok=used.every(function(u){return Math.hypot(u.x-x,u.y-y)>(u.s+s)/2+(t<150?24:4);});
    if(ok)return {x:x,y:y};}
  return {x:rf(60,VW-60),y:rf(60,VH-60)};
}
function buildFind(stage){
  var kind=(stage-1)%SCENE_NAMES.length,dens=0.6+stage*0.05,parts=buildScene(kind,dens),n=5+Math.floor(stage/2);
  var W={easy:Math.max(0.6,11-stage*1.15),mid:5,hard:1+stage*1.5};
  var slots=parts.filter(function(p){return p.alt;}).map(function(p){return {p:p,k:Math.pow(Math.random(),1/W[p.alt.lvl])};});
  slots.sort(function(a,b){return b.k-a.k;});
  var used={},items=[];
  for(var i=0;i<slots.length&&items.length<n;i++){var p=slots[i].p,a=p.alt;
    if(a.x<a.len*0.3+8||a.x>VW-a.len*0.3-8||a.y<a.len*0.3+8||a.y>VH-a.len*0.3-8)continue;
    if(!items.every(function(o){return Math.hypot(o.x-a.x,o.y-a.y)>(o.s+a.len)*0.45;}))continue;
    var names=shuffle(a.fits).filter(function(nm){return !used[nm]&&iconIdx(nm)>=0;});if(!names.length)continue;
    var nm=names[0],id=iconIdx(nm),len=a.len*(a.lvl==='hard'?Math.max(0.85,1.3-stage*0.045):1),size=len/(ICON_LEN[nm]||0.85);
    var jr=a.lvl==='hard'?20+stage*12:4+stage*2,rot=(ICON_UP[nm]||0)+(a.rotMap&&a.rotMap[nm]!==undefined?a.rotMap[nm]:a.rot)+rf(-jr,jr);
    used[nm]=1;p.g='<g id="h'+items.length+'">'+iconSvg(id,a.x,a.y,size,rot,{fill:a.fill,sw:a.sw})+'</g>';
    items.push({id:id,x:a.x,y:a.y,s:size*0.8,found:false,lvl:a.lvl});}
  var extra='';
  while(items.length<n){var ids=ICONS.map(function(_,i){return i;}).filter(function(i){return !used[ICONS[i][0]];}),id2=ids[ri(0,ids.length-1)],s2=70-stage*3,sp=pickSpot(parts,s2,items,0.05);
    used[ICONS[id2][0]]=1;extra+='<g id="h'+items.length+'">'+iconSvg(id2,sp.x,sp.y,s2,rf(-90,90),{sw:2.2})+'</g>';items.push({id:id2,x:sp.x,y:sp.y,s:s2,found:false,lvl:'extra'});}
  return {mode:'find',name:SCENE_NAMES[kind],svg:svgOf(parts,'',extra),items:items,need:n,targets:items};
}
function buildDiff(stage){
  var kind=(stage+4)%SCENE_NAMES.length,parts=buildScene(kind,0.55),nd=4+Math.floor(stage/2);
  var maxA=stage<=3?1e9:(stage<=6?26000:9000);
  var cand=shuffle(parts.map(function(p,i){return i;}).filter(function(i){var p=parts[i];return p.rm&&p.w*p.h<maxA;}));
  var diffs=[],mods={},add='';
  function far(x,y){return diffs.every(function(d){return Math.hypot(d.x-x,d.y-y)>80;});}
  var nAdd=Math.max(1,Math.round(nd*0.25));
  for(var a=0;a<nAdd;a++){var s=rf(42,62)-stage,sp=pickSpot(parts,s,diffs.map(function(d){return {x:d.x,y:d.y,s:d.r*2};}),0.2);
    if(!far(sp.x,sp.y))continue;add+=iconSvg(ri(0,ICONS.length-1),sp.x,sp.y,s,rf(-30,30),{fill:'#fff',sw:2.6});diffs.push({x:sp.x,y:sp.y,r:Math.max(32,s*0.7),found:false});}
  for(var c=0;c<cand.length&&diffs.length<nd;c++){var i=cand[c],p=parts[i],cx=p.x+p.w/2,cy=p.y+p.h/2;if(!far(cx,cy))continue;
    var type=p.flip&&Math.random()<0.5?'flip':(p.small&&Math.random()<0.3?'big':'gone');mods[i]=type;
    diffs.push({x:cx,y:cy,r:Math.min(95,Math.max(32,Math.max(p.w,p.h)/2+14)),found:false});}
  var right=parts.map(function(p,i){var m=mods[i];if(!m)return p;if(m==='gone')return null;var cx=p.x+p.w/2,cy=p.y+p.h/2,q={};for(var k in p)q[k]=p[k];
    q.g=m==='flip'?'<g transform="translate('+f1(2*cx)+' 0) scale(-1 1)">'+p.g+'</g>':'<g transform="translate('+f1(cx)+' '+f1(cy)+') scale(1.5) translate('+f1(-cx)+' '+f1(-cy)+')">'+p.g+'</g>';return q;}).filter(Boolean);
  return {mode:'diff',name:SCENE_NAMES[kind],svgL:svgOf(parts),svgR:svgOf(right,'',add),diffs:diffs,need:diffs.length,targets:diffs};
}

// ---------- 화면 ----------
var app=document.getElementById('app'),screen='home',G=null;
function go(s){screen=s;var hb=document.getElementById('hubbtn');if(hb)hb.style.display=s==='game'?'none':'';if(s!=='game')musicStop();({home:rHome,game:rGame})[s]();}
function stars(n){var s='';for(var i=0;i<3;i++)s+=i<n?'★':'☆';return s;}
function rHome(){
  var m=D.mode,h='<h1>🔎 숨은그림 탐정</h1><div class="sub">놀이를 고르고 스테이지를 눌러요!</div><div class="modes">';
  h+='<button class="mcard'+(m==='find'?' sel':'')+'" onclick="App.mode(\'find\')"><span class="ic">'+miniIcon(4)+miniIcon(1)+'</span>숨은그림 찾기<small>그림 속에 숨은 물건을 찾아요</small></button>';
  h+='<button class="mcard'+(m==='diff'?' sel':'')+'" onclick="App.mode(\'diff\')"><span class="ic">👀</span>다른 그림 찾기<small>두 그림에서 다른 곳을 찾아요</small></button></div><h2>스테이지</h2><div class="stages">';
  for(var i=1;i<=STAGES;i++){var b=D.best[m][i],lock=i>D.unlocked[m];h+='<button class="sbtn'+(lock?' lock':'')+'" onclick="App.play('+i+')">'+(lock?'🔒':i)+'<small>'+(b?stars(b):'')+'</small></button>';}
  h+='</div><div class="sub" style="margin-top:16px">스테이지가 올라갈수록 물건이 작아지고, 더 많이 돌아가 있고, 더 꼭꼭 숨어요.<br>두 손가락으로 그림을 크게 볼 수 있어요 🤏</div>';
  app.innerHTML=h;
}
function miniIcon(i,size){size=size||56;return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" style="vertical-align:middle"><path d="'+ICONS[i][1]+'" fill="none" stroke="'+INK+'" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>';}
function start(stage){G=D.mode==='find'?buildFind(stage):buildDiff(stage);G.stage=stage;G.hints=3;G.used=0;G.found=0;G.done=false;Z={s:1,x:0,y:0};go('game');}
function rGame(){
  var h='<div class="game"><div class="hud"><button class="pill" onclick="App.go(\'home\')">◀</button><span class="pill">'+G.name+' · '+G.stage+'단계</span><span class="pill" id="cnt"></span><span class="grow"></span>'+
    '<button class="hb" id="hn" onclick="App.hint()"></button><button class="hb" onclick="App.zreset()">🔍 원래대로</button><button class="hb" id="mu" onclick="App.mu()"></button><button class="hb" id="sf" onclick="App.sf()"></button></div>';
  if(G.mode==='find')h+='<div class="area find" id="area"><div class="scene" id="sc0"><div class="layer" id="ly0">'+G.svg+'</div></div><div class="targets" id="tgs">'+
    G.items.map(function(o,i){return '<div class="tg" id="t'+i+'">'+miniIcon(o.id,52)+'<span>'+ICONS[o.id][0]+'</span></div>';}).join('')+'</div></div>';
  else h+='<div class="info">두 그림에서 <b>다른 곳 '+G.need+'개</b>를 찾아요! 어느 쪽을 눌러도 돼요.</div><div class="area split" id="area"><div class="scene" id="sc0"><div class="layer" id="ly0">'+G.svgL+'</div></div><div class="scene" id="sc1"><div class="layer" id="ly1">'+G.svgR+'</div></div></div>';
  app.innerHTML=h+'</div>';
  layout();bindZoom();updHud();musicStart();
}
var SW=0,SH=0;
function layout(){
  var area=document.getElementById('area'),aw=area.clientWidth,ah=area.clientHeight,ratio=VW/VH,land=window.innerWidth>window.innerHeight;
  if(G.mode==='find'){var tg=document.getElementById('tgs'),tw=land?tg.offsetWidth+12:0,th=land?0:tg.offsetHeight+10;SW=Math.min(aw-tw,(ah-th)*ratio);SH=SW/ratio;}
  else{if(land){SW=Math.min((aw-10)/2,ah*ratio);SH=SW/ratio;}else{SH=Math.min((ah-10)/2,aw/ratio);SW=SH*ratio;}}
  ['sc0','sc1'].forEach(function(id){var s=document.getElementById(id);if(!s)return;s.style.width=Math.floor(SW)+'px';s.style.height=Math.floor(SH)+'px';});
  applyZ();
}
function updHud(){
  document.getElementById('cnt').textContent=(G.mode==='find'?'찾은 것 ':'다른 곳 ')+G.found+' / '+G.need;
  document.getElementById('hn').textContent='💡 힌트 '+G.hints;
  document.getElementById('mu').textContent=D.music?'🎵':'🔇';document.getElementById('sf').textContent=D.sfx?'🔊':'🔈';
}
// ---------- 확대/이동 ----------
var Z={s:1,x:0,y:0},ptrs={},gest=null;
function applyZ(){['ly0','ly1'].forEach(function(id){var l=document.getElementById(id);if(l)l.style.transform='translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')';});}
function clampZ(){Z.s=Math.max(1,Math.min(5,Z.s));Z.x=Math.min(0,Math.max(SW-SW*Z.s,Z.x));Z.y=Math.min(0,Math.max(SH-SH*Z.s,Z.y));}
function bindZoom(){
  ['sc0','sc1'].forEach(function(id){var el=document.getElementById(id);if(!el)return;
    el.addEventListener('pointerdown',function(e){try{el.setPointerCapture(e.pointerId);}catch(_){}var r=el.getBoundingClientRect();ptrs[e.pointerId]={x:e.clientX-r.left,y:e.clientY-r.top};
      var ids=Object.keys(ptrs);
      if(ids.length===1)gest={el:el,sx:e.clientX,sy:e.clientY,zx:Z.x,zy:Z.y,moved:false,pinched:false};
      else if(ids.length===2&&gest){var a=ptrs[ids[0]],b=ptrs[ids[1]];gest.pinched=true;gest.d0=Math.hypot(a.x-b.x,a.y-b.y)||1;gest.s0=Z.s;gest.m0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};gest.zx=Z.x;gest.zy=Z.y;}});
    el.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId]||!gest)return;var r=el.getBoundingClientRect();ptrs[e.pointerId]={x:e.clientX-r.left,y:e.clientY-r.top};var ids=Object.keys(ptrs);
      if(ids.length>=2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
        var ns=Math.max(1,Math.min(5,gest.s0*d/gest.d0)),k=ns/gest.s0;Z.s=ns;Z.x=m.x-(gest.m0.x-gest.zx)*k;Z.y=m.y-(gest.m0.y-gest.zy)*k;clampZ();applyZ();}
      else{var dx=e.clientX-gest.sx,dy=e.clientY-gest.sy;if(Math.abs(dx)+Math.abs(dy)>10)gest.moved=true;if(gest.moved&&Z.s>1&&!gest.pinched){Z.x=gest.zx+dx;Z.y=gest.zy+dy;clampZ();applyZ();}}});
    function up(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];if(gest&&!Object.keys(ptrs).length){if(!gest.moved&&!gest.pinched)tap(gest.el,e.clientX,e.clientY);gest=null;}}
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];if(!Object.keys(ptrs).length)gest=null;});
  });
}
// ---------- 판정 ----------
var NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}
function eachSvg(fn){['ly0','ly1'].forEach(function(id){var l=document.getElementById(id);if(l)fn(l.querySelector('svg'));});}
function slowDown(){var o=document.createElement('div');o.className='slow';o.innerHTML='🐢 천천히! 잘 보고 눌러요<br><small>잠깐만 기다려요…</small>';document.body.appendChild(o);setTimeout(function(){o.remove();},2600);}
function tap(el,cx,cy){
  if(G.done)return;var now=Date.now();if(G.lockUntil&&now<G.lockUntil)return;var r=el.querySelector('.layer').getBoundingClientRect(),x=(cx-r.left)/r.width*VW,y=(cy-r.top)/r.height*VH;
  var hit=null,bd=1e9;G.targets.forEach(function(t,i){if(t.found)return;var rad=G.mode==='find'?Math.max(t.s*0.62,34):t.r,d=Math.hypot(t.x-x,t.y-y);if(d<rad&&d<bd){bd=d;hit=i;}});
  if(hit!==null){var t=G.targets[hit];t.found=true;G.found++;sfx('ok');
    var rad=G.mode==='find'?t.s*0.68:t.r;
    eachSvg(function(svg){svg.querySelector('.marks').appendChild(svgEl('circle',{cx:t.x,cy:t.y,r:rad,fill:'none',stroke:'#ff3b6b','stroke-width':6,'class':'ring'}));});
    if(G.mode==='find'){var g=document.getElementById('h'+hit);if(g){var p=g.querySelector('path');p.setAttribute('stroke','#ff3b6b');p.setAttribute('stroke-width',String(parseFloat(p.getAttribute('stroke-width'))*1.6));}
      var tg=document.getElementById('t'+hit);if(tg)tg.className='tg done';}
    updHud();if(G.found>=G.need)win();}
  else{sfx('no');G.miss=(G.miss||0)+1;G.missT=(G.missT||[]).filter(function(t){return now-t<4000;});G.missT.push(now);
    if(G.missT.length>=3){G.missT=[];G.lockUntil=now+2600;slowDown();}var fx=el.querySelector('.fx'),m=svgEl('text',{x:x,y:y,'font-size':44,'text-anchor':'middle','dominant-baseline':'middle','class':'miss'});m.textContent='✖';m.setAttribute('fill','#ff6b6b');fx.appendChild(m);setTimeout(function(){m.remove();},650);}
}
function hint(){
  if(G.done||G.hints<=0)return;var list=G.targets.filter(function(t){return !t.found;});if(!list.length)return;
  var t=list[ri(0,list.length-1)],rad=(G.mode==='find'?t.s:t.r*2)*1.3;G.hints--;G.used++;sfx('hint');updHud();
  eachSvg(function(svg){var c=svgEl('circle',{cx:t.x+rf(-rad*0.25,rad*0.25),cy:t.y+rf(-rad*0.25,rad*0.25),r:rad,fill:'rgba(255,215,0,.28)',stroke:'#ffc400','stroke-width':5,'class':'glow'});svg.querySelector('.fx').appendChild(c);setTimeout(function(){c.remove();},2800);});
}
function win(){
  G.done=true;musicStop();setTimeout(function(){sfx('win');},250);
  var s=G.used===0?3:(G.used===1?2:1),m=D.mode;if((G.miss||0)>G.need*2)s=Math.max(1,s-1);if(!D.best[m][G.stage]||s>D.best[m][G.stage])D.best[m][G.stage]=s;if(D.unlocked[m]<=G.stage)D.unlocked[m]=G.stage+1;save();
  confetti();
  setTimeout(function(){var o=document.createElement('div');o.className='overlay';
    o.innerHTML='<div class="panel"><div class="big">🕵️</div><div style="font-size:34px">모두 찾았어요! 🎉</div><div class="rate">'+stars(s)+'</div><div style="font-size:20px;color:#6f8a83">'+(G.used?'힌트 '+G.used+'번 · ':'')+'잘못 누른 것 '+(G.miss||0)+'번'+((G.miss||0)>G.need*2?'<br>다음엔 잘 보고 눌러 봐요!':(G.used?'':'<br>힌트 없이 찾았어요! 최고!'))+'</div>'+
      (G.stage<STAGES?'<button class="btn" id="nx">다음 스테이지 ▶</button>':'<div style="font-size:24px;margin-top:10px">🏆 모든 스테이지를 깼어요!</div>')+'<button class="btn ghost" id="ag">새 그림으로 한 번 더</button><button class="btn ghost" id="ls">처음으로</button></div>';
    document.body.appendChild(o);var nx=o.querySelector('#nx');if(nx)nx.onclick=function(){o.remove();start(G.stage+1);};
    o.querySelector('#ag').onclick=function(){o.remove();start(G.stage);};o.querySelector('#ls').onclick=function(){o.remove();go('home');};},900);
}
function confetti(){var em=['🎉','⭐','🎊','✨','🔎'];for(var i=0;i<24;i++){var s=document.createElement('div');s.className='conf';s.textContent=em[i%em.length];s.style.left=ri(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},4000);})(s);}}
window.addEventListener('resize',function(){if(screen==='game'&&G)setTimeout(function(){Z={s:1,x:0,y:0};layout();},150);});
window.App={go:go,mode:function(m){D.mode=m;save();rHome();},play:start,hint:hint,
  zreset:function(){Z={s:1,x:0,y:0};applyZ();},
  mu:function(){D.music=!D.music;save();updHud();if(D.music)musicStart();else musicStop();},sf:function(){D.sfx=!D.sfx;save();updHud();}};
window.__T={buildFind:buildFind,buildDiff:buildDiff};
go('home');
