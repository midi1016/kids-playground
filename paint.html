<script>(function(){var K='kidsGate.v1';function p2(n){return (n<10?'0':'')+n;}function day(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}function prof(){try{var H=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0]||null;}catch(e){return null;}}function grade(){var p=prof();return (p&&p.grade)||'K';}var FB='';try{FB=localStorage.getItem('kidsFB')||FB;}catch(e){}function get(){var g={on:true,goal:15,day:'',cnt:0,free:'',pin:'',done:0,kinds:{},lock:'',until:0};try{var o=JSON.parse(localStorage.getItem(K)||'{}');for(var k in o)g[k]=o[k];}catch(e){}if(g.goal>60&&!g.v2)g.goal=15;g.v2=1;if(!g.kinds)g.kinds={};if(g.day!==day()){g.day=day();g.cnt=0;g.done=0;}return g;}function sv(g){try{localStorage.setItem(K,JSON.stringify(g));}catch(e){}}function put(g){sv(g);sched();}function lockOn(g){g=g||get();return g.lock&&(!g.until||Date.now()<g.until)?g.lock:'';}function defStudy(n){return grade()==='K'?(n==='math'||n==='hangul'||n==='english'):(n==='math'||n==='english');}function page(){var m=String(location.pathname).match(/([A-Za-z0-9_-]+)\.html$/);return m?m[1]:'index';}function kind(n,g){n=n||page();if(n==='index')return 'hub';g=g||get();var k=g.kinds[n];if(k==='study'||k==='play')return k;return defStudy(n)?'study':'play';}function study(g){g=g||get();return GAMES.filter(function(x){return kind(x[0],g)==='study';}).map(function(x){return x[0];});}function open(g){g=g||get();if(lockOn(g))return false;return !g.on||g.free===day()||g.cnt>=g.goal||!study(g).length;}var GAMES=[['math','수학'],['hangul','한글'],['english','영어'],['robot','로봇 코딩'],['coding','코딩 공방'],['compose','작곡'],['paint','그림 그리기'],['restaurant','레스토랑'],['sudoku','스도쿠'],['clock','시계'],['puzzle','퍼즐'],['maze','미로'],['hidden','숨은그림'],['memory','짝 맞추기'],['hospital','동물 병원'],['coloring','색칠'],['piano','건반']];function add(n){try{n=n||1;if(kind()!=='study')return;var g=get(),was=open(g);g.cnt+=n;var no var CF=['on','goal','free','kinds','lock','until'];function sig(g){var c={},ks=Object.keys(g.kinds||{}).sort(),kk={};ks.forEach(function(k){kk[k]=g.kinds[k];});CF.forEach(function(k){c[k]=k==='kinds'?kk:g[k];});return JSON.stringify(c);}
function url(g,p){return FB+'/fam/'+g.fam+'/dev/'+g.dev+(p?'/'+p:'')+'.json';}

var pt=null;function sched(){if(!FB)return;clearTimeout(pt);pt=setTimeout(push,1200);}
function push(){var g=get();if(!FB||!g.fam)return;var s=sig(g);if(s!==g.sg){if(g.pend!==s){g.pend=s;g.ct=Date.now();sv(g);}var c=JSON.parse(s);c.t=g.ct;c.by='tab';if(g.rs)c.reset=g.rs;req('PUT',url(g,'cfg'),c,function(ok){if(!ok)return;var g3=get();if(sig(g3)===s){g3.sg=s;sv(g3);}});}
  var P=prof();req('PUT',url(g,'st'),{name:P?P.name:'',grade:grade(),cnt:g.cnt,goal:g.goal,day:g.day,page:page(),at:Date.now(),ct:g.ct||0,study:study(g),open:open(g),lock:lockOn(g)});}
function apply(c){var g=get();CF.forEach(function(k){if(k==='kinds')g.kinds=c.kinds||{};else if(c[k]!==undefined)g[k]=c[k];else g[k]=k==='lock'||k==='free'?'':(k==='until'?0:g[k]);});
  if(c.reset&&c.reset===day()&&g.rs!==c.reset){g.cnt=0;g.done=0;}if(c.reset)g.rs=c.reset;g.ct=c.t;g.sg=sig(g);sv(g);return g;}
function pull(){var g=get();if(!FB||!g.fam||document.hidden)return;req('GET',url(g),undefined,function(ok,d){if(!ok)return;var g2=get();if(g2.fam!==g.fam)return;
  if(d&&d.bye){g2.fam='';g2.sg='';sv(g2);return;}

<style>

@media (orientation:portrait){.work{flex-direction:column}.tools{width:auto;display:flex;overflow-x:auto;overflow-y:hidden;flex:none;padding-bottom:4px}.tool{min-width:66px}
 .side{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center}.sw{grid-template-columns:repeat(12,32px)}.sw button{width:32px}.cur{width:44px;flex:none}.stamps{grid-template-columns:repeat(6,1fr);min-width:220px}.sizes{flex:none}}

<script>
'use strict';
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rnd(a,b){return a+Math.random()*(b-a);}
function toast(s){var d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(function(){d.remove();},2000);}
var KEY='kidsPaint.v1',D={paper:'white',brush:'crayon',color:'#e03131',size:2,stamp:0};

// ---------- 작품 저장(IndexedDB) ----------
var DB=null;
function db(cb){if(DB)return cb(DB);try{var r=indexedDB.open('kidsPaint',1);r.onupgradeneeded=function(){r.result.createObjectStore('art',{keyPath:'id'});};r.onsuccess=function(){DB=r.result;cb(DB);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function dbAll(cb){db(function(d){if(!d)return cb([]);var out=[],q=d.transaction('art').objectStore('art').openCursor();q.onsuccess=function(){var c=q.result;if(c){out.push(c.value);c.continue();}else cb(out.sort(function(a,b){return b.t-a.t;}));};q.onerror=function(){cb([]);};});}

// ---------- 도구 ----------
var BR=[['pencil','✏️','연필'],['crayon','🖍️','크레용'],['marker','🖊️','사인펜'],['water','💧','수채화'],['oil','🖌️','유화'],['pastel','☁️','파스텔'],['spray','💨','스프레이'],['glitter','✨','반짝이'],['rainbow','🌈','무지개 펜'],['smudge','👆','손가락 문지르기'],['stamp','🌟','도장'],['fill','🎨','채우기'],['eraser','🧽','지우개']];
var COLORS=['#000000','#495057','#adb5bd','#ffffff','#e03131','#ff6b6b','#f783ac','#ae3ec9','#7048e8','#1c7ed6','#4dabf7','#15aabf','#0ca678','#40c057','#94d82d','#fcc419','#ffd43b','#fd7e14','#a0522d','#6b3e26','#f1c27d','#ffdbac','#c68642','#8d5524'];
var SIZES=[3,6,12,22,40],STAMPS=['⭐','❤️','🌸','🌈','🐶','🐱','🦋','🐟','🍓','🚗','☀️','🌳'];
var PAPERS=[['white','흰 도화지'],['water','수채화 종이'],['canvas','캔버스 천'],['kraft','갈색 종이'],['black','검은 종이']];
function paper(c,kind){var x=c.getContext('2d'),w=c.width,h=c.height,i;
  var base={white:'#fffefa',water:'#fdfcf7',canvas:'#f5efe1',kraft:'#c8a27a',black:'#1f1f24'}[kind];x.fillStyle=base;x.fillRect(0,0,w,h);
  var id=x.getImageData(0,0,w,h),d=id.data;

  if(kind==='water'){for(i=0;i<w*h/2500;i++){x.fillStyle='rgba(0,0,0,'+rnd(0.01,0.03)+')';x.beginPath();x.arc(rnd(0,w),rnd(0,h),rnd(3,18),0,6.3);x.fill();}}
  if(kind==='kraft'){x.strokeStyle='rgba(90,50,20,.08)';for(i=0;i<w/6;i++){x.lineWidth=rnd(0.5,1.5);x.beginPath();var yy=rnd(0,h);x.moveTo(0,yy);x.lineTo(w,yy+rnd(-20,20));x.stroke();}}}
function hex2(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function rgba(a,al){return 'rgba('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+','+al+')';}

// ---------- 화면 ----------
var app=document.getElementById('app'),scr='home',P=null;
function go(s,a){scr=s;var hb=document.getElementById('hubbtn');if(hb)hb.style.display=s==='draw'?'none':'';app.className=s==='draw'?'':'scroll';({home:rHome,draw:rDraw})[s](a);}
function rHome(){

  Array.prototype.forEach.call(app.querySelectorAll('canvas[data-p]'),function(c){paper(c,c.getAttribute('data-p'));});

function rDraw(opt){
  if(!P||opt){var sz=opt&&opt.w?[opt.w,opt.h]:fitSize();P={paper:(opt&&opt.paper)||D.paper,w:sz[0],h:sz[1],hist:[],id:opt&&opt.id||null,saved:false};}
  var h='<div class="top"><button class="pill" onclick="App.home()">◀</button><span class="pill">🖌️ 그림 그리기</span><span class="grow"></span><button class="pill" onclick="App.undo()">↩️ 되돌리기</button><button class="pill" onclick="App.clear()">🗑️ 다 지우기</button><button class="pill" onclick="App.photoNow()">📷 사진 저장</button><button class="pill save" onclick="App.saveArt()">💾 내 작품에 저장</button></div>';
  h+='<div class="work"><div class="tools" id="tools"></div><div class="stage" id="stage"><div class="cvw" id="cvw"><canvas id="bg"></canvas><canvas id="fg"></canvas></div></div><div class="side" id="side"></div></div>';
  var keep=null;if(P.fg){keep=P.fg;}
  app.innerHTML=h;var bg=document.getElementById('bg'),fg=document.getElementById('fg');bg.width=fg.width=P.w;bg.height=fg.height=P.h;
  if(P.bgImg)bg.getContext('2d').drawImage(P.bgImg,0,0);else{paper(bg,P.paper);P.bgImg=document.createElement('canvas');P.bgImg.width=P.w;P.bgImg.height=P.h;P.bgImg.getContext('2d').drawImage(bg,0,0);}
  if(keep)fg.getContext('2d').drawImage(keep,0,0);if(opt&&opt.layer){var im=new Image();im.onload=function(){fg.getContext('2d').drawImage(im,0,0);};im.src=opt.layer;}
  P.bg=bg;P.fgc=fg;P.x=fg.getContext('2d');P.fg=fg;rTools();rSide();fitCv();setTimeout(fitCv,50);bind();}
function fitCv(){var st=document.getElementById('stage'),w=st.clientWidth,h=st.clientHeight,k=Math.min(w/P.w,h/P.h),e=document.getElementById('cvw');e.style.width=Math.floor(P.w*k)+'px';e.style.height=Math.floor(P.h*k)+'px';}
function rTools(){document.getElementById('tools').innerHTML=BR.map(function(b){return '<button class="tool'+(D.brush===b[0]?' on':'')+'" onclick="App.brush(\''+b[0]+'\')"><span class="em">'+b[1]+'</span>'+b[2]+'</button>';}).join('');}
function rSide(){setTimeout(function(){if(P&&document.getElementById('cvw'))fitCv();},0);var h='<div class="cur" style="background:'+(D.brush==='rainbow'?'linear-gradient(90deg,red,orange,yellow,green,blue,violet)':D.color)+'"></div><div class="sw">'+COLORS.map(function(c){return '<button class="'+(D.color===c?'on':'')+'" style="background:'+c+'" onclick="App.color(\''+c+'\')"></button>';}).join('')+'</div>';
  h+='<div class="sizes">'+SIZES.map(function(s,i){var d=Math.max(4,Math.min(26,s*0.7));return '<button class="'+(D.size===i?'on':'')+'" onclick="App.size('+i+')"><span style="display:block;width:'+d+'px;height:'+d+'px;border-radius:50%;background:#3a2846"></span></button>';}).join('')+'</div>';
  if(D.brush==='stamp')h+='<div class="stamps">'+STAMPS.map(function(s,i){return '<button class="em'+(D.stamp===i?' on':'')+'" onclick="App.stamp('+i+')">'+s+'</button>';}).join('')+'</div>';
  document.getElementById('side').innerHTML=h;}
// ---------- 붓 ----------
var ST=null;
function pos(ev){var r=P.fg.getBoundingClientRect();return [(ev.clientX-r.left)*P.w/r.width,(ev.clientY-r.top)*P.h/r.height];}
function snap(){try{P.hist.push(P.x.getImageData(0,0,P.w,P.h));if(P.hist.length>10)P.hist.shift();}catch(e){}}
function bind(){var c=P.fg;
  c.addEventListener('pointerdown',function(ev){ev.preventDefault();try{c.setPointerCapture(ev.pointerId);}catch(e){}var p=pos(ev);snap();P.saved=false;
    if(D.brush==='fill'){fill(p[0]|0,p[1]|0);return;}if(D.brush==='stamp'){stampAt(p);return;}
    ST={last:p,acc:0,hue:ST&&ST.hue||0,load:hex2(D.color),dir:[1,0],pid:ev.pointerId};dab(p,p,true);});
  c.addEventListener('pointermove',function(ev){if(!ST||ev.pointerId!==ST.pid)return;var evs=ev.getCoalescedEvents?ev.getCoalescedEvents():[ev];if(!evs.length)evs=[ev];evs.forEach(function(e2){var p=pos(e2);dab(ST.last,p,false);ST.last=p;});});
  function up(){ST=null;}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);}
function dab(a,b,first){var x=P.x,s=SIZES[D.size],col=hex2(D.color),dx=b[0]-a[0],dy=b[1]-a[1],dist=Math.sqrt(dx*dx+dy*dy);if(dist>0.5){ST.dir=[dx/dist,dy/dist];}
  var br=D.brush;x.save();
  if(br==='pencil'||br==='marker'||br==='rainbow'||br==='eraser'){
    x.lineCap='round';x.lineJoin='round';
    if(br==='eraser'){x.globalCompositeOperation='destination-out';x.strokeStyle='rgba(0,0,0,1)';x.lineWidth=s*1.6;}
    else if(br==='pencil'){x.strokeStyle=rgba(col,0.85);x.lineWidth=Math.max(1.5,s*0.45);}
    else if(br==='marker'){x.strokeStyle=rgba(col,0.92);x.lineWidth=s;}
    else{ST.hue=(ST.hue+dist*0.6)%360;x.strokeStyle='hsl('+ST.hue+',90%,55%)';x.lineWidth=s;}
    x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0]+(first?0.1:0),b[1]);x.stroke();
    if(br==='pencil'){x.fillStyle=rgba(shade(col,-30),0.25);for(var g=0;g<dist/2;g++){var t=Math.random();x.fillRect(a[0]+dx*t+rnd(-s*0.3,s*0.3),a[1]+dy*t+rnd(-s*0.3,s*0.3),1,1);}}
    x.restore();return;}
  var step=br==='water'?Math.max(2,s*0.35):br==='oil'?Math.max(1.5,s*0.18):br==='smudge'?Math.max(2,s*0.25):Math.max(1.5,s*0.3);
  var n=Math.max(1,Math.ceil(dist/step));
  for(var i=first?0:1;i<=n;i++){var t=i/n,px=a[0]+dx*t,py=a[1]+dy*t;
    if(br==='crayon'){var cnt=Math.round(s*s*0.5)+6;for(var k=0;k<cnt;k++){var ang=Math.random()*6.283,rr=Math.sqrt(Math.random())*s;if(Math.random()<0.28)continue;x.fillStyle=rgba(shade(col,R(-18,10)),rnd(0.45,0.95));x.fillRect(px+Math.cos(ang)*rr,py+Math.sin(ang)*rr,rnd(1,2.2),rnd(1,2.2));}}
    else if(br==='pastel'){var cnt2=Math.round(s*s*0.6)+8;for(var k2=0;k2<cnt2;k2++){var a2=Math.random()*6.283,r2=Math.sqrt(Math.random())*s*1.2;x.fillStyle=rgba(shade(col,R(0,40)),rnd(0.08,0.3));x.fillRect(px+Math.cos(a2)*r2,py+Math.sin(a2)*r2,rnd(1.5,3.5),rnd(1.5,3.5));}}
    else if(br==='spray'){var cnt3=Math.round(s*1.8)+4;for(var k3=0;k3<cnt3;k3++){var a3=Math.random()*6.283,r3=Math.random()*s*1.6;x.fillStyle=rgba(col,rnd(0.5,0.9));x.fillRect(px+Math.cos(a3)*r3,py+Math.sin(a3)*r3,1.5,1.5);}}
    else if(br==='water'){var rad=s*rnd(1.3,1.9),gx=px+rnd(-s*0.25,s*0.25),gy=py+rnd(-s*0.25,s*0.25),gr=x.createRadialGradient(gx,gy,0,gx,gy,rad);gr.addColorStop(0,rgba(col,0.08));gr.addColorStop(0.75,rgba(col,0.06));gr.addColorStop(1,rgba(col,0));
      x.globalCompositeOperation='multiply';x.fillStyle=gr;x.beginPath();x.arc(gx,gy,rad,0,6.283);x.fill();x.globalCompositeOperation='source-over';
      if(Math.random()<0.12){x.fillStyle=rgba(shade(col,-25),0.05);x.beginPath();x.arc(gx+rnd(-rad,rad)*0.7,gy+rnd(-rad,rad)*0.7,rnd(2,s*0.5),0,6.283);x.fill();}}
    else if(br==='oil'){var sm=sample(px,py);if(sm)ST.load=[ST.load[0]*0.9+sm[0]*0.1,ST.load[1]*0.9+sm[1]*0.1,ST.load[2]*0.9+sm[2]*0.1];
      var nx=-ST.dir[1],ny=ST.dir[0],qx=px-ST.dir[0]*step,qy=py-ST.dir[1]*step;x.lineCap='round';
      if(!ST.br){ST.br=[];var bn=Math.max(8,Math.round(s/1.3));for(var q0=0;q0<bn;q0++)ST.br.push({o:rnd(-0.85,0.85)*s,k:rnd(-38,38),w:rnd(1.2,Math.max(2,s/4.5))});}
      x.strokeStyle=rgba(ST.load,0.18);x.lineWidth=s*1.5;x.beginPath();x.moveTo(qx,qy);x.lineTo(px,py);x.stroke();
      ST.br.forEach(function(bb){x.strokeStyle=rgba(shade(ST.load,bb.k),0.55);x.lineWidth=bb.w;x.beginPath();x.moveTo(qx+nx*bb.o,qy+ny*bb.o);x.lineTo(px+nx*bb.o,py+ny*bb.o);x.stroke();});}
    else if(br==='glitter'){var cnt4=Math.round(s*0.8)+3;for(var k4=0;k4<cnt4;k4++){var a4=Math.random()*6.283,r4=Math.random()*s*1.4,gxx=px+Math.cos(a4)*r4,gyy=py+Math.sin(a4)*r4,bright=Math.random();
      x.fillStyle=bright<0.25?'rgba(255,255,255,.95)':bright<0.55?rgba(shade(col,60),0.9):'hsl('+R(0,360)+',90%,65%)';if(Math.random()<0.15)star(x,gxx,gyy,rnd(2,s*0.35+3));else x.fillRect(gxx,gyy,2,2);}}
    else if(br==='smudge'){if(i===0)continue;var sz=Math.max(8,s*1.6),ox=px-ST.dir[0]*step,oy=py-ST.dir[1]*step;x.globalAlpha=0.55;x.drawImage(P.fg,ox-sz/2,oy-sz/2,sz,sz,px-sz/2,py-sz/2,sz,sz);x.globalAlpha=1;}}
  x.restore();}
function sample(px,py){try{var d=P.x.getImageData(px|0,py|0,1,1).data;if(d[3]<40)return null;return [d[0],d[1],d[2]];}catch(e){return null;}}
function star(x,cx,cy,r){x.beginPath();for(var k=0;k<10;k++){var a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*0.45:r;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}x.closePath();x.fill();}
function stampAt(p){var x=P.x,s=SIZES[D.size]*3+24;x.save();x.font=Math.round(s)+'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(STAMPS[D.stamp],p[0],p[1]);x.restore();}
function fill(sx,sy){var w=P.w,h=P.h,id=P.x.getImageData(0,0,w,h),d=id.data,i0=(sy*w+sx)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],c=hex2(D.color);
  if(t[3]>200&&Math.abs(t[0]-c[0])+Math.abs(t[1]-c[1])+Math.abs(t[2]-c[2])<10)return;
  function same(i){var a=d[i+3];if(t[3]<60)return a<60;return a>=60&&Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])<90;}
  var st=[sx,sy],seen=new Uint8Array(w*h);while(st.length){var y=st.pop(),xx=st.pop(),i=(y*w+xx);if(seen[i])continue;var l=xx,r=xx;while(l>0&&!seen[y*w+l-1]&&same((y*w+l-1)*4))l--;while(r<w-1&&!seen[y*w+r+1]&&same((y*w+r+1)*4))r++;
    for(var k=l;k<=r;k++){var j=y*w+k;seen[j]=1;d[j*4]=c[0];d[j*4+1]=c[1];d[j*4+2]=c[2];d[j*4+3]=255;if(y>0&&!seen[j-w]&&same((j-w)*4)){st.push(k,y-1);}if(y<h-1&&!seen[j+w]&&same((j+w)*4)){st.push(k,y+1);}}}
  P.x.putImageData(id,0,0);}
// ---------- 저장 ----------
function composite(scale,type){var c=document.createElement('canvas');c.width=Math.round(P.w*scale);c.height=Math.round(P.h*scale);var x=c.getContext('2d');x.drawImage(P.bg,0,0,c.width,c.height);x.drawImage(P.fg,0,0,c.width,c.height);return c.toDataURL(type||'image/jpeg',0.88);}
function dataBlob(u){var p=u.split(','),m=p[0].match(/:(.*?);/)[1],b=atob(p[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m});}
function photoOf(url,name){var blob=dataBlob(url),fn=name+'.jpg',file=null;try{file=new File([blob],fn,{type:'image/jpeg'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'내 그림'}).catch(function(){dl(blob,fn);});return;}dl(blob,fn);}
function dl(blob,fn){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},30000);toast('📷 사진으로 저장했어요');window.__lastPhoto=blob;}
function saveArt(){var id=P.id||('a'+Date.now().toString(36)),isNew=!P.id;P.id=id;
  var v={id:id,t:Date.now(),paper:P.paper,w:P.w,h:P.h,img:composite(0.5),layer:P.fg.toDataURL('image/png')};
  dbPut(v,function(ok){if(!ok){toast('⚠️ 저장하지 못했어요');return;}P.saved=true;toast('💾 내 작품에 저장했어요!');if(isNew){try{kidsGate.add(1);}catch(e){}}});}
window.App={
  start:function(p){D.paper=p;save();P=null;go('draw',{paper:p});},home:function(){if(P&&!P.saved&&P.hist.length){var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><div style="font-size:24px">그림을 저장할까요?</div><button class="btn green" id="sv">💾 저장하고 나가기</button><button class="btn ghost" id="no">저장 안 하고 나가기</button><button class="btn ghost" id="cn">더 그리기</button></div>';document.body.appendChild(o);
      o.querySelector('#sv').onclick=function(){o.remove();saveArt();setTimeout(function(){P=null;go('home');},400);};o.querySelector('#no').onclick=function(){o.remove();P=null;go('home');};o.querySelector('#cn').onclick=function(){o.remove();};return;}P=null;go('home');},
  brush:function(b){D.brush=b;save();rTools();rSide();},color:function(c){D.color=c;if(D.brush==='eraser'||D.brush==='smudge')D.brush='crayon';save();rTools();rSide();},size:function(i){D.size=i;save();rSide();},stamp:function(i){D.stamp=i;save();rSide();},
  undo:function(){if(!P.hist.length){toast('더 되돌릴 게 없어요');return;}P.x.putImageData(P.hist.pop(),0,0);},
  clear:function(){var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><div style="font-size:24px">그림을 다 지울까요?</div><button class="btn" id="ok">네, 지워요</button><button class="btn ghost" id="cn">아니요</button></div>';document.body.appendChild(o);o.querySelector('#ok').onclick=function(){o.remove();snap();P.x.clearRect(0,0,P.w,P.h);};o.querySelector('#cn').onclick=function(){o.remove();};},
  photoNow:function(){photoOf(composite(1),'내 그림');},saveArt:saveArt,
  cont:function(id){dbAll(function(l){var a=l.filter(function(x){return x.id===id;})[0];if(!a)return;P=null;go('draw',{paper:a.paper,w:a.w,h:a.h,id:a.id,layer:a.layer});});},
  photo:function(id){dbAll(function(l){var a=l.filter(function(x){return x.id===id;})[0];if(!a)return;var c=document.createElement('canvas'),b=document.createElement('canvas');c.width=b.width=a.w;c.height=b.height=a.h;paper(b,a.paper);var im=new Image();im.onload=function(){var x=c.getContext('2d');x.drawImage(b,0,0);x.drawImage(im,0,0);photoOf(c.toDataURL('image/jpeg',0.9),'내 그림');};im.src=a.layer;});},
  delA:function(id){var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="panel"><div style="font-size:24px">이 작품을 지울까요?</div><button class="btn" id="ok">네</button><button class="btn ghost" id="cn">아니요</button></div>';document.body.appendChild(o);o.querySelector('#ok').onclick=function(){o.remove();dbDel(id,rHome);};o.querySelector('#cn').onclick=function(){o.remove();};}};
window.__T={P:function(){return P;},D:D,dbAll:dbAll};
window.addEventListener('resize',function(){if(scr==='draw'&&P)fitCv();});
