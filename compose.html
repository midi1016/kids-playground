<script>(function(){var K='kidsGate.v1';function p2(n){return (n<10?'0':'')+n;}function day(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}function prof(){try{var H=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0]||null;}catch(e){return null;}}function grade(){var p=prof();return (p&&p.grade)||'K';}var FB='';try{FB=localStorage.getItem('kidsFB')||FB;}catch(e){}function get(){var g={on:true,goal:15,day:'',cnt:0,free:'',pin:'',done:0,kinds:{},lock:'',until:0};try{var o=JSON.parse(localStorage.getItem(K)||'{}');for(var k in o)g[k]=o[k];}catch(e){}if(g.goal>60&&!g.v2)g.goal=15;g.v2=1;if(!g.kinds)g.kinds={};if(g.day!==day()){g.day=day();g.cnt=0;g.done=0;}return g;}function sv(g){try{localStorage.setItem(K,JSON.stringify(g));}catch(e){}}function put(g){sv(g);sched();}function lockOn(g){g=g||get();return g.lock&&(!g.until||Date.now()<g.until)?g.lock:'';}function defStudy(n){return grade()==='K'?(n==='math'||n==='hangul'||n==='english'):(n==='math'||n==='english');}function page(){var m=String(location.pathname).match(/([A-Za-z0-9_-]+)\.html$/);return m?m[1]:'index';}function kind(n,g){n=n||page();if(n==='index')return 'hub';g=g||get();var k=g.kinds[n];if(k==='study'||k==='play')return k;return defStudy(n)?'study':'play';}function study(g){g=g||get();return GAMES.filter(function(x){return kind(x[0],g)==='study';}).map(function(x){return x[0];});}function open(g){g=g||get();if(lockOn(g))return false;return !g.on||g.free===day()||g.cnt>=g.goal||!study(g).length;}var GAMES=[['math','수학'],['hangul','한글'],['english','영어'],['robot','로봇 코딩'],['coding','코딩 공방'],['compose','작곡'],['sudoku','스도쿠'],['clock','시계'],['puzzle','퍼즐'],['maze','미로'],['hidden','숨은그림'],['memory','짝 맞추기'],['hospital','동물 병원'],['coloring','색칠'],['piano','건반']];function add(n){try{n=n||1;if(kind()!=='study')return;var g=get(),was=open(g);g.cnt+=n;var now=open(g);if(!was&&now&&!g.done){g.done=1 <script>
'use strict';
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
var KEY='kidsCompose.v1',D={songs:[],sfx:true,cnt:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)D[k]=o[k];}}catch(e){}

// ---------- 음 ----------
var NN=['도','도#','레','레#','미','파','파#','솔','솔#','라','라#','시'],NC=['#fa5252','#ff8787','#fd7e14','#ffa94d','#fab005','#40c057','#69db7c','#15aabf','#66d9e8','#4c6ef5','#748ffc','#7950f2'];

var INS={piano:'🎹 피아노',xylo:'🎵 실로폰',flute:'🎶 플루트',organ:'🎛️ 오르간',box:'🎁 오르골',guitar:'🎸 기타',bass:'🔈 베이스',synth:'🌈 신스'};

var CH={C:[60,64,67],Dm:[62,65,69],Em:[64,67,71],F:[65,69,72],G:[67,71,74],Am:[69,72,76],G7:[67,71,77],E:[64,68,71]},CHK={C:'도미솔',Dm:'레파라',Em:'미솔시',F:'파라도',G:'솔시레',Am:'라도미',G7:'솔시파',E:'미솔#시'};

  if(ins==='piano'){osc(c,dest,'triangle',f,t,dur,0.22*v,0.008,0.5);osc(c,dest,'sine',f*2,t,dur*0.6,0.05*v,0.008,0.25);}
