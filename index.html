<script>(function(){var S=window.screen;function g(){try{return +(JSON.parse(localStorage.getItem('kidsUI.v1')||'{}').scale)||1;}catch(e){return 1;}}var lw=-1;function fit(s){if(s==null)s=g();var m=document.querySelector('meta[name=viewport]');if(!m)return;var a=S.width,b=S.height,o=S.orientation&&S.orientation.type,w=o?(o.indexOf('landscape')===0?Math.max(a,b):Math.min(a,b)):a;lw=a;m.setAttribute('content',s===1?'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no':'width='+Math.round(w/s)+',initial-scale='+s+',minimum-scale='+s+',maximum-scale='+s+',user-scalable=no');}window.kidsFit=fit;fit();function chk(){if(S.width!==lw)fit();}window.addEventListener('orientationchange',function(){setTimeout(chk,300);});window.addEventListener('resize',chk);})();</script>
<script>(function(){var ss=window.speechSynthesis,vs=[],ko=null,keep=[];function load(){if(!ss)return;try{vs=ss.getVoices()||[];}catch(e){vs=[];}ko=null;for(var i=0;i<vs.length;i++){var l=String(vs[i].lang||'').toLowerCase().replace('_','-');if(l.indexOf('ko')===0&&(!ko||vs[i].localService))ko=vs[i];}}if(ss){load();try{ss.addEventListener('voiceschanged',load);}catch(e){ss.onvoiceschanged=load;}}window.kidsVoiceInfo=function(){load();return {api:!!ss,n:vs.length,ko:ko?ko.name+' ('+ko.lang+')':''};};window.kidsSpeak=function(t,rate){if(!ss)return;try{var busy=ss.speaking||ss.pending;if(busy)ss.cancel();if(!ko)load();var u=new SpeechSynthesisUtterance(String(t));u.lang=ko?ko.lang:'ko-KR';if(ko)u.voice=ko;u.rate=rate||0.95;u.volume=1;keep.push(u);if(keep.length>6)keep.shift();var go=function(){try{if(ss.paused)ss.resume();ss.speak(u);}catch(e){}};if(busy)setTimeout(go,150);else go();}catch(e){}};function unlock(){document.removeEventListener('pointerdown',unlock,true);try{if(ss&&!ss.speaking&&!ss.pending){var u=new SpeechSynthesisUtterance(' ');u.volume=0;keep.push(u);ss.speak(u);}}catch(e){}}document.addEventListener('pointerdown',unlock,true);})();</script>
<script>(function(){var K='kidsGate.v1';function p2(n){return (n<10?'0':'')+n;}function day(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}function prof(){try{var H=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0]||null;}catch(e){return null;}}function grade(){var p=prof();return (p&&p.grade)||'K';}function get(){var g={on:true,goal:15,day:'',sec:0,free:'',pin:'',done:0};try{var o=JSON.parse(localStorage.getItem(K)||'{}');for(var k in o)g[k]=o[k];}catch(e){}if(g.day!==day()){g.day=day();g.sec=0;g.done=0;}return g;}function put(g){try{localStorage.setItem(K,JSON.stringify(g));}catch(e){}}function study(){return grade()==='K'?['math','hangul']:['math'];}function page(){var m=String(location.pathname).match(/([A-Za-z0-9_-]+)\.html$/);return m?m[1]:'index';}function open(g){g=g||get();return !g.on||g.free===day()||g.sec>=g.goal*60;}function kind(n){n=n||page();return n==='index'?'hub':(study().indexOf(n)>=0?'study':'play');}window.kidsGate={get:get,put:put,open:open,study:study,kind:kind,day:day,grade:grade,prof:prof};var pg=page(),kd=kind(pg);if(kd==='play'&&!open()){location.replace('index.html#locked');return;}if(kd==='study'){var last=Date.now();['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){last=Date.now();},true);});setInterval(function(){if(document.visibilityState&&document.visibilityState!=='visible')return;if(Date.now()-last>60000)return;var g=get(),was=open(g);g.sec+=5;if(!was&&open(g)&&!g.done){g.done=1;put(g);toast();}else put(g);},5000);}function toast(){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:#2ecc71;color:#fff;font-family:Jua,sans-serif;font-size:24px;padding:12px 24px;border-radius:999px;box-shadow:0 6px 0 #22a35a;text-align:center;max-width:92vw';d.innerHTML='🎉 오늘 공부 목표 완료! 이제 놀이를 할 수 있어요';document.body.appendChild(d);setTimeout(function(){d.remove();},7000);try{if(window.kidsSpeak)kidsSpeak('오늘 공부 목표 완료! 이제 놀이를 할 수 있어요');}catch(e){}}})();</script>

<style>
:root{--bg:#fff8ec;--ink:#3b2f2a;--sub:#8a7a70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-weight:normal;font-size:42px;text-align:center;margin:10px 0 4px}
.sub{text-align:center;color:var(--sub);font-size:20px}
.total{display:flex;justify-content:center;gap:12px;margin:18px 0 22px;flex-wrap:wrap}
.profs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}.prof{font-family:inherit;font-size:24px;background:#fff;border:3px solid transparent;border-radius:999px;padding:8px 18px;box-shadow:0 3px 0 rgba(0,0,0,.07);color:#3b2f2a}.prof .pe{font-size:26px}.prof small{font-size:15px;color:#8a7a70;margin-left:6px}.prof.on{border-color:#ff9f43;background:#fff3e2}.prof.add{font-size:18px;color:#8a7a70}
.grs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.gr{font-family:inherit;font-size:20px;padding:12px 4px;border-radius:14px;border:3px solid #f1e6d8;background:#fff;color:#3b2f2a}.gr.on{border-color:#2ecc71;background:#eafaf1}.cx{background:#fff!important;color:#8a7a70!important;box-shadow:none!important;font-size:20px!important;margin-top:6px}

.em{font-size:80px;line-height:1.15}

.prog{font-size:19px;color:#5f544d;line-height:1.6}
.bar{height:12px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;margin:8px auto 0;max-width:240px}

.gate{background:#fff;border-radius:22px;padding:12px 16px;margin:10px auto 4px;max-width:720px;box-shadow:0 4px 0 #f1e6d8;font-size:22px;text-align:center}
.gate .gb{height:16px;background:#f1e6d8;border-radius:999px;overflow:hidden;margin:8px 0 4px}.gate .gb div{height:100%;background:linear-gradient(90deg,#4d96ff,#2ecc71);border-radius:999px}
.gate small{font-size:17px;color:#8a7a70}
.app.locked{filter:grayscale(.9);opacity:.55;position:relative}
.app .lk,.app .sb{position:absolute;top:8px;right:10px;font-size:26px}
.app .sb{font-size:15px;background:#4d96ff;color:#fff;border-radius:999px;padding:3px 10px;font-family:Jua,sans-serif}
.app{position:relative}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pinpad button{font-size:30px;padding:12px;background:#fff;color:#3b2f2a;box-shadow:0 4px 0 #f1e6d8;border:2px solid #f1e6d8}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:21px;padding:10px 0;border-bottom:2px dashed #f1e6d8;text-align:left}
.prow button{width:auto;font-size:20px;padding:8px 14px}
.prow .off{background:#adb5bd;box-shadow:0 4px 0 #868e96}
.panel button{font-family:inherit;font-size:26px;border:0;border-radius:20px;padding:14px;width:100%;background:#2ecc71;color:#fff;box-shadow:0 5px 0 #22a35a}
</style>

<script>
'use strict';
function get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad2(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function hasB(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
function sum(o){var s=0;for(var k in o)s+=o[k]||0;return s;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var GRN={K:'유치원','1':'1학년','2':'2학년','3':'3학년'},FACE=['🐣','🐥','🐻','🐰','🦊'];
function hub(){var H=get('kidsHub.v1');if(!H||!H.profiles||!H.profiles.length){var M0=get('kidsMath.v1')||{},nm=(M0.settings&&M0.settings.name)||'';H={profiles:nm?[{id:'p1',name:nm,grade:'2'}]:[],cur:'p1'};if(nm)put('kidsHub.v1',H);}return H;}
function curProf(H){return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0];}
function mathKey(id){return id==='p1'?'kidsMath.v1':'kidsMath.v1.'+id;}
function render(){
  var HB=hub(),PF=curProf(HB);
  var M=(PF?get(mathKey(PF.id)):null)||{},Z=get('kidsMaze.v1')||{},H=get('kidsHidden.v2')||{},Q=get('kidsMemory.v1')||{};var HP=get('kidsHospital.v1')||{};var CK=get('kidsClock.v1')||{};
  var name=PF?PF.name:'';
  var mStars=M.stars||0,mSt=(M.stickers||[]).length,ss=M.session,tod=ss&&ss.date===today()?ss:null,daily=(M.settings&&M.settings.daily)||(PF&&({K:10,'1':15})[PF.grade])||20;
  var mDone=tod?(tod.done?tod.items.length:tod.idx):0,mTot=tod?tod.items.length:daily;
  var zU=Z.unlocked||{easy:1,normal:1,hard:1},zClear=(zU.easy-1)+(zU.normal-1)+(zU.hard-1),zStars=0;if(Z.best)for(var d in Z.best)for(var s in Z.best[d])zStars+=Z.best[d][s].s||0;
  var hU=H.unlocked||{find:1,diff:1},hClear=(hU.find-1)+(hU.diff-1),hStars=0;if(H.best)for(var m in H.best)hStars+=sum(H.best[m]);
  var qStars=0,qDone=0;if(Q.best)for(var q in Q.best){qStars+=Q.best[q].s||0;qDone++;}
  var ckS=0;if(CK.best)for(var cb in CK.best)ckS+=CK.best[cb]||0;
  var RB=get('kidsRobot.v1')||{},rbS=0,rbDone=0;if(RB.best)for(var rb in RB.best){rbS+=RB.best[rb]||0;rbDone++;}
  var PZ=get('kidsPuzzle.v1')||{},pzS=0,pzPics={};if(PZ.best)for(var pz in PZ.best){pzS+=PZ.best[pz]||0;pzPics[pz.split('_')[0]]=1;}if(PZ.slide)for(var sl in PZ.slide)pzS+=(PZ.slide[sl]&&PZ.slide[sl].s)||0;var pzDone=Object.keys(pzPics).length;
  var SD0=get('kidsSudoku.v1')||{},sdT=0;if(SD0.best)for(var sk0 in SD0.best)sdT+=SD0.best[sk0]||0;
  var HG0=get('kidsHangul.v1')||{},hgT0=0;if(HG0.best)for(var hk0 in HG0.best)hgT0+=HG0.best[hk0]||0;
  var total=mStars+zStars+hStars+qStars+ckS+rbS+pzS+sdT+hgT0;
  var who=name?esc(name)+(hasB(name)?'이의':'의'):'우리 아이';
  var h='<h1>🎈 '+who+' 놀이터</h1><div class="sub">오늘은 무엇을 하고 놀까요?</div>';
  if(HB.profiles.length){h+='<div class="profs">';HB.profiles.forEach(function(x,i){h+='<button class="prof'+(PF&&x.id===PF.id?' on':'')+'" onclick="pickProf(\''+x.id+'\')"><span class="pe">'+FACE[i%FACE.length]+'</span> '+esc(x.name)+'<small>'+GRN[x.grade]+'</small></button>';});h+='<button class="prof add" onclick="editProf()">✏️ 이름·학년 바꾸기</button></div>';}
  h+='<div class="total"><span class="chip">⭐ 모은 별 '+total+'개</span><span class="chip">🎁 스티커 '+mSt+'개</span></div>';h+=gateBanner();h+='<div class="apps">';
  h+='<a class="app" href="math.html" style="background:#ffe8c9"><div class="em">🦉</div><div class="name">수학 놀이터</div><div class="prog">'+(tod&&tod.done?'오늘 문제 다 풀었어요! 🎉':'오늘 문제 '+mDone+' / '+mTot)+'<br>⭐ '+mStars+'</div><div class="bar"><div style="width:'+Math.round(mDone/mTot*100)+'%"></div></div></a>';
  h+='<a class="app" href="maze.html" style="background:#e5e0ff"><div class="em">🧭</div><div class="name">미로 탐험대</div><div class="prog">깬 스테이지 '+zClear+' / 30<br>⭐ '+zStars+'</div><div class="bar"><div style="width:'+Math.round(zClear/30*100)+'%"></div></div></a>';
  h+='<a class="app" href="hidden.html" style="background:#e3f3ea"><div class="em">🔎</div><div class="name">숨은그림 탐정</div><div class="prog">깬 스테이지 '+hClear+' / 20<br>⭐ '+hStars+'</div><div class="bar"><div style="width:'+Math.round(hClear/20*100)+'%"></div></div></a>';
  h+='<a class="app" href="memory.html" style="background:#ffe0ec"><div class="em">🃏</div><div class="name">짝 맞추기</div><div class="prog">깬 난이도 '+qDone+' / 4<br>⭐ '+qStars+'</div><div class="bar"><div style="width:'+Math.round(qDone/4*100)+'%"></div></div></a>';
  h+='<a class="app" href="hospital.html" style="background:#d9f2ee"><div class="em">🏥</div><div class="name">동물 병원</div><div class="prog">치료한 환자 '+(HP.healed||0)+'명<br>고친 병 '+Object.keys(HP.kinds||{}).length+' / 12</div><div class="bar"><div style="width:'+Math.round(Object.keys(HP.kinds||{}).length/12*100)+'%"></div></div></a>';
  h+='<a class="app" href="clock.html" style="background:#e3e9ff"><div class="em">🕐</div><div class="name">시계 놀이</div><div class="prog">열린 단계 '+(CK.unlocked||1)+' / 5<br>⭐ '+ckS+'</div><div class="bar"><div style="width:'+Math.round((CK.unlocked||1)/5*100)+'%"></div></div></a>';
  var CL=get('kidsColor.v1')||{},clN=(CL.gallery||[]).length;
  h+='<a class="app" href="coloring.html" style="background:#ffe3ee"><div class="em">🎨</div><div class="name">색칠 놀이</div><div class="prog">내 작품 '+clN+'개<br>🖍️ 그림 20가지</div></a>';
  var SD=get('kidsSudoku.v1')||{},sdS=0;if(SD.best)for(var sk in SD.best)sdS+=SD.best[sk]||0;
  var HG=get('kidsHangul.v1')||{},hgT=Object.keys(HG.trace||{}).length,hgS=0;if(HG.best)for(var hk in HG.best)hgS+=HG.best[hk]||0;
  h+='<a class="app" href="hangul.html" style="background:#e5dbff"><div class="em"><span style="font-family:Jua,sans-serif;font-size:.85em;display:inline-flex;align-items:center;justify-content:center;background:#7950f2;color:#fff;border-radius:22%;width:1.1em;height:1.1em;line-height:1">가</span></div><div class="name">한글 놀이</div><div class="prog">따라 쓴 글자 '+hgT+' / 24<br>⭐ '+hgS+'</div><div class="bar"><div style="width:'+Math.round(hgT/24*100)+'%"></div></div></a>';
  h+='<a class="app" href="sudoku.html" style="background:#fff3bf"><div class="em">🔢</div><div class="name">그림 스도쿠</div><div class="prog">푼 판 '+(SD.solved||0)+'개<br>⭐ '+sdS+'</div></a>';
  h+='<a class="app" href="puzzle.html" style="background:#d3f9d8"><div class="em">🧩</div><div class="name">퍼즐 놀이</div><div class="prog">완성한 그림 '+pzDone+' / 40<br>⭐ '+pzS+'</div><div class="bar"><div style="width:'+Math.round(pzDone/40*100)+'%"></div></div></a>';
  h+='<a class="app" href="robot.html" style="background:#dff3ff"><div class="em">🤖</div><div class="name">로봇 코딩</div><div class="prog">깬 판 '+rbDone+' / 38<br>⭐ '+rbS+'</div><div class="bar"><div style="width:'+Math.round(rbDone/38*100)+'%"></div></div></a>';
  h+='</div><div class="foot"><button onclick="sizePanel()">📐 화면 크기 '+Math.round(uiScale()*100)+'%</button> <button onclick="voicePanel()">🗣️ 소리 확인</button> <button onclick="parentOpen()">🔐 부모 설정</button></div>';
  h=gateCards(h);
  document.getElementById('app').innerHTML=h;
  if(!PF&&!render.asked){render.asked=true;editProf(true);}
}
function uiScale(){var U=get('kidsUI.v1')||{};return +U.scale||1;}
function sizePanel(){
  var STEPS=[0.6,0.7,0.8,0.9,1,1.1,1.2,1.3],o=document.createElement('div');o.className='overlay';
  function idx(){var s=uiScale(),b=0;STEPS.forEach(function(v,i){if(Math.abs(v-s)<Math.abs(STEPS[b]-s))b=i;});return b;}
  function setS(v){var U=get('kidsUI.v1')||{};U.scale=v;put('kidsUI.v1',U);if(window.kidsFit)window.kidsFit(v);draw();}
  function draw(){var i=idx();o.innerHTML='<div class="panel"><div style="font-size:56px">📐</div><div style="font-size:26px">화면 크기</div><div style="font-size:17px;color:#8a7a70;margin:6px 0 12px">글씨·버튼이 화면에 다 들어오게 맞춰요.<br>모든 놀이에 똑같이 적용돼요.</div>'+
    '<div style="display:flex;gap:10px;align-items:center"><button id="dn" style="flex:1;width:auto;background:#5c7cfa;box-shadow:0 5px 0 #3b5bdb'+(i===0?';opacity:.4':'')+'">－ 작게</button><div style="font-size:34px;min-width:100px">'+Math.round(STEPS[i]*100)+'%</div><button id="up" style="flex:1;width:auto;background:#ff9f43;box-shadow:0 5px 0 #e67e22'+(i===STEPS.length-1?';opacity:.4':'')+'">＋ 크게</button></div>'+
    '<button id="ok" style="margin-top:16px">좋아요</button><button id="rs" class="cx">보통(100%)으로</button></div>';
    o.querySelector('#dn').onclick=function(){if(i>0)setS(STEPS[i-1]);};
    o.querySelector('#up').onclick=function(){if(i<STEPS.length-1)setS(STEPS[i+1]);};
    o.querySelector('#rs').onclick=function(){setS(1);};
    o.querySelector('#ok').onclick=function(){o.remove();render();};}
  draw();document.body.appendChild(o);
}
function voicePanel(){
  var o=document.createElement('div');o.className='overlay';document.body.appendChild(o);
  function draw(){var I=window.kidsVoiceInfo?kidsVoiceInfo():{api:false,n:0,ko:''},st;
    if(!I.api)st='<div style="color:#e03131">이 브라우저는 읽어주기를 지원하지 않아요.</div>';
    else if(I.ko)st='<div style="color:#2b8a3e">✅ 한국어 음성이 있어요<br><small>'+I.ko+'</small></div><div style="font-size:16px;color:#8a7a70;margin-top:6px">그래도 안 들리면 태블릿 <b>미디어 볼륨</b>을 올려 보세요.</div>';
    else st='<div style="color:#e03131">⚠️ 한국어 음성을 찾지 못했어요 (음성 '+I.n+'개)</div><div style="font-size:16px;text-align:left;margin-top:8px;line-height:1.6">태블릿 <b>설정 → 일반 → 언어 및 입력 방식 → 텍스트 음성 변환(TTS)</b>에서<br>① 기본 엔진을 <b>삼성 TTS</b>나 <b>Google 음성 서비스</b>로 고르고<br>② 언어를 <b>한국어</b>로 정한 뒤 음성 데이터를 내려받아요.<br>그다음 놀이터 앱을 껐다 켜 주세요.</div>';
    o.innerHTML='<div class="panel"><div style="font-size:56px">🗣️</div><div style="font-size:26px">읽어주기 소리 확인</div><div style="font-size:20px;margin:10px 0">'+st+'</div><button id="tt">🔊 들어 보기</button><button id="ok" class="cx">닫기</button></div>';
    o.querySelector('#tt').onclick=function(){if(window.kidsSpeak)kidsSpeak('안녕하세요! 읽어주기 소리가 잘 들리나요?',0.95);setTimeout(draw,800);};
    o.querySelector('#ok').onclick=function(){o.remove();};}
  draw();setTimeout(draw,700);
}

function gateStudyName(){return kidsGate.study().map(function(n){return n==='math'?'수학':'한글';}).join('·');}
function gateBanner(){if(!window.kidsGate)return '';var g=kidsGate.get();if(!g.on)return '';
  if(g.free===kidsGate.day())return '<div class="gate">🎈 오늘은 자유 놀이 날!</div>';
  var m=Math.floor(g.sec/60);
  if(kidsGate.open(g))return '<div class="gate">🎉 오늘 공부 완료! ('+m+'분) 놀이를 마음껏 해요</div>';
  var pct=Math.min(100,Math.round(g.sec/(g.goal*60)*100));
  return '<div class="gate">📚 오늘 공부 <b>'+m+'</b> / '+g.goal+'분<div class="gb"><div style="width:'+pct+'%"></div></div><small>'+gateStudyName()+'을 '+g.goal+'분 하면 🔒 놀이가 열려요</small></div>';}
function gateCards(h){if(!window.kidsGate)return h;var g=kidsGate.get(),open=kidsGate.open(g);
  return h.replace(/<a class="app" href="([A-Za-z0-9_-]+)\.html"([^>]*)>/g,function(m0,n,rest){var k=kidsGate.kind(n);
    if(k==='study'&&g.on)return '<a class="app" href="'+n+'.html"'+rest+'><span class="sb">📚 공부</span>';
    if(k==='play'&&!open)return '<a class="app locked" href="#" onclick="lockMsg();return false;"'+rest+'><span class="lk">🔒</span>';
    return m0;});}
function lockMsg(){var g=kidsGate.get(),left=Math.max(1,Math.ceil((g.goal*60-g.sec)/60)),o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="panel"><div style="font-size:60px">🔒</div><div style="font-size:26px;margin:6px 0">놀이는 공부를 마치면 열려요</div><div style="font-size:21px;color:#8a7a70">'+gateStudyName()+'을 <b>'+left+'분</b> 더 하면 열려요!</div><button id="gm" style="margin-top:14px">📚 공부하러 가기</button><button class="cx" id="cl">닫기</button></div>';
  document.body.appendChild(o);o.querySelector('#gm').onclick=function(){location.href=kidsGate.study()[0]+'.html';};o.querySelector('#cl').onclick=function(){o.remove();};
  if(window.kidsSpeak)kidsSpeak(gateStudyName()+' 공부를 '+left+'분 더 하면 놀이가 열려요');}
// ----- 부모 비밀번호 (수학 놀이터와 같은 번호) -----
function mathPinKey(){var HB=hub(),PF=curProf(HB);return PF?mathKey(PF.id):'kidsMath.v1';}
function curPin(){var g=kidsGate.get();if(g.pin)return g.pin;var M=get(mathPinKey());return (M&&M.settings&&M.settings.pin)||'';}
function savePin(p){var g=kidsGate.get();g.pin=p;kidsGate.put(g);var k=mathPinKey(),M=get(k);if(M&&M.settings){M.settings.pin=p;put(k,M);}}
function parentOpen(change){var cur=change?'':curPin(),st={buf:'',first:''},o=document.createElement('div');o.className='overlay';document.body.appendChild(o);
  function draw(msg){var setting=!cur,title=setting?(st.first?'한 번 더 입력해 주세요':'부모 비밀번호 4자리를 정해 주세요'):'부모 비밀번호를 입력하세요',dots='';for(var i=0;i<4;i++)dots+=i<st.buf.length?'●':'○';
    var keys=['1','2','3','4','5','6','7','8','9','닫기','0','⌫'];
    o.innerHTML='<div class="panel"><div style="font-size:26px">🔐 '+title+'</div><div style="font-size:16px;color:#8a7a70">수학 놀이터 부모 화면과 같은 번호예요</div><div style="font-size:40px;letter-spacing:12px;margin:10px 0">'+dots+'</div>'+(msg?'<div style="color:#e03131;font-size:18px">'+msg+'</div>':'')+'<div class="pinpad">'+keys.map(function(k){return '<button data-k="'+k+'">'+k+'</button>';}).join('')+'</div></div>';
    Array.prototype.forEach.call(o.querySelectorAll('.pinpad button'),function(b){b.onclick=function(){press(b.getAttribute('data-k'));};});}
  function press(k){if(k==='닫기'){o.remove();return;}if(k==='⌫'){st.buf=st.buf.slice(0,-1);draw();return;}if(st.buf.length>=4)return;st.buf+=k;draw();
    if(st.buf.length<4)return;
    setTimeout(function(){if(!cur){if(!st.first){st.first=st.buf;st.buf='';draw();}else if(st.first===st.buf){savePin(st.buf);o.remove();parentPanel();}else{st={buf:'',first:''};draw('두 번 입력한 번호가 달라요. 다시 정해 주세요');}}
      else if(st.buf===cur){o.remove();parentPanel();}else{st.buf='';draw('번호가 달라요');}},150);}
  draw();}
function parentPanel(){var o=document.createElement('div');o.className='overlay';document.body.appendChild(o);
  function row(label,val,btns){return '<div class="prow"><span>'+label+'</span><span style="display:flex;gap:6px;align-items:center">'+val+btns+'</span></div>';}
  function draw(){var g=kidsGate.get(),td=kidsGate.day(),m=Math.floor(g.sec/60),s=g.sec%60,HB=hub(),PF=curProf(HB);
    var h='<div class="panel" style="max-width:520px"><div style="font-size:28px;margin-bottom:6px">🔐 부모 설정</div>';
    h+=row('📚 공부 먼저 하기','',' <button id="on" class="'+(g.on?'':'off')+'">'+(g.on?'켬':'끔')+'</button>');
    h+=row('🎯 하루 공부 목표','<b style="font-size:24px;white-space:nowrap">'+g.goal+'분</b>',' <button id="dn">－</button><button id="up">＋</button>');
    h+=row('⏱️ 오늘 공부한 시간','<b>'+m+'분 '+s+'초</b>','');
    h+=row('🎈 오늘만 자유 놀이','',' <button id="fr" class="'+(g.free===td?'':'off')+'">'+(g.free===td?'켬':'끔')+'</button>');
    h+='<div style="font-size:17px;color:#8a7a70;text-align:left;margin-top:10px;line-height:1.5">• 공부로 치는 놀이: <b>'+gateStudyName()+'</b> ('+(PF?GRN[PF.grade]:'유치원')+' 기준. 유치원은 수학·한글, 1학년부터는 수학만)<br>• 공부 화면을 보면서 1분 안에 한 번이라도 누른 시간만 셉니다.<br>• 목표를 채우면 그날은 놀이가 모두 열려요.</div>';
    h+='<button id="pw" style="margin-top:12px;background:#fff;color:#3b2f2a;box-shadow:0 4px 0 #f1e6d8;border:2px solid #f1e6d8">🔑 비밀번호 바꾸기</button><button id="cl" style="margin-top:10px">닫기</button></div>';
    o.innerHTML=h;
    o.querySelector('#on').onclick=function(){var g2=kidsGate.get();g2.on=!g2.on;kidsGate.put(g2);draw();};
    o.querySelector('#dn').onclick=function(){var g2=kidsGate.get();g2.goal=Math.max(5,g2.goal-5);kidsGate.put(g2);draw();};
    o.querySelector('#up').onclick=function(){var g2=kidsGate.get();g2.goal=Math.min(90,g2.goal+5);kidsGate.put(g2);draw();};
    o.querySelector('#fr').onclick=function(){var g2=kidsGate.get();g2.free=g2.free===td?'':td;kidsGate.put(g2);draw();};
    o.querySelector('#pw').onclick=function(){o.remove();parentOpen(true);};
    o.querySelector('#cl').onclick=function(){o.remove();render();};}
  draw();}
if(location.hash==='#locked'){setTimeout(function(){try{history.replaceState(null,'',location.pathname);}catch(e){}if(window.kidsGate&&!kidsGate.open())lockMsg();},300);}
function pickProf(id){var H=hub();H.cur=id;put('kidsHub.v1',H);render();}
function editProf(isNew){
  var H=hub(),P=isNew?null:curProf(H),g=P?P.grade:(H.profiles.length?'K':'2');
  var o=document.createElement('div');o.className='overlay';
  function draw(){o.innerHTML='<div class="panel"><div style="font-size:56px">'+(isNew?'👋':'✏️')+'</div><div style="font-size:26px">'+(isNew?'놀이터에 올 아이를 알려 주세요':'이름·학년 바꾸기')+'</div><input id="nm" maxlength="8" value="'+esc(P?P.name:(o.nm||''))+'" placeholder="이름 (예: 하늘)"><div style="font-size:18px;color:#8a7a70;margin:4px 0 8px">수학 문제 학년</div><div class="grs">'+
    ['K','1','2','3'].map(function(k){return '<button class="gr'+(g===k?' on':'')+'" data-g="'+k+'">'+GRN[k]+'</button>';}).join('')+'</div><button id="ok">좋아요</button>'+(H.profiles.length||!isNew?'<button id="cx" class="cx">취소</button>':'')+(!isNew?'<button id="addk" class="cx" style="font-size:16px!important">＋ 다른 아이 추가하기</button>':'')+'</div>';
    Array.prototype.forEach.call(o.querySelectorAll('.gr'),function(b){b.onclick=function(){o.nm=o.querySelector('#nm').value;if(P)P.name=o.nm;g=b.getAttribute('data-g');draw();};});
    var cx=o.querySelector('#cx');if(cx)cx.onclick=function(){o.remove();};
    var ak=o.querySelector('#addk');if(ak)ak.onclick=function(){o.remove();editProf(true);};
    o.querySelector('#ok').onclick=function(){var v=o.querySelector('#nm').value.trim();if(!v){o.querySelector('#nm').focus();return;}
      if(isNew){var id=H.profiles.length?'p'+Date.now().toString(36):'p1';H.profiles.push({id:id,name:v,grade:g});H.cur=id;}
      else{var gChanged=P.grade!==g;P.name=v;P.grade=g;var M2=get(mathKey(P.id));if(M2){M2.settings=M2.settings||{};M2.settings.name=v;if(gChanged){delete M2.levels;M2.session=null;M2.review=[];}put(mathKey(P.id),M2);}}
      put('kidsHub.v1',H);o.remove();render();};}
  draw();document.body.appendChild(o);
}
render();
window.addEventListener('pageshow',render);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
</script>
