<script>(function(){var ss=window.speechSynthesis,vs=[],ko=null,en=null,es=-1,keep=[];function load(){if(!ss)return;try{vs=ss.getVoices()||[];}catch(e){vs=[];}ko=null;en=null;es=-1;for(var i=0;i<vs.length;i++){var l=String(vs[i].lang||'').toLowerCase().replace('_','-');if(l.indexOf('ko')===0&&(!ko||vs[i].localService))ko=vs[i];if(l.indexOf('en')===0){var s=(l.indexOf('en-us')===0?2:0)+(vs[i].localService?1:0);if(s>es){en=vs[i];es=s;}}}}if(ss){load();try{ss.addEventListener('voiceschanged',load);}catch(e){ss.onvoiceschanged=load;}}window.kidsVoiceInfo=function(){load();return {api:!!ss,n:vs.length,ko:ko?ko.name+' ('+ko.lang+')':'',en:en?en.name+' ('+en.lang+')':''};};window.kidsSpeak=function(t,rate,lang){if(!ss)return;try{var busy=ss.speaking||ss.pending;if(busy)ss.cancel();if(!ko||!en)load();var E=lang==='en',v=E?en:ko,u=new SpeechSynthesisUtterance(String(t));u.lang=v?v.lang:(E?'en-US':'ko-KR');if(v)u.voice=v;u.rate=rate||0.95;u.volume=1;keep.push(u);if(keep.length>6)keep.shift();var go=function(){try{if(ss.paused)ss.resume();ss.speak(u);}catch(e){}};if(busy)setTimeout(go,150);else go();}catch(e){}};function unlock(){document.removeEventListener('pointerdown',unlock,true);try{if(ss&&!ss.speaking&&!ss.pending){var u=new SpeechSynthesisUtterance(' ');u.volume=0;keep.push(u);ss.speak(u);}}catch(e){}}document.addEventListener('pointerdown',unlock,true);})();</script>
<script>(function(){var K='kidsGate.v1';function p2(n){return (n<10?'0':'')+n;}function day(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}function prof(){try{var H=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0]||null;}catch(e){return null;}}function grade(){var p=prof();return (p&&p.grade)||'K';}var FB='';try{FB=localStorage.getItem('kidsFB')||FB;}catch(e){}function get(){var g={on:true,goal:15,day:'',cnt:0,free:'',pin:'',done:0,kinds:{},lock:'',until:0};try{var o=JSON.parse(localStorage.getItem(K)||'{}');for(var k in o)g[k]=o[k];}catch(e){}if(g.goal>60&&!g.v2)g.goal=15;g.v2=1;if(!g.kinds)g.kinds={};if(g.day!==day()){g.day=day();g.cnt=0;g.done=0;}return g;}function sv(g){try{localStorage.setItem(K,JSON.stringify(g));}catch(e){}}function put(g){sv(g);sched();}function lockOn(g){g=g||get();return g.lock&&(!g.until||Date.now()<g.until)?g.lock:'';}function defStudy(n){return grade()==='K'?(n==='math'||n==='hangul'||n==='english'):(n==='math'||n==='english');}function page(){var m=String(location.pathname).match(/([A-Za-z0-9_-]+)\.html$/);return m?m[1]:'index';}function kind(n,g){n=n||page();if(n==='index')return 'hub';g=g||get();var k=g.kinds[n];if(k==='study'||k==='play')return k;return defStudy(n)?'study':'play';}function study(g){g=g||get();return GAMES.filter(function(x){return kind(x[0],g)==='study';}).map(function(x){return x[0];});}function open(g){g=g||get();if(lockOn(g))return false;return !g.on||g.free===day()||g.cnt>=g.goal||!study(g).length;}var GAMES=[['math','수학'],['hangul','한글'],['english','영어'],['robot','로봇 코딩'],['sudoku','스도쿠'],['clock','시계'],['puzzle','퍼즐'],['maze','미로'],['hidden','숨은그림'],['memory','짝 맞추기'],['hospital','동물 병원'],['coloring','색칠'],['piano','건반']];function add(n){try{n=n||1;if(kind()!=='study')return;var g=get(),was=open(g);g.cnt+=n;var now=open(g);if(!was&&now&&!g.done){g.done=1;put(g);toast();}else put(g);}catch( var CF=['on','goal','free','kinds','lock','until'];function sig(g){var c={},ks=Object.keys(g.kinds||{}).sort(),kk={};ks.forEach(function(k){kk[k]=g.kinds[k];});CF.forEach(function(k){c[k]=k==='kinds'?kk:g[k];});return JSON.stringify(c);}
function url(g,p){return FB+'/fam/'+g.fam+'/dev/'+g.dev+(p?'/'+p:'')+'.json';}

function push(){var g=get();if(!FB||!g.fam)return;var s=sig(g);if(s!==g.sg){if(g.pend!==s){g.pend=s;g.ct=Date.now();sv(g);}var c=JSON.parse(s);c.t=g.ct;c.by='tab';if(g.rs)c.reset=g.rs;req('PUT',url(g,'cfg'),c,function(ok){if(!ok)return;var g3=get();if(sig(g3)===s){g3.sg=s;sv(g3);}});}
  var P=prof();req('PUT',url(g,'st'),{name:P?P.name:'',grade:grade(),cnt:g.cnt,goal:g.goal,day:g.day,page:page(),at:Date.now(),ct:g.ct||0,study:study(g),open:open(g),lock:lockOn(g)});}
function apply(c){var g=get();CF.forEach(function(k){if(k==='kinds')g.kinds=c.kinds||{};else if(c[k]!==undefined)g[k]=c[k];else g[k]=k==='lock'||k==='free'?'':(k==='until'?0:g[k]);});
  if(c.reset&&c.reset===day()&&g.rs!==c.reset){g.cnt=0;g.done=0;}if(c.reset)g.rs=c.reset;g.ct=c.t;g.sg=sig(g);sv(g);return g;}

  if(d&&d.bye){g2.fam='';g2.sg='';sv(g2);return;}
  if(d&&d.cfg&&d.cfg.t>(g2.ct||0)){g2=apply(d.cfg);if(blocked(g2)){location.replace('index.html#locked');return;}if(window.kidsRemote)try{window.kidsRemote();}catch(e){}}
  else if(!d||!d.cfg)g2.sg='';sv(g2);push();});}

if(FB){setTimeout(pull,600);setInterval(pull,20000);document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});}function toast(){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:#2ecc71;color:#fff;font-family:Jua,sans-serif;font-size:24px;padding:12px 24px;border-radius:999px;box-shadow:0 6px 0 #22a35a;text-align:center;max-width:92vw';d.innerHTML='🎉 오늘 공부 목표 완료! 이제 놀이를 할 수 있어요';document.body.appendChild(d);setTimeout(function(){d.remove();},7000);try{if(window.kidsSpeak)setTimeout(function(){kidsSpeak('오늘 공부 목표 완료! 이제 놀이를 할 수 있어요');},1500);}catch(e){}}})();</script>

<style>

<script>
'use strict';
function get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad2(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function hasB(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
function sum(o){var s=0;for(var k in o)s+=o[k]||0;return s;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var GRN={K:'유치원','1':'1학년','2':'2학년','3':'3학년','4':'4학년','5':'5학년','6':'6학년'},FACE=['🐣','🐥','🐻','🐰','🦊'];
function hub(){var H=get('kidsHub.v1');if(!H||!H.profiles||!H.profiles.length){var M0=get('kidsMath.v1')||{},nm=(M0.settings&&M0.settings.name)||'';H={profiles:nm?[{id:'p1',name:nm,grade:'2'}]:[],cur:'p1'};if(nm)put('kidsHub.v1',H);}return H;}

function mathKey(id){return id==='p1'?'kidsMath.v1':'kidsMath.v1.'+id;}
function render(){
  var HB=hub(),PF=curProf(HB);
  var M=(PF?get(mathKey(PF.id)):null)||{},Z=get('kidsMaze.v1')||{},H=get('kidsHidden.v2')||{},Q=get('kidsMemory.v1')||{};var HP=get('kidsHospital.v1')||{};var CK=get('kidsClock.v1')||{};
  var name=PF?PF.name:'';

  var mDone=tod?(tod.done?tod.items.length:tod.idx):0,mTot=tod?tod.items.length:daily;
  var zU=Z.unlocked||{easy:1,normal:1,hard:1},zClear=['easy','normal','hard','master','legend'].reduce(function(s,k){return s+Math.max(0,Math.min(10,(zU[k]||1)-1));},0),zStars=0;if(Z.best)for(var d in Z.best)for(var s in Z.best[d])zStars+=Z.best[d][s].s||0;
  var hU=H.unlocked||{find:1,diff:1},hClear=(hU.find-1)+(hU.diff-1),hStars=0;if(H.best)for(var m in H.best)hStars+=sum(H.best[m]);

  var RB=get('kidsRobot.v1')||{},rbS=0,rbDone=0;if(RB.best)for(var rb in RB.best){rbS+=RB.best[rb]||0;rbDone++;}
  var PZ=get('kidsPuzzle.v1')||{},pzS=0,pzPics={};if(PZ.best)for(var pz in PZ.best){pzS+=PZ.best[pz]||0;pzPics[pz.split('_')[0]]=1;}if(PZ.slide)for(var sl in PZ.slide)pzS+=(PZ.slide[sl]&&PZ.slide[sl].s)||0;var pzDone=Object.keys(pzPics).length;
  var SD0=get('kidsSudoku.v1')||{},sdT=0;if(SD0.best)for(var sk0 in SD0.best)sdT+=SD0.best[sk0]||0;
  var HG0=get('kidsHangul.v1')||{},hgT0=0;if(HG0.best)for(var hk0 in HG0.best)hgT0+=HG0.best[hk0]||0;
  var PN0=get('kidsPiano.v1')||{},pnT=0;if(PN0.best)for(var pk0 in PN0.best)pnT+=PN0.best[pk0]||0;
  var EN0=get('kidsEnglish.v1')||{},enT0=0;if(EN0.best)for(var ek0 in EN0.best)enT0+=EN0.best[ek0]||0;

  h+='<div class="total"><span class="chip">⭐ 모은 별 '+total+'개</span><span class="chip">🎁 스티커 '+mSt+'개</span></div>';h+=gateBanner();h+='<div class="apps">';
  h+='<a class="app" href="math.html" style="background:#ffe8c9"><div class="em">🦉</div><div class="name">수학 놀이터</div><div class="prog">'+(tod&&tod.done?'오늘 문제 다 풀었어요! 🎉':'오늘 문제 '+mDone+' / '+mTot)+'<br>⭐ '+mStars+'</div><div class="bar"><div style="width:'+Math.round(mDone/mTot*100)+'%"></div></div></a>';

  h+='<a class="app" href="hidden.html" style="background:#e3f3ea"><div class="em">🔎</div><div class="name">숨은그림 탐정</div><div class="prog">깬 스테이지 '+hClear+' / 20<br>⭐ '+hStars+'</div><div class="bar"><div style="width:'+Math.round(hClear/20*100)+'%"></div></div></a>';

  h+='<a class="app" href="clock.html" style="background:#e3e9ff"><div class="em">🕐</div><div class="name">시계 놀이</div><div class="prog">열린 단계 '+(CK.unlocked||1)+' / 5<br>⭐ '+ckS+'</div><div class="bar"><div style="width:'+Math.round((CK.unlocked||1)/5*100)+'%"></div></div></a>';

    o.querySelector('#df').onclick=function(){upd(function(g2){g2.kinds={};});};
    o.querySelector('#pw').onclick=function(){o.remove();parentOpen(true);};
    o.querySelector('#cl').onclick=function(){o.remove();render();};}
  draw();}
if(location.hash==='#locked'){setTimeout(function(){try{history.replaceState(null,'',location.pathname);}catch(e){}if(window.kidsGate&&(!kidsGate.open()||kidsGate.lockOn()))lockMsg();},300);}
window.kidsRemote=function(){if(!document.querySelector('.overlay'))render();};
function pickProf(id){var H=hub();H.cur=id;put('kidsHub.v1',H);render();}
function editProf(isNew){
  var H=hub(),P=isNew?null:curProf(H),g=P?P.grade:(H.profiles.length?'K':'2');
  var o=document.createElement('div');o.className='overlay';
  function draw(){o.innerHTML='<div class="panel"><div style="font-size:56px">'+(isNew?'👋':'✏️')+'</div><div style="font-size:26px">'+(isNew?'놀이터에 올 아이를 알려 주세요':'이름·학년 바꾸기')+'</div><input id="nm" maxlength="8" value="'+esc(P?P.name:(o.nm||''))+'" placeholder="이름 (예: 하늘)"><div style="font-size:18px;color:#8a7a70;margin:4px 0 8px">수학 문제 학년</div><div class="grs">'+
    ['K','1','2','3','4','5','6'].map(function(k){return '<button class="gr'+(g===k?' on':'')+'" data-g="'+k+'">'+GRN[k]+'</button>';}).join('')+'</div><button id="ok">좋아요</button>'+(H.profiles.length||!isNew?'<button id="cx" class="cx">취소</button>':'')+(!isNew?'<button id="addk" class="cx" style="font-size:16px!important">＋ 다른 아이 추가하기</button>':'')+'</div>';
    Array.prototype.forEach.call(o.querySelectorAll('.gr'),function(b){b.onclick=function(){o.nm=o.querySelector('#nm').value;if(P)P.name=o.nm;g=b.getAttribute('data-g');draw();};});
    var cx=o.querySelector('#cx');if(cx)cx.onclick=function(){o.remove();};
    var ak=o.querySelector('#addk');if(ak)ak.onclick=function(){o.remove();editProf(true);};
    o.querySelector('#ok').onclick=function(){var v=o.querySelector('#nm').value.trim();if(!v){o.querySelector('#nm').focus();return;}
      if(isNew){var id=H.profiles.length?'p'+Date.now().toString(36):'p1';H.profiles.push({id:id,name:v,grade:g});H.cur=id;}
      else{var gChanged=P.grade!==g;P.name=v;P.grade=g;var M2=get(mathKey(P.id));if(M2){M2.settings=M2.settings||{};M2.settings.name=v;if(gChanged){delete M2.levels;M2.session=null;M2.review=[];}put(mathKey(P.id),M2);}}
      put('kidsHub.v1',H);o.remove();render();};}
  draw();document.body.appendChild(o);
}
render();
window.addEventListener('pageshow',render);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
</script>
