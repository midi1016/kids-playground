<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4db6ac">
<title>동물 병원</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf7f5;--ink:#27403c;--sub:#6e8a85;--main:#26a69a;--main-d:#1b7f75;--line:#cfe9e4;--warn:#ff8a65}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#app{height:100%;max-width:1150px;margin:0 auto;display:flex;flex-direction:column;padding:14px;overflow-y:auto}
h1{font-weight:normal;font-size:44px;text-align:center;margin:8px 0 2px}
h2{font-weight:normal;font-size:26px;text-align:center;margin:18px 0 10px}
.sub{text-align:center;color:var(--sub);font-size:19px;line-height:1.5}
.row{display:grid;gap:12px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.r4{grid-template-columns:repeat(2,1fr)}}
.opt{background:#fff;border-radius:22px;padding:14px 8px;font-size:23px;box-shadow:0 5px 0 var(--line);border:4px solid transparent;text-align:center}
.opt .big{display:block;font-size:50px;line-height:1.2}
.opt small{display:block;font-size:16px;color:var(--sub);margin-top:2px}
.opt.sel{border-color:var(--main);background:#f4fffd}
.opt:active,.btn:active,.tool:active{transform:translateY(3px);box-shadow:none}
.btn{display:block;width:100%;font-size:30px;padding:18px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:16px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:20px;white-space:nowrap}
.grow{flex:1}
.ward{flex:1;min-height:0;display:flex;gap:14px}
.left{flex:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:26px;position:relative;min-height:0;box-shadow:0 5px 0 var(--line);padding:8px}
.right{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
@media (orientation:portrait){.ward{flex-direction:column}.left{flex:none;height:46vh}.right{flex:1}}
.bubble{background:#fff8e6;border:3px solid #ffd27a;border-radius:22px;padding:10px 16px;font-size:24px;text-align:center;position:relative;max-width:92%;margin-bottom:6px;word-break:keep-all}
.bubble:after{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:10px solid transparent;border-top-color:#ffd27a}
svg.pt{height:100%;max-height:100%;width:auto;flex:1;min-height:0}
.stage{font-size:22px;text-align:center;color:var(--main-d)}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line)}
.card h3{font-weight:normal;font-size:24px;margin:0 0 10px;text-align:center}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tool{background:#f6fbfa;border-radius:18px;padding:8px 4px;text-align:center;font-size:17px;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.tool .ic{display:block;font-size:44px;line-height:1.2;height:54px}
.tool.no{opacity:.4}
.tool.hint{border-color:#ffc107;animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 6px rgba(255,193,7,.35)}}
.result{font-size:24px;text-align:center;line-height:1.5;padding:6px;word-break:keep-all}
.tip{background:#fffbea;border-radius:18px;padding:14px;font-size:22px;line-height:1.6;text-align:center;word-break:keep-all}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.steps span{width:16px;height:16px;border-radius:50%;background:var(--line)}
.steps span.on{background:var(--main)}
.fx{position:absolute;font-size:70px;pointer-events:none;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.mark{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:.9}}
.overlay{position:fixed;inset:0;background:rgba(20,50,45,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:24px;max-width:520px;width:100%;text-align:center}
.conf{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.healed{font-size:46px;letter-spacing:4px;line-height:1.3}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[R(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function hasB(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
function J(w,p){var m={'이가':['이','가'],'은는':['은','는'],'을를':['을','를'],'아야':['아','야']};return w+(hasB(w)?m[p][0]:m[p][1]);}

// ---------- 환자와 도구 ----------
var ANIMALS=[['🐶','멍멍이','#e8c39e'],['🐱','야옹이','#f6c97f'],['🐰','깡총이','#f1e4e8'],['🐻','곰돌이','#b98a64'],['🐼','판다','#eeeeee'],['🦊','여우','#f0a35c'],
  ['🐯','호랑이','#f5b04c'],['🐨','코알라','#c7c9cc'],['🐷','꿀꿀이','#f8b8c6'],['🐸','개굴이','#9ad27a'],['🐵','원숭이','#c99a6e'],['🦁','사자','#f3c063'],['🐮','음매','#f2efe9'],['🐧','펭귄','#5d6a7a']];
// 몸 위치 (환자 그림 300x430 기준)
var SPOT={head:[150,30],forehead:[150,58],eye:[122,92],ear:[88,48],mouth:[150,132],chest:[150,228],tummy:[150,285],arm:[44,300],knee:[110,372],leg:[190,378],foot:[192,414]};
var DIAG={
  steth:{n:'청진기',ic:'🩺',use:'청진기로 숨소리를 들어요. 조금 차가울 수 있어요.'},
  thermo:{n:'체온계',ic:'🌡️',use:'체온계로 열을 재요. 아프지 않아요.'},
  light:{n:'손전등',ic:'🔦',use:'손전등으로 안을 비춰 봐요. "아~" 해 볼까요?'},
  loupe:{n:'돋보기',ic:'🔍',use:'돋보기로 자세히 살펴봐요.'},
  xray:{n:'엑스레이',ic:'xray',use:'엑스레이로 뼈 사진을 찍어요. 가만히 있으면 금방 끝나요.'}
};
var TREAT={
  medicine:{n:'약',ic:'💊'},water:{n:'물 마시기',ic:'🥤'},rest:{n:'푹 쉬기',ic:'🛏️'},wash:{n:'깨끗이 씻기',ic:'💧'},
  ointment:{n:'연고',ic:'🧴'},bandaid:{n:'반창고',ic:'🩹'},bandage:{n:'붕대',ic:'band'},ice:{n:'얼음찜질',ic:'🧊'},
  shot:{n:'주사',ic:'💉'},tooth:{n:'이 치료',ic:'🦷'},tweezers:{n:'핀셋',ic:'tweez'},eyedrop:{n:'안약',ic:'eyedrop'}
};
var SICK=[
  {id:'fever',name:'열이 나요',say:'몸이 뜨겁고 힘이 없어요…',spot:'forehead',diag:'thermo',found:'38.5도! 열이 나고 있어요.',
   steps:[['medicine','해열제를 먹어요. 시럽이라 달콤해요.'],['water','물을 꿀꺽꿀꺽 마셔요.'],['rest','이불 덮고 푹 쉬어요.']],tip:'열이 나면 물을 자주 마시고 푹 쉬어야 빨리 나아요.'},
  {id:'cough',name:'기침이 나요',say:'콜록콜록! 기침이 멈추지 않아요.',spot:'chest',diag:'steth',found:'숨소리가 쌕쌕! 감기에 걸렸어요.',
   steps:[['medicine','기침약을 먹어요.'],['water','따뜻한 물을 마셔요. 목이 편해져요.']],tip:'기침할 때는 팔꿈치로 입을 가려요. 그래야 친구에게 감기가 옮지 않아요.'},
  {id:'tooth',name:'이가 아파요',say:'이가 욱신욱신 아파요…',spot:'mouth',diag:'light',found:'이에 까만 구멍이 있어요. 충치예요!',
   steps:[['tooth','충치를 깨끗이 치료해요. 윙~ 소리가 나도 괜찮아요.']],tip:'이는 하루 세 번, 3분 동안 구석구석 닦아요. 단 걸 먹은 뒤엔 꼭 양치!'},
  {id:'scrape',name:'무릎이 까졌어요',say:'넘어져서 무릎이 까졌어요. 따가워요!',spot:'knee',diag:'loupe',found:'상처에 흙이 묻어 있어요.',
   steps:[['wash','깨끗한 물로 상처를 씻어요.'],['ointment','연고를 살살 발라요.'],['bandaid','반창고를 붙여요. 다 됐어요!']],tip:'다치면 먼저 깨끗한 물로 씻어요. 그래야 세균이 들어가지 않아요.'},
  {id:'bone',name:'다리가 아파요',say:'다리가 너무 아파서 못 걷겠어요.',spot:'leg',diag:'xray',found:'뼈에 살짝 금이 갔어요.',
   steps:[['bandage','붕대로 단단히 감아서 움직이지 않게 해요.'],['rest','다리를 쉬게 해 줘요.']],tip:'뼈가 다치면 움직이지 않게 고정해야 해요. 뼈는 쉬면서 다시 붙어요.'},
  {id:'splinter',name:'가시가 박혔어요',say:'발에 가시가 박혔어요. 콕콕 찔려요!',spot:'foot',diag:'loupe',found:'작은 가시를 찾았어요!',
   steps:[['tweezers','핀셋으로 가시를 쏙 빼요.'],['ointment','연고를 발라요.'],['bandaid','반창고를 붙여요.']],tip:'맨발로 다니면 가시에 찔릴 수 있어요. 밖에서는 신발을 신어요.'},
  {id:'bite',name:'벌레에 물렸어요',say:'모기에 물렸어요. 너무 간지러워요!',spot:'arm',diag:'loupe',found:'빨갛게 부어 있어요.',
   steps:[['ice','얼음으로 시원하게 해 줘요.'],['ointment','간지럼 멈추는 연고를 발라요.']],tip:'물린 곳을 긁으면 더 부어요. 긁지 말고 시원하게 해 줘요.'},
  {id:'tummy',name:'배가 아파요',say:'배가 꾸르륵꾸르륵 아파요.',spot:'tummy',diag:'steth',found:'배에서 꾸르륵 소리가 나요. 배탈이에요.',
   steps:[['medicine','배탈약을 먹어요.'],['water','물을 조금씩 마셔요.'],['rest','배를 따뜻하게 하고 쉬어요.']],tip:'밥 먹기 전에는 비누로 손을 깨끗이 씻어요. 배탈을 막아줘요.'},
  {id:'vaccine',name:'예방주사',say:'예방주사 맞으러 왔어요. 조금 무서워요…',spot:'arm',diag:'thermo',found:'36.5도, 건강해요! 주사를 맞아도 돼요.',
   steps:[['shot','하나, 둘, 셋! 따끔! 벌써 끝났어요. 정말 용감해요!'],['bandaid','주사 맞은 곳에 반창고를 붙여요.']],tip:'예방주사는 따끔하지만 우리 몸이 병과 싸울 힘을 미리 길러 줘요.'},
  {id:'bump',name:'머리를 부딪혔어요',say:'머리를 쿵! 부딪혔어요.',spot:'head',diag:'loupe',found:'혹이 볼록 났어요.',
   steps:[['ice','얼음으로 차갑게 대 줘요. 혹이 작아져요.']],tip:'뛰어다닐 때는 앞을 잘 보고 다녀요.'},
  {id:'eye',name:'눈이 가려워요',say:'눈이 가렵고 빨개요.',spot:'eye',diag:'light',found:'눈이 빨갛게 됐어요.',
   steps:[['eyedrop','안약을 한 방울 톡 넣어요. 시원해요.']],tip:'눈이 가려워도 손으로 비비지 말아요. 손에 세균이 있을 수 있어요.'},
  {id:'ear',name:'귀가 아파요',say:'귀가 웅웅 아파요.',spot:'ear',diag:'light',found:'귀 안이 빨갛게 부었어요.',
   steps:[['medicine','귀 아픈 데 먹는 약을 먹어요.'],['rest','푹 쉬어요.']],tip:'귀는 혼자 파지 말아요. 아프면 병원에 와요.'}
];
// 그림 아이콘 (이모지 없는 도구)
function svgIcon(k,s){s=s||48;var p={
  xray:'<rect x="8" y="6" width="48" height="52" rx="6" fill="#263238"/><path d="M24 18q-6-6 0-9q6 0 4 7v28q2 7-4 7q-6-3 0-9M40 18q6-6 0-9q-6 0-4 7v28q-2 7 4 7q6-3 0-9" fill="#eceff1"/>',
  band:'<rect x="10" y="16" width="44" height="32" rx="16" fill="#fff" stroke="#90a4ae" stroke-width="3"/><circle cx="26" cy="32" r="9" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><path d="M40 20v24M47 22v20" stroke="#cfd8dc" stroke-width="3"/>',
  tweez:'<path d="M14 54L38 10l4 2L22 56zM50 54L26 10l-4 2l20 44z" fill="#b0bec5" stroke="#607d8b" stroke-width="2"/>',
  eyedrop:'<rect x="24" y="22" width="16" height="30" rx="5" fill="#81d4fa" stroke="#0288d1" stroke-width="3"/><rect x="27" y="10" width="10" height="14" rx="3" fill="#fff" stroke="#0288d1" stroke-width="3"/><path d="M32 54q-4 6 0 8q4-2 0-8z" fill="#29b6f6"/>'}[k];
  return '<svg viewBox="0 0 64 64" width="'+s+'" height="'+s+'">'+p+'</svg>';}
function ro(w){var c=w.charCodeAt(w.length-1),b=(c-0xAC00)%28;return w+(c>=0xAC00&&c<=0xD7A3&&b!==0&&b!==8?'으로':'로');}
function icon(ic,s){return /^[a-z]+$/.test(ic)?svgIcon(ic,s):'<span class="em">'+ic+'</span>';}

// ---------- 저장 ----------
var KEY='kidsHospital.v1';
var D={healed:0,kinds:{},players:1,voice:true,music:true,sfx:true};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)D[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}

// ---------- 소리·읽어주기 ----------
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t,dur,type,vol){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sfx(k){if(!D.sfx)return;var a=ac();if(!a)return;var t=a.currentTime;
  if(k==='ok'){tone(784,t,0.12,'sine',0.15);tone(1175,t+0.09,0.18,'sine',0.13);}
  else if(k==='no')tone(300,t,0.15,'triangle',0.1);
  else if(k==='use')tone(660,t,0.08,'triangle',0.1);
  else if(k==='win')[659,784,988,1319].forEach(function(f,i){tone(f,t+i*0.12,0.2,'sine',0.15);});}
function hz(m){return 440*Math.pow(2,(m-69)/12);}
var SONG={beat:0.42,mel:[67,72,76,72,74,77,76,72,71,74,79,74,72,0,0,0],bass:[48,53,55,48]};
var music={timer:null,next:0,step:0};
function musicStart(){musicStop();if(!D.music)return;var a=ac();if(!a)return;music.step=0;music.next=a.currentTime+0.15;
  music.timer=setInterval(function(){while(music.next<a.currentTime+0.3){var n=SONG.mel[music.step%SONG.mel.length];if(n)tone(hz(n),music.next,SONG.beat*0.8,'sine',0.03);
    if(music.step%4===0)tone(hz(SONG.bass[Math.floor(music.step/4)%SONG.bass.length]),music.next,SONG.beat*3.8,'sine',0.04);music.next+=SONG.beat;music.step++;}},70);}
function musicStop(){if(music.timer){clearInterval(music.timer);music.timer=null;}}
function say(t){if(!D.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,''));u.lang='ko-KR';u.rate=0.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.hidden){musicStop();try{speechSynthesis.cancel();}catch(e){}}else if(screen==='ward')musicStart();});

// ---------- 환자 그림 ----------
function patientSvg(p){
  var c=p.animal[2],s=SPOT[p.sick.spot],marks='';
  p.marks.forEach(function(m){var q=SPOT[m.at]||s;
    if(m.k==='bandaid')marks+='<g transform="translate('+q[0]+' '+q[1]+') rotate(-25)"><rect x="-22" y="-9" width="44" height="18" rx="9" fill="#ffcc80" stroke="#c48a3a" stroke-width="2"/><rect x="-7" y="-6" width="14" height="12" fill="#fff3e0"/></g>';
    else if(m.k==='bandage')marks+='<g transform="translate('+q[0]+' '+q[1]+')"><rect x="-22" y="-28" width="44" height="56" rx="10" fill="#fff" stroke="#b0bec5" stroke-width="3"/><path d="M-22 -12h44M-22 4h44M-22 18h44" stroke="#cfd8dc" stroke-width="3"/></g>';
    else if(m.k==='ointment')marks+='<ellipse cx="'+q[0]+'" cy="'+q[1]+'" rx="20" ry="13" fill="rgba(255,255,255,.75)" stroke="#e0f2f1" stroke-width="2"/>';
  });
  var hurt=p.done?'':'<circle class="mark" cx="'+s[0]+'" cy="'+s[1]+'" r="'+(p.sick.spot==='tummy'||p.sick.spot==='chest'?34:24)+'" fill="#ff5252" opacity=".5"/>';
  var face=p.done?'😊':(p.found?'😣':'😢');
  return '<svg class="pt" viewBox="0 0 300 430" id="pt"><ellipse cx="150" cy="424" rx="110" ry="8" fill="rgba(0,0,0,.08)"/>'+
    '<path d="M100 330L112 410M200 330L190 410" stroke="'+c+'" stroke-width="34" stroke-linecap="round"/><ellipse cx="108" cy="414" rx="26" ry="14" fill="'+c+'" stroke="rgba(0,0,0,.15)" stroke-width="2"/><ellipse cx="192" cy="414" rx="26" ry="14" fill="'+c+'" stroke="rgba(0,0,0,.15)" stroke-width="2"/>'+
    '<path d="M80 210L42 300M220 210L258 300" stroke="'+c+'" stroke-width="30" stroke-linecap="round"/>'+
    '<ellipse cx="150" cy="262" rx="82" ry="96" fill="'+c+'" stroke="rgba(0,0,0,.15)" stroke-width="3"/><ellipse cx="150" cy="280" rx="48" ry="56" fill="rgba(255,255,255,.35)"/>'+
    '<text x="150" y="98" font-size="150" text-anchor="middle" dominant-baseline="middle" class="em">'+p.animal[0]+'</text>'+
    hurt+marks+'<text x="236" y="40" font-size="44" text-anchor="middle" class="em">'+face+'</text></svg>';
}

// ---------- 화면 ----------
var app=document.getElementById('app'),screen='home',W=null;
function go(s){screen=s;if(s!=='ward')musicStop();var hb=document.getElementById('hubbtn');if(hb)hb.style.display=s==='ward'||s==='choose'?'none':'';({home:rHome,ward:rWard,choose:rChoose})[s]();}
function rHome(){
  var kinds=Object.keys(D.kinds).length;
  var h='<h1>🏥 동물 병원</h1><div class="sub">아픈 동물 친구들이 기다리고 있어요.<br>진찰하고 치료해 주세요, 의사 선생님!</div>';
  h+='<div class="row r2" style="margin-top:16px"><div class="opt"><span class="big">🩺</span>치료한 환자<small style="font-size:22px;color:var(--ink)">'+D.healed+'명</small></div><div class="opt"><span class="big">📋</span>고친 병 종류<small style="font-size:22px;color:var(--ink)">'+kinds+' / '+SICK.length+'</small></div></div>';
  h+='<h2>누구랑 할까요?</h2><div class="row r2"><button class="opt'+(D.players===1?' sel':'')+'" onclick="App.set(\'players\',1)"><span class="big">👩‍⚕️</span>혼자 의사 하기<small>환자가 차례로 와요</small></button>'+
    '<button class="opt'+(D.players===2?' sel':'')+'" onclick="App.set(\'players\',2)"><span class="big">🧑‍⚕️🤒</span>의사·환자 나눠 하기<small>환자 친구가 아픈 곳을 골라요</small></button></div>';
  h+='<div class="row r3" style="margin-top:12px"><button class="opt'+(D.voice?' sel':'')+'" onclick="App.set(\'voice\',!D.voice)"><span class="big">🗣️</span>읽어주기 '+(D.voice?'켬':'끔')+'</button><button class="opt'+(D.music?' sel':'')+'" onclick="App.set(\'music\',!D.music)"><span class="big">🎵</span>음악 '+(D.music?'켬':'끔')+'</button><button class="opt'+(D.sfx?' sel':'')+'" onclick="App.set(\'sfx\',!D.sfx)"><span class="big">🔊</span>효과음 '+(D.sfx?'켬':'끔')+'</button></div>';
  h+='<button class="btn" onclick="App.open()">병원 문 열기! ▶</button>';
  app.innerHTML=h;
}
// 하루 진료: 환자 5명
function openClinic(){
  var an=shuffle(ANIMALS),sk=shuffle(SICK);
  W={queue:[],idx:0,healed:[]};
  for(var i=0;i<5;i++)W.queue.push({animal:an[i],sick:sk[i]});
  next();
}
function next(){
  if(W.idx>=W.queue.length){finishDay();return;}
  var q=W.queue[W.idx];
  W.p={animal:q.animal,sick:q.sick,found:false,step:0,marks:[],done:false,wrong:0,phase:'diag'};
  if(D.players===2){W.p.phase='pick';go('choose');return;}
  go('ward');setTimeout(function(){say(q.animal[1]+': '+q.sick.say);},300);
}
function rChoose(){
  var p=W.p,h='<div class="hud"><button class="pill" onclick="App.go(\'home\')">◀</button><span class="pill">🤒 환자 차례</span></div>';
  h+='<h2>환자 친구! 어떤 동물이 될래요?</h2><div class="row r4" style="grid-template-columns:repeat(7,1fr)">';
  ANIMALS.forEach(function(a,i){h+='<button class="opt'+(p.animal===a?' sel':'')+'" style="padding:6px" onclick="App.pa('+i+')"><span class="big em" style="font-size:40px">'+a[0]+'</span></button>';});
  h+='</div><h2>어디가 아픈지 골라요</h2><div class="row r4">';
  SICK.forEach(function(s,i){var sp=s.spot;h+='<button class="opt'+(p.sick===s?' sel':'')+'" onclick="App.ps('+i+')" style="font-size:20px"><span class="big" style="font-size:34px">'+({forehead:'🤒',chest:'😷',mouth:'🦷',knee:'🦵',leg:'🦵',foot:'🦶',arm:'💪',tummy:'🤢',head:'🤕',eye:'👁️',ear:'👂'}[sp])+'</span>'+s.name+'</button>';});
  h+='</div><button class="btn" onclick="App.toDoc()">다 골랐어요! 의사 선생님께 태블릿을 줘요 ▶</button>';
  app.innerHTML=h;
}
function rWard(){
  var p=W.p,h='<div class="hud"><button class="pill" onclick="App.go(\'home\')">◀</button><span class="pill">환자 '+(W.idx+1)+' / '+W.queue.length+'</span><span class="pill em">'+p.animal[0]+' '+p.animal[1]+'</span><span class="grow"></span><button class="pill" onclick="App.repeat()">🗣️ 다시 듣기</button></div>';
  h+='<div class="ward"><div class="left" id="left"><div class="bubble" id="bub">'+bubbleText()+'</div>'+patientSvg(p)+'</div><div class="right" id="right">'+panel()+'</div></div>';
  app.innerHTML=h;musicStart();
}
function bubbleText(){var p=W.p;if(p.done)return '고마워요, 의사 선생님! 이제 하나도 안 아파요! 😊';if(p.phase==='treat'&&p.sick.id==='vaccine')return '용기 내 볼게요! 💪';return p.sick.say;}
function panel(){
  var p=W.p,h='';
  if(p.phase==='diag'){
    h+='<div class="stage">1단계 · 진찰하기</div><div class="card"><h3>어떤 도구로 살펴볼까요?</h3><div class="tools">';
    Object.keys(DIAG).forEach(function(k){var d=DIAG[k];h+='<button class="tool'+(p.tried&&p.tried[k]?' no':'')+(p.wrong>=2&&k===p.sick.diag?' hint':'')+'" onclick="App.diag(\''+k+'\')"><span class="ic">'+icon(d.ic,48)+'</span>'+d.n+'</button>';});
    h+='</div></div><div class="result" id="res">'+(p.msg||'아픈 곳(빨간 동그라미)을 잘 보고 도구를 골라요.')+'</div>';
  }else if(p.phase==='treat'){
    var dots='';p.sick.steps.forEach(function(_,i){dots+='<span class="'+(i<p.step?'on':'')+'"></span>';});
    h+='<div class="stage">2단계 · 치료하기</div><div class="card" style="background:#f1fbf9"><div class="result">🔎 '+p.sick.found+'</div></div><div class="card"><div class="steps">'+dots+'</div><h3>'+(p.step===0?'어떻게 치료할까요?':'다음엔 뭘 할까요?')+'</h3><div class="tools">';
    Object.keys(TREAT).forEach(function(k){var t=TREAT[k],need=p.sick.steps[p.step][0];h+='<button class="tool'+(p.tried&&p.tried[k]?' no':'')+(p.wrong>=2&&k===need?' hint':'')+'" onclick="App.treat(\''+k+'\')"><span class="ic">'+icon(t.ic,48)+'</span>'+t.n+'</button>';});
    h+='</div></div><div class="result" id="res">'+(p.msg||'')+'</div>';
  }else{
    h+='<div class="stage">3단계 · 다 나았어요!</div><div class="tip">💡 <b>건강 상식</b><br>'+p.sick.tip+'</div>'+
      (p.sick.id==='vaccine'||p.sick.id==='tooth'||p.sick.id==='bone'?'<div class="tip" style="background:#eef7ff">🏅 <b>용기 배지</b><br>'+p.animal[1]+(hasB(p.animal[1])?'이는':'는')+' 무서웠지만 끝까지 잘 참았어요!</div>':'')+
      '<button class="btn" onclick="App.next()">'+(W.idx+1<W.queue.length?'다음 환자 부르기 ▶':'오늘 진료 끝! ▶')+'</button>';
  }
  return h;
}
function refresh(){var l=document.getElementById('left'),r=document.getElementById('right');if(!l)return;l.innerHTML='<div class="bubble" id="bub">'+bubbleText()+'</div>'+patientSvg(W.p);r.innerHTML=panel();}
function fx(ic){var l=document.getElementById('left'),svg=document.getElementById('pt');if(!l||!svg)return;var s=SPOT[W.p.sick.spot],r=svg.getBoundingClientRect(),lr=l.getBoundingClientRect(),k=r.height/430;
  var e=document.createElement('div');e.className='fx';e.innerHTML=icon(ic,80);e.style.left=(r.left-lr.left+(r.width-300*k)/2+s[0]*k)+'px';e.style.top=(r.top-lr.top+s[1]*k)+'px';l.appendChild(e);setTimeout(function(){e.remove();},1100);}
function diag(k){
  var p=W.p;if(p.phase!=='diag'||p.busy)return;p.tried=p.tried||{};
  if(k===p.sick.diag){sfx('ok');fx(DIAG[k].ic);p.busy=true;p.msg=DIAG[k].use;refresh();say(DIAG[k].use);
    setTimeout(function(){p.busy=false;p.found=true;p.phase='treat';p.tried={};p.wrong=0;p.msg='';refresh();say(p.sick.found+' 어떻게 치료할까요?');},2200);}
  else{sfx('no');p.tried[k]=1;p.wrong++;p.msg=ro(DIAG[k].n)+' 봤는데 이상한 곳이 없어요. 다른 도구를 써 볼까요?';refresh();say('여기는 괜찮아요. 다른 도구를 써 볼까요?');}
}
function treat(k){
  var p=W.p;if(p.phase!=='treat'||p.busy)return;p.tried=p.tried||{};var st=p.sick.steps[p.step];
  if(k===st[0]){sfx('use');fx(TREAT[k].ic);p.busy=true;p.msg='✅ '+st[1];
    if(k==='bandaid'||k==='bandage'||k==='ointment')p.marks=p.marks.filter(function(m){return !(k==='bandaid'&&m.k==='ointment');}).concat([{k:k,at:p.sick.spot}]);
    refresh();say(st[1]);
    setTimeout(function(){p.busy=false;p.step++;p.tried={};p.wrong=0;
      if(p.step>=p.sick.steps.length){p.done=true;p.phase='done';p.msg='';healed();refresh();say('고마워요, 의사 선생님! '+p.sick.tip);}
      else{p.msg='';refresh();}},k==='shot'?2600:1800);}
  else{sfx('no');p.tried[k]=1;p.wrong++;p.msg='음… 지금은 '+TREAT[k].n+'보다 다른 게 필요해요.';refresh();say('지금은 다른 게 필요해요.');}
}
function healed(){sfx('win');confetti();D.healed++;D.kinds[W.p.sick.id]=(D.kinds[W.p.sick.id]||0)+1;save();W.healed.push(W.p.animal[0]);}
function finishDay(){
  musicStop();var o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="panel"><div style="font-size:70px">🏥</div><div style="font-size:32px">오늘 진료 끝!</div><div class="healed em">'+W.healed.join(' ')+'</div><div style="font-size:22px;margin:8px 0;line-height:1.6">오늘 '+W.healed.length+'명을 치료했어요.<br>지금까지 모두 '+D.healed+'명! 멋진 의사 선생님이에요 👩‍⚕️</div><button class="btn" id="ag">내일 진료도 하기</button><button class="btn ghost" id="hm">처음으로</button></div>';
  document.body.appendChild(o);say('오늘 진료 끝! 멋진 의사 선생님이에요.');
  o.querySelector('#ag').onclick=function(){o.remove();openClinic();};o.querySelector('#hm').onclick=function(){o.remove();go('home');};
}
function confetti(){var em=['🎉','⭐','💖','✨','🩹'];for(var i=0;i<18;i++){var s=document.createElement('div');s.className='conf em';s.textContent=em[i%em.length];s.style.left=R(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.4)+'s';s.style.animationDelay=(Math.random()*0.4)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},3600);})(s);}}
window.App={go:go,open:openClinic,diag:diag,treat:treat,
  next:function(){W.idx++;next();},repeat:function(){var p=W.p;say(p.phase==='diag'?p.animal[1]+': '+p.sick.say:(p.phase==='treat'?p.sick.found:p.sick.tip));},
  set:function(k,v){D[k]=v;save();rHome();},
  pa:function(i){W.p.animal=ANIMALS[i];rChoose();},ps:function(i){W.p.sick=SICK[i];rChoose();},
  toDoc:function(){W.p.phase='diag';go('ward');setTimeout(function(){say('의사 선생님, '+W.p.animal[1]+(hasB(W.p.animal[1])?'이가':'가')+' 왔어요. '+W.p.sick.say);},300);}};
go('home');
</script>
