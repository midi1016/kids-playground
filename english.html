  app.innerHTML='<div class="hud">'+back('tlist')+'<span class="pill">✏️ '+(up?'대문자':'소문자')+'</span><span class="grow"></span></div><div class="trace"><canvas class="pad" id="pad" style="width:'+S+'px;height:'+S+'px"></canvas>'+
   '<div class="tside"><div class="info"><span class="em ex" style="font-size:70px">'+a[2]+'</span><div class="w en" style="font-size:36px">'+a[3]+'</div>'+ko(a[4])+'</div>'+
   '<div class="msg" id="msg">흐린 글자 위를 손가락으로 따라 써요</div><button class="btn green" onclick="App.check()">✅ 다 썼어요</button><button class="btn ghost" onclick="App.clr()">🧽 지우기</button>'+
   '<div class="tg"><button onclick="App.tnext(-1)">◀ 앞 글자</button><button onclick="App.tnext(1)">다음 글자 ▶</button></div></div></div>';
  var cv=document.getElementById('pad'),dpr=window.devicePixelRatio||1;cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);
  TC.cv=cv;TC.ctx=cv.getContext('2d');TC.ctx.setTransform(dpr,0,0,dpr,0,0);TC.S=S;
  TC.ink=document.createElement('canvas');TC.ink.width=TC.ink.height=200;TC.ictx=TC.ink.getContext('2d');TC.inked=0;TC.hint=false;
  drawPad();bindPad();setTimeout(function(){sayEn(ch.toUpperCase()+'.');},250);
};
var strokes=[];
function drawPad(){
  var c=TC.ctx,S=TC.S;c.clearRect(0,0,S,S);
  c.strokeStyle='#e3ecf5';c.lineWidth=2;[0.22,0.48,0.74].forEach(function(f){c.beginPath();c.setLineDash(f===0.48?[8,8]:[]);c.moveTo(10,S*f);c.lineTo(S-10,S*f);c.stroke();});c.setLineDash([]);
  c.fillStyle=TC.hint?'rgba(255,200,0,.55)':'#e8eef5';glyph(c,G.ch,S);
  c.strokeStyle='#1c7ed6';c.lineWidth=S*0.075;c.lineCap='round';c.lineJoin='round';
  strokes.forEach(function(st){c.beginPath();st.forEach(function(p,k){if(k)c.lineTo(p[0]*S,p[1]*S);else c.moveTo(p[0]*S,p[1]*S);});if(st.length===1)c.lineTo(st[0][0]*S+0.1,st[0][1]*S);c.stroke();});
}
function bindPad(){
  strokes=[];var cv=TC.cv;
  function pt(ev){var r=cv.getBoundingClientRect();return [(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height];}
  cv.addEventListener('pointerdown',function(ev){ev.preventDefault();try{cv.setPointerCapture(ev.pointerId);}catch(e){}TC.down=true;strokes.push([pt(ev)]);drawPad();});
  cv.addEventListener('pointermove',function(ev){if(!TC.down)return;strokes[strokes.length-1].push(pt(ev));drawPad();});
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){TC.down=false;});});
}
function judge(){ // 글자 칸 중 칠한 비율, 칠한 것 중 밖으로 나간 비율
  var N=200,g=document.createElement('canvas');g.width=g.height=N;var gc=g.getContext('2d');gc.fillStyle='#000';glyph(gc,G.ch,N);
  var z=document.createElement('canvas');z.width=z.height=N;var zc=z.getContext('2d');zc.fillStyle='#000';zc.strokeStyle='#000';glyph(zc,G.ch,N,'zone');
  var ic=document.createElement('canvas');ic.width=ic.height=N;var cc=ic.getContext('2d');cc.strokeStyle='#000';cc.lineWidth=N*0.11;cc.lineCap='round';cc.lineJoin='round';
  strokes.forEach(function(st){cc.beginPath();st.forEach(function(p,k){if(k)cc.lineTo(p[0]*N,p[1]*N);else cc.moveTo(p[0]*N,p[1]*N);});if(st.length===1)cc.lineTo(st[0][0]*N+0.1,st[0][1]*N);cc.stroke();});
  var gd=gc.getImageData(0,0,N,N).data,zd=zc.getImageData(0,0,N,N).data,id=cc.getImageData(0,0,N,N).data,gN=0,cov=0,iN=0,out=0;
  for(var k=3;k<gd.length;k+=8){var gi=gd[k]>100,ii=id[k]>100;if(gi){gN++;if(ii)cov++;}if(ii){iN++;if(zd[k]<100)out++;}}
  return {cov:gN?cov/gN:0,out:iN?out/iN:1,ink:iN};
}
function check(){
  if(!strokes.length){document.getElementById('msg').innerHTML='먼저 글자를 따라 써 봐요 ✏️';return;}
  var j=judge(),m=document.getElementById('msg');
  if(j.cov>=0.62&&j.out<=0.3){
    try{kidsGate.add(1);}catch(e){}D.trace[G.ch]=1;save();sfx('win');conf();sayEn(G.ch.toUpperCase()+'. '+G.a[3]);
    m.innerHTML='<span class="good">참 잘 썼어요! ⭐</span>';TC.hint=false;drawPad();
    setTimeout(function(){if(scr==='trace')App.tnext(1);},2200);
  }else{
    G.miss++;sfx('no');m.innerHTML='<span class="bad">'+(j.out>0.3?'글자 밖으로 나갔어요. 흐린 글자 위로만 써 봐요':'아직 덜 채웠어요. 흐린 글자를 모두 덮어 봐요')+'</span>';
    if(G.miss>=2){TC.hint=true;m.innerHTML+='<br>💡 노란 글자를 따라 써요';}strokes=[];drawPad();
  }
}

  sayL:function(i){sayEn(ABC[i][0]+'.');},sayW:function(i){sayEn(ABC[i][3]);},
  sa:function(b){var ok=b.getAttribute('data-k')===G.ansKey;if(answer(b,ok,function(){nextQ(qSent,'sent');})){document.getElementById('msg').innerHTML='<span class="good">'+G.ok+' 🎉</span>';sayEn(G.say);}},word:sentWord,
  rep:function(){if(!G)return;if(G.kind==='sent'){if(G.ty==='gram'&&G.miss<2)return;sayEn(G.say);return;}if(G.kind==='vquiz'&&G.qt!=='a'&&G.miss<2)return;if(G.kind==='quiz')sayEn(G.ans[3]);else sayEn(G.ans[0]);},
  vt:function(i){D.vt=i;save();go('vcard',0);},vc:function(d){var n=VT[D.vt].w.length;go('vcard',(G.i+d+n)%n);},
  va:function(b){G.ansKey=G.ans[0];var k=b.getAttribute('data-k'),ok=k===G.ans[0],first=!G.miss;
    if(!ok&&G.qt!=='a')sayEn(k);
    if(answer(b,ok,function(){nextQ(qVoc,'voc'+D.vt);})){if(first){D.vocab[G.ans[0]]=1;save();}var a=G.ans;document.getElementById('msg').innerHTML='<span class="good"><span class="em">'+a[1]+'</span> <span class="en">'+a[0]+'</span> '+(D.ko?a[2]+' ':'')+'🎉</span>';sayEn(a[0]);}},
  qa:function(b){G.ansKey=G.ans[0];var ok=b.getAttribute('data-k')===G.ans[0];if(answer(b,ok,function(){nextQ(qQuiz,'quiz');})){var a=G.ans,w=a[3],l=a[0].toLowerCase();document.getElementById('msg').innerHTML='<span class="good"><span class="en"><b style="color:#e8590c">'+w.charAt(0)+'</b>'+w.slice(1)+'</span> '+(D.ko?a[4]+' ':'')+'🎉</span>';}},
  la:function(b){G.ansKey=G.ans[0];var ok=b.getAttribute('data-k')===G.ans[0];if(answer(b,ok,function(){nextQ(qListen,'listen'+D.lv);})){document.getElementById('msg').innerHTML='<span class="good"><span class="en">'+G.ans[0]+'</span> '+(D.ko?G.ans[2]+' ':'')+'🎉</span>';sayEn(G.ans[0]);}},
  tile:tile,flip:flip,memN:function(k){D.mem=k;save();go('mem');},
  check:check,clr:function(){strokes=[];drawPad();},
  tnext:function(d){var up=G.ch===G.ch.toUpperCase(),i=ABC.map(function(a){return a[0];}).indexOf(G.ch.toUpperCase());i=(i+d+26)%26;var c=ABC[i][0];go('trace',up?c:c.toLowerCase());}};
window.__T={VT:VT,D:function(){return D;},judge:judge,strokes:function(){return strokes;},G:function(){return G;},LV:LV,ABC:ABC};
go('home');
