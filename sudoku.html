<script>(function(){var S=window.screen;function g(){try{return +(JSON.parse(localStorage.getItem('kidsUI.v1')||'{}').scale)||1;}catch(e){return 1;}}var lw=-1;function fit(s){if(s==null)s=g();var m=document.querySelector('meta[name=viewport]');if(!m)return;var a=S.width,b=S.height,o=S.orientation&&S.orientation.type,w=o?(o.indexOf('landscape')===0?Math.max(a,b):Math.min(a,b)):a;lw=a;m.setAttribute('content',s===1?'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no':'width='+Math.round(w/s)+',initial-scale='+s+',minimum-scale='+s+',maximum-scale='+s+',user-scalable=no');}window.kidsFit=fit;fit();function chk(){if(S.width!==lw)fit();}window.addEventListener('orientationchange',function(){setTimeout(chk,300);});window.addEventListener('resize',chk);})();</script>
<script>(function(){var ss=window.speechSynthesis,vs=[],ko=null,keep=[];function load(){if(!ss)return;try{vs=ss.getVoices()||[];}catch(e){vs=[];}ko=null;for(var i=0;i<vs.length;i++){var l=String(vs[i].lang||'').toLowerCase().replace('_','-');if(l.indexOf('ko')===0&&(!ko||vs[i].localService))ko=vs[i];}}if(ss){load();try{ss.addEventListener('voiceschanged',load);}catch(e){ss.onvoiceschanged=load;}}window.kidsVoiceInfo=function(){load();return {api:!!ss,n:vs.length,ko:ko?ko.name+' ('+ko.lang+')':''};};window.kidsSpeak=function(t,rate){if(!ss)return;try{var busy=ss.speaking||ss.pending;if(busy)ss.cancel();if(!ko)load();var u=new SpeechSynthesisUtterance(String(t));u.lang=ko?ko.lang:'ko-KR';if(ko)u.voice=ko;u.rate=rate||0.95;u.volume=1;keep.push(u);if(keep.length>6)keep.shift();var go=function(){try{if(ss.paused)ss.resume();ss.speak(u);}catch(e){}};if(busy)setTimeout(go,150);else go();}catch(e){}};function unlock(){document.removeEventListener('pointerdown',unlock,true);try{if(ss&&!ss.speaking&&!ss.pending){var u=new SpeechSynthesisUtterance(' ');u.volume=0;keep.push(u);ss.speak(u);}}catch(e){}}document.addEventListener('pointerdown',unlock,true);})();</script>
<script>(function(){var K='kidsGate.v1';function p2(n){return (n<10?'0':'')+n;}function day(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}function prof(){try{var H=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');return H.profiles.filter(function(x){return x.id===H.cur;})[0]||H.profiles[0]||null;}catch(e){return null;}}function grade(){var p=prof();return (p&&p.grade)||'K';}function get(){var g={on:true,goal:15,day:'',sec:0,free:'',pin:'',done:0};try{var o=JSON.parse(localStorage.getItem(K)||'{}');for(var k in o)g[k]=o[k];}catch(e){}if(g.day!==day()){g.day=day();g.sec=0;g.done=0;}return g;}function put(g){try{localStorage.setItem(K,JSON.stringify(g));}catch(e){}}function study(){return grade()==='K'?['math','hangul']:['math'];}function page(){var m=String(location.pathname).match(/([A-Za-z0-9_-]+)\.html$/);return m?m[1]:'index';}function open(g){g=g||get();return !g.on||g.free===day()||g.sec>=g.goal*60;}function kind(n){n=n||page();return n==='index'?'hub':(study().indexOf(n)>=0?'study':'play');}window.kidsGate={get:get,put:put,open:open,study:study,kind:kind,day:day,grade:grade,prof:prof};var pg=page(),kd=kind(pg);if(kd==='play'&&!open()){location.replace('index.html#locked');return;}if(kd==='study'){var last=Date.now();['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){last=Date.now();},true);});setInterval(function(){if(document.visibilityState&&document.visibilityState!=='visible')return;if(Date.now()-last>60000)return;var g=get(),was=open(g);g.sec+=5;if(!was&&open(g)&&!g.done){g.done=1;put(g);toast();}else put(g);},5000);}function toast(){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:#2ecc71;color:#fff;font-family:Jua,sans-serif;font-size:24px;padding:12px 24px;border-radius:999px;box-shadow:0 6px 0 #22a35a;text-align:center;max-width:92vw';d.innerHTML='🎉 오늘 공부 목표 완료! 이제 놀이를 할 수 있어요';document.body.appendChild(d);setTimeout(function(){d.remove();},7000);try{if(window.kidsSpeak)kidsSpeak('오늘 공부 목표 완료! 이제 놀이를 할 수 있어요');}catch(e){}}})();</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fab005">
<title>그림 스도쿠</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff9db;--ink:#3d3420;--sub:#8c7d55;--main:#fab005;--main-d:#e67700;--line:#ffe8a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#app{height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;padding:12px 14px}
#app.home{overflow-y:auto;padding-bottom:70px}
h1{font-weight:normal;font-size:44px;text-align:center;margin:6px 0 4px}
h3{font-weight:normal;font-size:24px;margin:16px 0 8px}
.sub{text-align:center;color:var(--sub);font-size:20px;line-height:1.5}
.rule{background:#fff;border-radius:20px;padding:12px 16px;font-size:21px;text-align:center;box-shadow:0 4px 0 var(--line);margin-top:10px;line-height:1.5}
.opts{display:grid;gap:10px}
.o3{grid-template-columns:repeat(3,1fr)}.o5{grid-template-columns:repeat(5,1fr)}
@media (max-width:700px){.o5{grid-template-columns:repeat(3,1fr)}}
.opt{background:#fff;border-radius:18px;padding:10px 4px;box-shadow:0 4px 0 var(--line);border:4px solid transparent;font-size:21px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.opt b{font-weight:normal;font-size:30px}.opt small{font-size:15px;color:var(--sub)}.opt .st{color:#f08c00;font-size:16px;min-height:18px}
.opt.sel{border-color:var(--main);background:#fffbea}
.opt:active,.btn:active,.pill:active,.key:active{transform:translateY(3px);box-shadow:none}
.tg{display:flex;gap:10px;justify-content:center;margin-top:14px}
.tg button{background:#fff;border-radius:999px;padding:8px 16px;font-size:20px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.tg button.on{border-color:var(--main)}
.btn{display:block;width:100%;font-size:30px;padding:16px;border-radius:22px;background:var(--main);color:#fff;box-shadow:0 6px 0 var(--main-d);margin-top:14px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.stick{position:sticky;bottom:6px;margin-left:120px;width:calc(100% - 120px)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:20px;white-space:nowrap}
.grow{flex:1}
.play{flex:1;min-height:0;display:flex;gap:16px;align-items:stretch}
.bbox{flex:1.2;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;justify-content:center}
@media (orientation:portrait){.play{flex-direction:column}.bbox{flex:none;height:56vh}.side{flex:1;justify-content:flex-start}}
.board{display:grid;background:#5c4b1f;border:6px solid #5c4b1f;border-radius:16px;gap:2px;overflow:hidden}
.cell{background:#fff;display:flex;align-items:center;justify-content:center;position:relative;line-height:1}
.cell.giv{background:#fff3bf}
.cell.peer{background:#fffdf0}.cell.giv.peer{background:#ffec99}
.cell.sel{background:#ffe066!important;box-shadow:inset 0 0 0 4px #f59f00}
.cell.bad{background:#ffc9c9!important;animation:shake .35s}
.cell.conf{box-shadow:inset 0 0 0 5px #fa5252}
.cell.pop span{animation:pop .3s}
.cell .gh{opacity:.28}
.cell .num{font-family:'Jua',sans-serif;color:#364fc7}
.cell.giv .num{color:#3d3420}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.msg{background:#fff;border-radius:18px;padding:10px 14px;font-size:22px;text-align:center;box-shadow:0 4px 0 var(--line);min-height:54px;line-height:1.4;word-break:keep-all}
.msg .bad{color:#e03131}.msg .good{color:#2b8a3e}
.keys{display:grid;gap:10px}
.key{background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);border:4px solid transparent;display:flex;align-items:center;justify-content:center;height:96px}
.key.on{border-color:var(--main);background:#fffbea}
.key.done{opacity:.35}
.ctl{display:flex;gap:10px}
.ctl button{flex:1;background:#fff;border-radius:18px;padding:12px 6px;font-size:22px;box-shadow:0 5px 0 var(--line)}
.overlay{position:fixed;inset:0;background:rgba(60,45,10,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{background:#fff;border-radius:28px;padding:24px;max-width:480px;width:100%;text-align:center}
.rate{font-size:54px;letter-spacing:6px;color:#f08c00}
.conf2{position:fixed;top:-60px;font-size:36px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[R(0,a.length-1)];}
var SETS=[
  {n:'과일',e:'🍎',s:[['🍎','사과'],['🍌','바나나'],['🍇','포도'],['🍓','딸기'],['🍊','귤'],['🍉','수박']]},
  {n:'동물',e:'🐶',s:[['🐶','강아지'],['🐱','고양이'],['🐰','토끼'],['🐻','곰'],['🐼','판다'],['🐷','돼지']]},
  {n:'바다',e:'🐳',s:[['🐳','고래'],['🐙','문어'],['🐠','물고기'],['🦀','게'],['🐬','돌고래'],['🐢','거북이']]},
  {n:'탈것',e:'🚗',s:[['🚗','자동차'],['🚌','버스'],['🚀','로켓'],['🚲','자전거'],['✈️','비행기'],['🚂','기차']]},
  {n:'숫자',e:'🔢',num:1,s:[['1','일'],['2','이'],['3','삼'],['4','사'],['5','오'],['6','육']]}
];
var LVS=[
  {k:'4e',n:4,br:2,bc:2,blank:5,nm:'4×4',d:'쉬움'},{k:'4n',n:4,br:2,bc:2,blank:8,nm:'4×4',d:'보통'},{k:'4h',n:4,br:2,bc:2,blank:11,nm:'4×4',d:'어려움'},
  {k:'6e',n:6,br:2,bc:3,blank:12,nm:'6×6',d:'쉬움'},{k:'6n',n:6,br:2,bc:3,blank:19,nm:'6×6',d:'보통'},{k:'6h',n:6,br:2,bc:3,blank:24,nm:'6×6',d:'어려움'}
];
var KEY='kidsSudoku.v1';
var D={best:{},solved:0,lv:-1,set:0,voice:true,sfx:true};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)D[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
var NAME='',GRADE='K';try{var HB=JSON.parse(localStorage.getItem('kidsHub.v1')||'null');if(HB&&HB.profiles){var PF=HB.profiles.filter(function(x){return x.id===HB.cur;})[0]||HB.profiles[0];if(PF){NAME=PF.name;GRADE=PF.grade||'K';}}}catch(e){}
if(D.lv<0)D.lv={K:0,'1':1,'2':3,'3':4}[GRADE]||0;

// ---------- 판 만들기 ----------
function boxOf(L,r,c){return Math.floor(r/L.br)*L.br+Math.floor(c/L.bc);}
function makeSolution(L){var n=L.n,g=[],r,c;
  for(r=0;r<n;r++){g[r]=[];for(c=0;c<n;c++)g[r][c]=(L.bc*(r%L.br)+Math.floor(r/L.br)+c)%n;}
  var bands=shuffle(range(n/L.br)),rows=[];bands.forEach(function(b){shuffle(range(L.br)).forEach(function(i){rows.push(b*L.br+i);});});
  var stacks=shuffle(range(n/L.bc)),cols=[];stacks.forEach(function(s){shuffle(range(L.bc)).forEach(function(i){cols.push(s*L.bc+i);});});
  var sym=shuffle(range(n));return rows.map(function(rr){return cols.map(function(cc){return sym[g[rr][cc]];});});}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
function canPut(L,g,r,c,v){for(var i=0;i<L.n;i++){if(g[r][i]===v||g[i][c]===v)return false;}var r0=Math.floor(r/L.br)*L.br,c0=Math.floor(c/L.bc)*L.bc;for(var a=0;a<L.br;a++)for(var b=0;b<L.bc;b++)if(g[r0+a][c0+b]===v)return false;return true;}
function countSol(L,g,lim){var n=L.n;for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(g[r][c]<0){var cnt=0;for(var v=0;v<n;v++)if(canPut(L,g,r,c,v)){g[r][c]=v;cnt+=countSol(L,g,lim-cnt);g[r][c]=-1;if(cnt>=lim)return cnt;}return cnt;}return 1;}
function makePuzzle(L){var sol=makeSolution(L),g=sol.map(function(r){return r.slice();}),cells=shuffle(range(L.n*L.n)),rm=0;
  for(var i=0;i<cells.length&&rm<L.blank;i++){var r=Math.floor(cells[i]/L.n),c=cells[i]%L.n,v=g[r][c];g[r][c]=-1;if(countSol(L,g.map(function(x){return x.slice();}),2)!==1)g[r][c]=v;else rm++;}
  return {sol:sol,giv:g};}

// ---------- 소리·읽어주기 ----------
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t,dur,type,vol,f2){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function sfx(k){if(!D.sfx)return;var a=ac();if(!a)return;var t=a.currentTime;
  if(k==='tap')tone(700,t,0.05,'square',0.03);
  else if(k==='ok'){tone(784,t,0.1,'sine',0.14);tone(1175,t+0.08,0.16,'sine',0.12);}
  else if(k==='no')tone(260,t,0.18,'triangle',0.1);
  else if(k==='win')[523,659,784,1047,1319].forEach(function(f,i){tone(f,t+i*0.1,0.22,'square',0.05);tone(f,t+i*0.1,0.22,'sine',0.1);});}
function say(t){if(!D.voice||!window.speechSynthesis)return;try{kidsSpeak(t,0.95);}catch(e){}}
function hasB(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
function ga(w){return w+(hasB(w)?'이':'가');}

// ---------- 화면 ----------
var app=document.getElementById('app'),scr='home',G=null;
function go(s){scr=s;var hb=document.getElementById('hubbtn');if(hb)hb.style.display=s==='home'?'':'none';app.className=s;({home:rHome,play:rPlay})[s]();}
function stars(n){var s='';for(var i=0;i<3;i++)s+=i<n?'★':'☆';return s;}
function symHtml(S,v,size,cls){var t=S.s[v][0];return '<span class="'+(S.num?'num ':'em ')+(cls||'')+'" style="font-size:'+size+'px">'+t+'</span>';}
function rHome(){
  var S=SETS[D.set],h='<h1>🔢 그림 스도쿠</h1><div class="rule">가로줄, 세로줄, <b>굵은 네모</b> 안에<br>같은 그림이 <b>한 번씩만</b> 들어가요!</div>';
  h+='<h3>어떤 그림으로 할까요?</h3><div class="opts o5">';
  SETS.forEach(function(s,i){h+='<button class="opt'+(D.set===i?' sel':'')+'" onclick="App.set('+i+')"><b class="'+(s.num?'':'em')+'">'+s.e+'</b>'+s.n+'</button>';});
  h+='</div><h3>크기와 난이도</h3><div class="opts o3">';
  LVS.forEach(function(L,i){var b=D.best[L.k];h+='<button class="opt'+(D.lv===i?' sel':'')+'" onclick="App.lv('+i+')"><b>'+L.nm+'</b>'+L.d+'<small>빈칸 '+L.blank+'개</small><span class="st">'+(b?stars(b):'')+'</span></button>';});
  h+='</div><div class="tg"><button class="'+(D.voice?'on':'')+'" onclick="App.tog(\'voice\')">🗣️ 읽어주기 '+(D.voice?'켬':'끔')+'</button><button class="'+(D.sfx?'on':'')+'" onclick="App.tog(\'sfx\')">🔊 효과음 '+(D.sfx?'켬':'끔')+'</button></div>';
  h+='<button class="btn stick" onclick="App.start()">'+LVS[D.lv].nm+' '+LVS[D.lv].d+' 시작! ▶</button>';
  var st=app.scrollTop;app.innerHTML=h;app.scrollTop=st;
}
function start(){
  var L=LVS[D.lv],pz=makePuzzle(L),n=L.n,cur=pz.giv.map(function(r){return r.slice();});
  G={L:L,S:SETS[D.set],sol:pz.sol,giv:pz.giv,cur:cur,sel:null,key:null,miss:0,wrong:{},ghost:{},lock:false,done:false,msg:''};
  var first=null;for(var r=0;r<n&&!first;r++)for(var c=0;c<n;c++)if(cur[r][c]<0){first=[r,c];break;}G.sel=first;
  go('play');setMsg('빈칸을 누르고, 아래에서 들어갈 그림을 골라요!');say((NAME?NAME+', ':'')+'가로줄, 세로줄, 굵은 네모 안에 같은 그림이 한 번씩만 들어가요.');
}
function rPlay(){
  var L=G.L;
  app.innerHTML='<div class="hud"><button class="pill" onclick="App.home()">◀</button><span class="pill"><span class="'+(G.S.num?'':'em')+'">'+G.S.e+'</span> '+L.nm+' '+L.d+'</span><span class="pill" id="left"></span><span class="grow"></span><span class="pill">❌ <span id="ms">'+G.miss+'</span></span></div>'+
    '<div class="play"><div class="bbox" id="bbox"><div class="board" id="board"></div></div><div class="side"><div class="msg" id="msg"></div><div class="keys" id="keys"></div><div class="ctl"><button onclick="App.hint()">💡 힌트</button><button onclick="App.start()">🔄 새 판</button></div></div></div>';
  layout();rBoard();rKeys();rMsg();
}
function layout(){var b=document.getElementById('bbox'),s=Math.min(b.clientWidth,b.clientHeight)-4,bd=document.getElementById('board');bd.style.width=s+'px';bd.style.height=s+'px';G.cs=(s-12-2*(G.L.n-1))/G.L.n;
  bd.style.gridTemplateColumns='repeat('+G.L.n+',1fr)';}
function rBoard(){
  var L=G.L,n=L.n,h='',sel=G.sel,fs=Math.floor(G.cs*0.62);
  for(var r=0;r<n;r++)for(var c=0;c<n;c++){var v=G.cur[r][c],giv=G.giv[r][c]>=0,cl='cell'+(giv?' giv':'');
    if(sel&&!(sel[0]===r&&sel[1]===c)&&(sel[0]===r||sel[1]===c||boxOf(L,sel[0],sel[1])===boxOf(L,r,c)))cl+=' peer';
    if(sel&&sel[0]===r&&sel[1]===c)cl+=' sel';
    var st='';if(c%L.bc===0&&c)st+='margin-left:4px;';if(r%L.br===0&&r)st+='margin-top:4px;';
    var inner=v>=0?symHtml(G.S,v,fs):(G.ghost[r+','+c]!=null?symHtml(G.S,G.ghost[r+','+c],fs,'gh'):'');
    h+='<button class="'+cl+'" id="c'+r+'_'+c+'" style="'+st+'" onclick="App.cell('+r+','+c+')">'+inner+'</button>';}
  var bd=document.getElementById('board');bd.innerHTML=h;
  // 굵은 선: 칸 사이 간격으로 표현
  bd.style.gap='2px';
  var left=0;for(r=0;r<n;r++)for(c=0;c<n;c++)if(G.cur[r][c]<0)left++;document.getElementById('left').innerHTML='빈칸 '+left;
}
function rKeys(){var n=G.L.n,h='',cnt=[];for(var v=0;v<n;v++)cnt[v]=0;G.cur.forEach(function(row){row.forEach(function(v){if(v>=0)cnt[v]++;});});
  for(v=0;v<n;v++)h+='<button class="key'+(G.key===v?' on':'')+(cnt[v]>=n?' done':'')+'" onclick="App.key('+v+')">'+symHtml(G.S,v,n===4?60:48)+'</button>';
  var k=document.getElementById('keys');k.innerHTML=h;k.style.gridTemplateColumns='repeat('+(n===4?4:3)+',1fr)';}
function setMsg(m){G.msg=m;rMsg();}
function rMsg(){var e=document.getElementById('msg');if(e)e.innerHTML=G.msg;}
function selCell(r,c){
  if(G.done||G.lock)return;ac();
  if(G.giv[r][c]>=0){G.sel=null;sfx('tap');var nm=G.S.s[G.cur[r][c]][1];say(nm);rBoard();return;}
  G.sel=[r,c];sfx('tap');
  if(G.key!=null&&G.cur[r][c]<0){place(r,c,G.key);return;}
  rBoard();
}
function pressKey(v){
  if(G.done||G.lock)return;ac();
  if(G.sel&&G.cur[G.sel[0]][G.sel[1]]<0){place(G.sel[0],G.sel[1],v);return;}
  G.key=G.key===v?null:v;sfx('tap');rKeys();if(G.key!=null)setMsg(symHtml(G.S,v,30)+' 을(를) 넣을 빈칸을 눌러요');
}
function conflicts(r,c,v){var L=G.L,out=[];for(var i=0;i<L.n;i++){if(i!==c&&G.cur[r][i]===v)out.push([r,i,'가로줄']);if(i!==r&&G.cur[i][c]===v)out.push([i,c,'세로줄']);}
  var r0=Math.floor(r/L.br)*L.br,c0=Math.floor(c/L.bc)*L.bc;for(var a=0;a<L.br;a++)for(var b=0;b<L.bc;b++){var rr=r0+a,cc=c0+b;if((rr!==r||cc!==c)&&G.cur[rr][cc]===v&&rr!==r&&cc!==c)out.push([rr,cc,'굵은 네모']);}return out;}
function place(r,c,v){
  var nm=G.S.s[v][1],key=r+','+c;
  if(G.sol[r][c]===v){G.cur[r][c]=v;delete G.ghost[key];sfx('ok');
    var nx=null,n=G.L.n;for(var i=1;i<=n*n&&!nx;i++){var q=(r*n+c+i)%(n*n),rr=Math.floor(q/n),cc=q%n;if(G.cur[rr][cc]<0)nx=[rr,cc];}G.sel=nx;
    rBoard();rKeys();var el=document.getElementById('c'+r+'_'+c);if(el)el.classList.add('pop');
    if(!nx){win();return;}setMsg('<span class="good">'+pick(['맞았어요! ✨','최고예요! 🌟','딩동댕! 🎵'])+'</span>');say(nm);return;}
  G.miss++;G.wrong[key]=(G.wrong[key]||0)+1;document.getElementById('ms').textContent=G.miss;sfx('no');G.lock=true;
  var el2=document.getElementById('c'+r+'_'+c);if(el2){el2.innerHTML=symHtml(G.S,v,Math.floor(G.cs*0.62));el2.classList.add('bad');}
  var cf=conflicts(r,c,v),m;
  cf.forEach(function(q){var e=document.getElementById('c'+q[0]+'_'+q[1]);if(e)e.classList.add('conf');});
  if(cf.length)m='같은 <b>'+cf[0][2]+'</b>에 '+symHtml(G.S,v,26)+' 이(가) 벌써 있어요!';else m='음… 다른 그림을 생각해 볼까요? 🤔';
  if(G.wrong[key]>=2){G.ghost[key]=G.sol[r][c];m+='<br>💡 흐린 그림이 정답이에요';}
  setMsg('<span class="bad">'+m+'</span>');say(cf.length?ga(cf[0][2])+'에 '+ga(nm)+' 벌써 있어요':'다른 그림을 생각해 봐요');
  setTimeout(function(){if(!G)return;G.lock=false;rBoard();},900);
}
function erase(){/* 맞힌 칸은 고정이라 지울 것이 없음: 선택만 해제 */G.key=null;G.sel=null;rKeys();rBoard();setMsg('빈칸을 누르고, 아래에서 그림을 골라요!');}
function hint(){if(G.done||G.lock)return;var n=G.L.n,c0=G.sel&&G.cur[G.sel[0]][G.sel[1]]<0?G.sel:null;
  if(!c0){for(var r=0;r<n&&!c0;r++)for(var c=0;c<n;c++)if(G.cur[r][c]<0){c0=[r,c];break;}}if(!c0)return;
  G.sel=c0;G.ghost[c0[0]+','+c0[1]]=G.sol[c0[0]][c0[1]];G.hints=(G.hints||0)+1;sfx('tap');rBoard();setMsg('💡 흐린 그림을 골라서 넣어 봐요');}
function win(){
  G.done=true;var s=G.miss===0&&!G.hints?3:(G.miss+(G.hints||0)<=2?2:1),k=G.L.k;
  if(!D.best[k]||s>D.best[k])D.best[k]=s;D.solved=(D.solved||0)+1;save();
  sfx('win');confetti();setMsg('<span class="good">다 채웠어요! 🎉</span>');say('다 채웠어요! 정말 잘했어요!');
  var o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="panel"><div style="font-size:70px" class="em">🏆</div><div style="font-size:30px">스도쿠 완성!</div><div class="rate">'+stars(s)+'</div><div style="font-size:19px;color:#8c7d55">'+(s<3?'틀리지 않고 힌트 없이 풀면 ★★★':'한 번도 안 틀렸어요!')+'</div><button class="btn" id="ag">새 판 ▶</button>'+(D.lv<LVS.length-1?'<button class="btn ghost" id="up">한 단계 어렵게</button>':'')+'<button class="btn ghost" id="hm">처음으로</button></div>';
  setTimeout(function(){document.body.appendChild(o);},700);
  o.querySelector('#ag').onclick=function(){o.remove();start();};var up=o.querySelector('#up');if(up)up.onclick=function(){o.remove();D.lv++;save();start();};o.querySelector('#hm').onclick=function(){o.remove();go('home');};
}
function confetti(){var em=['🎉','⭐','🎊','✨','🏆'];for(var i=0;i<22;i++){var s=document.createElement('div');s.className='conf2 em';s.textContent=em[i%em.length];s.style.left=R(0,95)+'vw';
  s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(s);(function(n){setTimeout(function(){n.remove();},4000);})(s);}}
window.addEventListener('resize',function(){if(scr==='play'&&G){layout();rBoard();}});
window.App={set:function(i){D.set=i;save();rHome();},lv:function(i){D.lv=i;save();rHome();},tog:function(k){D[k]=!D[k];save();rHome();},start:start,home:function(){G=null;go('home');},
  cell:selCell,key:pressKey,erase:erase,hint:hint};
go('home');
</script>
